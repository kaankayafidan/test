    pv("#a2b-labA", { svgOrigin: C_LA, opacity: 0 });
    pv("#a2b-labB", { svgOrigin: C_LB, opacity: 0 });
    pv("#a2b-cloud", { svgOrigin: C_CL, opacity: 0 });
    pv("#a2b-boltA", { svgOrigin: C_BA, opacity: 0 });
    pv("#a2b-boltB", { svgOrigin: C_BB, opacity: 0 });
    pv("#a2b-nA", { svgOrigin: C_NA, opacity: 0 });
    pv("#a2b-nB", { svgOrigin: C_NB, opacity: 0 });
    pv("#a2b-q1", { svgOrigin: C_Q1, opacity: 0 });
    pv("#a2b-B-cup", { svgOrigin: CUP, x: 0, y: 0, rotation: 0 });
    pv("#a2b-B-head", { svgOrigin: NECK_B, rotation: 0 });
    pv("#a2b-rock", { svgOrigin: C_ROCK, rotation: 0 });
    pv("#a2b-x287", { svgOrigin: "214 118", opacity: 0 });
    pv("#a2b-x111", { svgOrigin: "840 118", opacity: 0 });
    pv("#a2b-flagA", { svgOrigin: "584 290", opacity: 0 });
    pv("#a2b-one", { svgOrigin: C_ONE });
    pv("#a2b-calc", { svgOrigin: "540 359" });
    pv("#a2b-F-cup", { svgOrigin: CUP5, x: 0, y: 0, rotation: 0, scale: 1 });
    // FX.course pops the 3 course ticks but does not hide them before their cue: hide them here.
    FX.init(tl, ["#a2b-course-i0", "#a2b-course-i1", "#a2b-course-i2"], { opacity: 0 });

    // ---------------------------------------------------------------- Zurückspulen (0,5 s)
    // "Trader A riskiert ...": schneller Rücklauf mit leichtem Rauszoomen (108 -> 100 %), dann steht das Bild:
    // beide stehen, Akkus voll (100 %).
    FX.tween(tl, "#a2b-art1", { attr: { viewBox: ZOOM_VB } }, { attr: { viewBox: FULL_VB }, duration: 0.5, ease: "power2.out" }, 0);
    FX.fadeOut(tl, "#a2b-q0", 0, 0.12);
    FX.tween(tl, "#a2b-batA-fill", { scaleX: 0.14 }, { scaleX: 1, duration: 0.4, ease: "power1.inOut", svgOrigin: FILL_A }, 0.05);
    FX.tween(tl, "#a2b-batB-fill", { scaleX: 0.9 }, { scaleX: 1, duration: 0.4, ease: "power1.inOut", svgOrigin: FILL_B }, 0.05);
    FX.set(tl, "#a2b-batA-fill", { attr: { fill: "#16A34A" } }, 0.25);
    FX.set(tl, ["#a2b-Asit", "#a2b-bang"], { opacity: 0 }, 0.25);
    FX.set(tl, "#a2b-A", { opacity: 1 }, 0.25);
    FX.set(tl, "#a2b-batA", { x: 0, y: 0 }, 0.25);
    FX.set(tl, "#a2b-rw", { opacity: 0 }, 0.5);
    FX.fadeIn(tl, ["#a2b-batA-t0", "#a2b-batB-t0"], 0.42, 0.15);

    // "... 10 Prozent ..., Trader B nur 1 Prozent.": über A "10 % pro Trade", über B "1 % pro Trade".
    const tLA = Math.max(0.7, C.a10 - 0.1);
    FX.pop(tl, "#a2b-labA", tLA, { svgOrigin: C_LA });
    const tLB = Math.max(tLA + 0.4, C.b1 - 0.1);
    FX.pop(tl, "#a2b-labB", tLB, { svgOrigin: C_LB });

    // ---------------------------------------------------------------- 10 Verluste am Stück
    // 10 Klicks im Takt, jedes Mal trifft ein roter Blitz beide: As Akku sackt stark ab, Bs kaum.
    // (Same rhythm formula as the 10 "tick" sfx in ad2-body.cues.json.)
    const dt = Math.min(0.62, Math.max(0.36, (C.schau - 0.4 - C.verluste) / 10));
    const t0 = C.verluste;
    FX.pop(tl, "#a2b-cloud", Math.max(tLB + 0.3, t0 - 0.15), { svgOrigin: C_CL });
    for (let k = 0; k < 10; k++) {
      const t = t0 + k * dt, hit = t + 0.1;
      // Blitz schlägt ein: Blitz ploppt in 0,1 s rein, 0,1 s weißer Flash, die Akkus wackeln 0,2 s.
      FX.tween(tl, "#a2b-boltA", { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.1, ease: "power2.out", svgOrigin: C_BA }, t);
      FX.tween(tl, "#a2b-boltB", { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.1, ease: "power2.out", svgOrigin: C_BB }, t);
      FX.tween(tl, "#a2b-flash", { opacity: 0.85 }, { opacity: 0, duration: 0.1, ease: "none" }, hit);
      [["#a2b-batA", PIV_A], ["#a2b-batB", PIV_B]].forEach(([el, o]) => {
        FX.tween(tl, el, { rotation: -4 }, { rotation: 4, duration: 0.05, yoyo: true, repeat: 3, ease: "sine.inOut", svgOrigin: o }, hit);
        FX.set(tl, el, { rotation: 0 }, hit + 0.2);
      });
      FX.tween(tl, ["#a2b-boltA", "#a2b-boltB"], { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "none" }, t + 0.24);
      // neuer Akkustand (Werte aus der Tabelle S. 12)
      FX.set(tl, ["#a2b-batA-t" + k, "#a2b-batB-t" + k], { opacity: 0 }, hit);
      FX.set(tl, ["#a2b-batA-t" + (k + 1), "#a2b-batB-t" + (k + 1)], { opacity: 1 }, hit);
      FX.tween(tl, "#a2b-batA-fill", { scaleX: VA[k] / 100 }, { scaleX: VA[k + 1] / 100, duration: 0.15, ease: "power2.out", svgOrigin: FILL_A }, hit);
      FX.tween(tl, "#a2b-batB-fill", { scaleX: VB[k] / 100 }, { scaleX: VB[k + 1] / 100, duration: 0.15, ease: "power2.out", svgOrigin: FILL_B }, hit);
      if (VA[k] >= 50 && VA[k + 1] < 50) FX.set(tl, "#a2b-batA-fill", { attr: { fill: "#DC2626" } }, hit);
      // A schwitzt immer mehr
      if (k === 2) { FX.set(tl, "#a2b-A-f0", { opacity: 0 }, hit); FX.set(tl, "#a2b-A-f1", { opacity: 1 }, hit); }
      if (k === 5) { FX.set(tl, "#a2b-A-f1", { opacity: 0 }, hit); FX.set(tl, "#a2b-A-f2", { opacity: 1 }, hit); }
      if (k % 2 === 1) FX.pop(tl, "#a2b-A-d" + (k - 1) / 2, hit + 0.05);
    }
    // B bleibt ruhig und nimmt zwischendurch einen Schluck Kaffee.
    const tSip = t0 + 4 * dt + 0.15;
    FX.tween(tl, "#a2b-B-arm", { attr: { d: ARM_REST } }, { attr: { d: ARM_SIP }, duration: 0.4, ease: "power2.inOut" }, tSip);
    FX.tween(tl, "#a2b-B-cup", { x: 0, y: 0, rotation: 0 }, { ...CUP_SIP, rotation: -28, duration: 0.4, ease: "power2.inOut", svgOrigin: CUP }, tSip);
    FX.tween(tl, "#a2b-B-head", { rotation: 0 }, { rotation: -6, duration: 0.4, ease: "power2.inOut", svgOrigin: NECK_B }, tSip);
    FX.set(tl, "#a2b-B-f0", { opacity: 0 }, tSip + 0.2);
    FX.set(tl, "#a2b-B-f1", { opacity: 1 }, tSip + 0.2);
    const tDown = tSip + 0.9;
    FX.tween(tl, "#a2b-B-arm", { attr: { d: ARM_SIP } }, { attr: { d: ARM_REST }, duration: 0.4, ease: "power2.inOut" }, tDown);
    FX.tween(tl, "#a2b-B-cup", { ...CUP_SIP, rotation: -28 }, { x: 0, y: 0, rotation: 0, duration: 0.4, ease: "power2.inOut", svgOrigin: CUP }, tDown);
    FX.tween(tl, "#a2b-B-head", { rotation: -6 }, { rotation: 0, duration: 0.4, ease: "power2.inOut", svgOrigin: NECK_B }, tDown);
    FX.set(tl, "#a2b-B-f1", { opacity: 0 }, tDown + 0.15);
    FX.set(tl, "#a2b-B-f0", { opacity: 1 }, tDown + 0.15);

    // ---------------------------------------------------------------- Endstand
    // "Schau, was danach übrig ist": über den Figuren A "34,9 %", B "90,4 %" (je 120 px).
    const tS = Math.max(t0 + 9 * dt + 0.45, C.schau - 0.05);
    FX.fadeOut(tl, ["#a2b-labA", "#a2b-labB", "#a2b-cloud", "#a2b-batA-t10", "#a2b-batB-t10"], tS - 0.15, 0.15);
    FX.pop(tl, "#a2b-nA", tS, { svgOrigin: C_NA });
    FX.pop(tl, "#a2b-nB", tS, { svgOrigin: C_NB });
    // "Bei Trader A sind fast zwei Drittel weg" / "bei Trader B nicht mal 10 Prozent": die Zahl pulsiert.
    const tPA = Math.max(tS + 0.5, C.drittel - 0.1);
    FX.pulse(tl, "#a2b-nA", tPA, 0.8, { svgOrigin: C_NA });
    const tPB = Math.max(tPA + 0.85, C.nichtmal - 0.1);
    FX.pulse(tl, "#a2b-nB", tPB, 0.8, { svgOrigin: C_NB });
    // "Und jetzt der Teil, den kaum einer kennt": ein "?" zwischen beiden.
    const tQ1 = Math.max(tPB + 0.85, C.teil - 0.1);
    FX.pop(tl, "#a2b-q1", tQ1, { svgOrigin: C_Q1 });

    // ---------------------------------------------------------------- Felsen und Stufe
    // "Trader A muss sein Restkonto fast verdreifachen": Zeichnung per Klick, A schiebt den Felsen hoch.
    const tR = Math.max(tQ1 + 0.5, C.trA - 0.1);
    FX.cut(tl, "#a2b-s1", "#a2b-s2", tR);
    const tStep = Math.max(tR + 1.6, C.trB - 0.1);
    // A und der Felsen kommen nur mühsam voran (Felsen rollt ein Stück den Hang hoch).
    const dPush = Math.max(0.6, tStep - 0.2 - (tR + 0.2));
    FX.tween(tl, "#a2b-push", { x: 0, y: 0 }, { x: 15, y: -11.4, duration: dPush, ease: "none" }, tR + 0.2);
    FX.tween(tl, "#a2b-rock", { rotation: 0 }, { rotation: 14, duration: dPush, ease: "none", svgOrigin: C_ROCK }, tR + 0.2);
    const tX1 = Math.max(tR + 0.4, C.verdreifachen - 0.1);
    FX.pop(tl, "#a2b-x287", tX1, { svgOrigin: "214 118" });
    // "... nur um wieder auf den Startwert zu kommen": Ziel-Fahne oben auf dem Berg.
    const tF = Math.max(tX1 + 0.4, C.startwert - 0.1);
    FX.pop(tl, "#a2b-flagA", tF, { svgOrigin: "584 290" });
    // "Trader B reicht ein kleines Plus ...": Zeichnung per Klick, B steigt eine kleine Stufe hoch (× 1,11).
    FX.fadeIn(tl, "#a2b-stepG", tStep);
    const tX2 = Math.max(tStep + 0.4, C.plus - 0.1);
    FX.pop(tl, "#a2b-x111", tX2, { svgOrigin: "840 118" });

    // ---------------------------------------------------------------- 1 %
    // "... sondern wie viel du pro Trade maximal riskierst.": großes "1 %" im Kreis.
    const t1 = Math.max(tX2 + 0.5, C.riskierst - 0.1);
    FX.cut(tl, "#a2b-s2", "#a2b-s3", t1);
    FX.pop(tl, "#a2b-one", t1, { svgOrigin: C_ONE });
    const tRing = Math.max(t1 + 0.3, C.maximal - 0.1);
    drawStroke("#a2b-ring", tRing, 0.5);

    // "Dafür musst du weder rechnen können wie ein Mathematiker ...": Taschenrechner, rot durchgestrichen.
    const t2 = Math.max(tRing + 0.7, C.rechnen - 0.1);
    FX.cut(tl, "#a2b-s3", "#a2b-s4", t2);
    FX.pop(tl, "#a2b-calc", t2, { svgOrigin: "540 359" });
    const tStrike = Math.max(t2 + 0.3, C.mathe - 0.05);
    drawStroke("#a2b-strike", tStrike, 0.3);
    // "... sondern nur diese eine Regel kennen": zurück zum "1 %" im Kreis.
    const t3 = Math.max(tStrike + 0.6, C.regel - 0.1);
    FX.cut(tl, "#a2b-s4", "#a2b-s3", t3);
    FX.pulse(tl, "#a2b-one", t3 + 0.1, 0.8, { svgOrigin: C_ONE });

    // ---------------------------------------------------------------- Kurs-Mockup + CTA
    // "Genau diese Regel, eine einfache Strategie und einen Plan ...": Kurs-Mockup, 3 Haken.
    const tK = Math.max(t3 + 1.0, C.genau);
    FX.set(tl, "#a2b-s3", { opacity: 0 }, tK);
    const tc1 = Math.max(tK + 0.35, C.regel2 - 0.05), tc2 = Math.max(tc1 + 0.4, C.strategie - 0.05), tc3 = Math.max(tc2 + 0.4, C.plan - 0.05);
    FX.course(tl, "a2b-course", tK, [tc1, tc2, tc3]);
    // "Klick unter dem Video auf „Mehr dazu“": CTA-Bild.
    const tCTA = Math.max(tc3 + 0.6, C.klick);
    FX.set(tl, "#a2b-course", { opacity: 0 }, tCTA);
    FX.cta(tl, "a2b-cta", tCTA);

    // ---------------------------------------------------------------- Schlussbild
    // "... bevor du deinen nächsten Trade setzt.": B hebt die Kaffeetasse in Richtung Kamera. Ende.
    // Das kleine Banner "Mehr dazu ↓" bleibt bis zum Ende stehen.
    const tE = Math.max(tCTA + 1.2, C.bevor - 0.05);
    FX.set(tl, "#a2b-cta", { opacity: 0 }, tE);
    FX.set(tl, "#a2b-s5", { opacity: 1 }, tE);
    FX.more(tl, "a2b-more", tE);
    const tT = tE + 0.15;
    FX.tween(tl, "#a2b-F-arm", { attr: { d: ARM5_REST } }, { attr: { d: ARM5_TOAST }, duration: 0.5, ease: "power2.inOut" }, tT);
    FX.tween(tl, "#a2b-F-cup", { x: 0, y: 0, rotation: 0, scale: 1 }, { ...CUP5_T, rotation: -6, scale: 1.6, duration: 0.5, ease: "power2.inOut", svgOrigin: CUP5 }, tT);
    FX.set(tl, "#a2b-F-f0", { opacity: 0 }, tT + 0.3);
    FX.set(tl, "#a2b-F-f1", { opacity: 1 }, tT + 0.3);
    // Kaffee dampft (endet unsichtbar vor dem letzten Frame, nichts springt am Ende).
    [["#a2b-F-st1", 0], ["#a2b-F-st2", 0.55]].forEach(([el, o]) => {
      const n = Math.floor((DUR - 0.4 - (tE + o)) / 1.1);
      if (n >= 1) FX.tween(tl, el, { y: 6, opacity: 1 }, { y: -16, opacity: 0, duration: 1.1, ease: "none", repeat: n - 1 }, tE + o);
    });

    window.__timelines["ad2-body"] = tl;
  </script>
</template>
