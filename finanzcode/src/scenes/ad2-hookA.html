  <script>
    const tl = gsap.timeline({ paused: true });
    const pv = (el, o) => FX.init(tl, el, { ...o, smoothOrigin: false });
    const END = DUR - 0.25;
    // Geometry from the drawing (SVG user units).
    const ARM_REST = "M792 422 Q820.4 453.5 842 490 Q860 471.6 874 450";
    const ARM_SIP = "M792 422 Q833.4 421.9 874 430 Q856.6 402 834 378";
    const CUP = "874 450", NECK = "791 385";

    // ---------------------------------------------------------------- initial states (t = 0)
    pv("#a2ha-B-cup", { svgOrigin: CUP, x: 0, y: 0, rotation: 0 });
    pv("#a2ha-B-head", { svgOrigin: NECK, rotation: 0 });
    pv("#a2ha-batB", { svgOrigin: "790 223", scale: 1 });
    pv("#a2ha-q", { svgOrigin: "556 471", scale: 1 });
    FX.init(tl, "#a2ha-B-f1", { opacity: 0 });

    // ---------------------------------------------------------------- Bewegung ab Frame 1
    // A: Akku fast leer, blinkt rot (zusammen mit dem roten "!").
    FX.blink(tl, ["#a2ha-batA-fill", "#a2ha-bang"], 0, END);

    // B nippt sichtbar am Kaffee: Tasse zum Mund, kurz halten, wieder runter (Augen zu beim Trinken).
    function sip(t, hold) {
      const up = 0.45;
      FX.tween(tl, "#a2ha-B-arm", { attr: { d: ARM_REST } }, { attr: { d: ARM_SIP }, duration: up, ease: "power2.inOut" }, t);
      FX.tween(tl, "#a2ha-B-cup", { x: 0, y: 0, rotation: 0 }, { x: -40, y: -72, rotation: -28, duration: up, ease: "power2.inOut", svgOrigin: CUP }, t);
      FX.tween(tl, "#a2ha-B-head", { rotation: 0 }, { rotation: -6, duration: up, ease: "power2.inOut", svgOrigin: NECK }, t);
      FX.set(tl, "#a2ha-B-f0", { opacity: 0 }, t + 0.25);
      FX.set(tl, "#a2ha-B-f1", { opacity: 1 }, t + 0.25);
      const td = t + up + hold;
      FX.tween(tl, "#a2ha-B-arm", { attr: { d: ARM_SIP } }, { attr: { d: ARM_REST }, duration: up, ease: "power2.inOut" }, td);
      FX.tween(tl, "#a2ha-B-cup", { x: -40, y: -72, rotation: -28 }, { x: 0, y: 0, rotation: 0, duration: up, ease: "power2.inOut", svgOrigin: CUP }, td);
      FX.tween(tl, "#a2ha-B-head", { rotation: -6 }, { rotation: 0, duration: up, ease: "power2.inOut", svgOrigin: NECK }, td);
      FX.set(tl, "#a2ha-B-f1", { opacity: 0 }, td + 0.15);
      FX.set(tl, "#a2ha-B-f0", { opacity: 1 }, td + 0.15);
      return td + up;
    }
    const s1 = sip(0, 0.9);
    const t2 = Math.max(s1 + 1.0, 2.8);
    if (t2 + 1.8 < END) sip(t2, 0.8);

    // Kaffee dampft (zwei Dampffäden steigen auf, endlich oft). The loops run right up to DUR so the body,
    // which loops the same steam from its t = 0, continues them without a jump at the cut:
    // st1 finishes a whole cycle exactly at DUR, st2 runs half a cycle behind (mid-cycle at t = 0 and at DUR).
    const nSt = Math.max(1, Math.round(DUR / 1.1)), pSt = DUR / nSt;
    FX.init(tl, "#a2ha-B-st1", { y: 6, opacity: 1 });
    FX.tween(tl, "#a2ha-B-st1", { y: 6, opacity: 1 }, { y: -16, opacity: 0, duration: pSt, ease: "none", repeat: nSt - 1 }, 0);
    FX.init(tl, "#a2ha-B-st2", { y: -5, opacity: 0.5 });
    FX.tween(tl, "#a2ha-B-st2", { y: -5, opacity: 0.5 }, { y: -16, opacity: 0, duration: pSt / 2, ease: "none" }, 0);
    if (nSt > 1) FX.tween(tl, "#a2ha-B-st2", { y: 6, opacity: 1 }, { y: -16, opacity: 0, duration: pSt, ease: "none", repeat: nSt - 2 }, pSt / 2);
    FX.tween(tl, "#a2ha-B-st2", { y: 6, opacity: 1 }, { y: -5, opacity: 0.5, duration: pSt / 2, ease: "none" }, DUR - pSt / 2);

    // A schwitzt: zwei Tropfen laufen immer wieder ab.
    [["#a2ha-Asit-dr0", 0], ["#a2ha-Asit-dr1", 0.45]].forEach(([el, t0]) => {
      const n = Math.max(1, Math.floor((END - t0) / 0.9));
      FX.tween(tl, el, { y: 0, opacity: 1 }, { y: 20, opacity: 0, duration: 0.9, ease: "power1.in", repeat: n - 1 }, t0);
      FX.set(tl, el, { y: 0, opacity: 1 }, t0 + n * 0.9);
    });

    // "Und der Unterschied ist eine einzige Zahl.": das "?" pulsiert bis zum Ende.
    // Start 0.1–0.2 s before "Und", early enough that whole beats (0.8 s) run through "... einzige Zahl" up to END.
    const nQ = Math.max(1, Math.floor((END - (C.unterschied - 0.2)) / 0.8));
    const tQ = Math.max(1.0, Math.min(C.unterschied - 0.1, END - nQ * 0.8));

    // "... aber nur einer davon hat noch fast sein ganzes Konto": B's Akku pulsiert (1–2 Schläge, endet vor dem "?").
    const tK = Math.max(0.9, C.einer - 0.1);
    const dK = Math.min(1.6, tQ - 0.05 - tK);
    if (dK >= 0.8) FX.pulse(tl, "#a2ha-batB", tK, dK, { svgOrigin: "790 223" });

    FX.pulse(tl, "#a2ha-q", tQ, nQ * 0.8 + 0.01, { svgOrigin: "556 471" }); // +0.01: FX.pulse floors d / 0.8

    window.__timelines["ad2-hookA"] = tl;
  </script>
</template>
