    #a3hb-x svg { position: absolute; inset: 0; width: 520px; height: 520px; overflow: visible; }
    #a3hb-q { position: absolute; left: 0; top: 572px; width: 1080px; font-size: 100px; display: flex; justify-content: center; gap: 26px; }
  </style>
  <div id="root" data-composition-id="ad3-hookB" data-width="1080" data-height="710">
    <div id="a3hb-scene" class="clip" data-start="0" data-duration="{{DUR}}">
      <!-- Gold-Chart (4h, bereinigt), dieselbe Hook-Ansicht wie Anfang A: reingezoomt auf die Ausbruchskerze. -->
      <svg id="a3hb-chart" viewBox="0 0 1080 710">
        <g id="a3hb-pan">
        <g transform="matrix(2.62987 0 0 3.51563 -1422.21 -1444.14)">
          <!--gen:chart-->
          <g><line x1="556" y1="521.8" x2="556" y2="553" stroke="#DC2626" /><rect x="545" y="529" width="22" height="9.6" fill="#DC2626" /></g>
          <g><line x1="584" y1="524.2" x2="584" y2="545.8" stroke="#16A34A" /><rect x="573" y="529" width="22" height="9.6" fill="#16A34A" /></g>
          <g><line x1="612" y1="517" x2="612" y2="536.2" stroke="#16A34A" /><rect x="601" y="521.8" width="22" height="7.2" fill="#16A34A" /></g>
          <g><line x1="640" y1="518.2" x2="640" y2="538.6" stroke="#DC2626" /><rect x="629" y="521.8" width="22" height="12" fill="#DC2626" /></g>
          <g><line x1="668" y1="519.4" x2="668" y2="541" stroke="#16A34A" /><rect x="657" y="524.2" width="22" height="9.6" fill="#16A34A" /></g>
          <g><line x1="696" y1="512.2" x2="696" y2="531.4" stroke="#16A34A" /><rect x="685" y="517" width="22" height="7.2" fill="#16A34A" /></g>
          <g><line x1="724" y1="512.2" x2="724" y2="531.4" stroke="#DC2626" /><rect x="713" y="517" width="22" height="9.6" fill="#DC2626" /></g>
          <g><line x1="752" y1="514.6" x2="752" y2="533.8" stroke="#16A34A" /><rect x="741" y="519.4" width="22" height="7.2" fill="#16A34A" /></g>
          <g><line x1="780" y1="507.4" x2="780" y2="526.6" stroke="#16A34A" /><rect x="769" y="512.2" width="22" height="7.2" fill="#16A34A" /></g>
          <g><line x1="808" y1="506.2" x2="808" y2="524.2" stroke="#DC2626" /><rect x="797" y="512.2" width="22" height="7.2" fill="#DC2626" /></g>
          <g><line x1="836" y1="509.8" x2="836" y2="524.2" stroke="#16A34A" /><rect x="825" y="514.6" width="22" height="4.8" fill="#16A34A" /></g>
          <g id="a3hb-bo"><line x1="864" y1="437.8" x2="864" y2="519.4" stroke="#16A34A" /><rect x="853" y="445" width="22" height="69.6" fill="#16A34A" /></g>
          <!--/gen:chart-->
        </g>
        <!-- "perfektes Setup": grüner Pfeil über der Kerze + Haken -->
        <g id="a3hb-ok">
          <path d="M838 84 L838 54 L815 54 L850 16 L885 54 L862 54 L862 84 Z" fill="#16A34A" />
          <path d="M898 64 L921 87 L966 40" fill="none" stroke="#16A34A" stroke-width="19" stroke-linecap="round" stroke-linejoin="round" />

        </g>
      </svg>
      <!-- Riesiges rotes X (knallt nach 0,5 s drauf) -->
      <div id="a3hb-xw"><div id="a3hb-x"><svg viewBox="0 0 520 520"><path d="M40 40 L480 480 M480 40 L40 480" fill="none" stroke="#DC2626" stroke-width="64" stroke-linecap="round" /></svg></div></div>
      <div id="a3hb-q" class="fx-word"><span>3</span><span>Fragen</span></div>

    </div>

  <script>
    const tl = gsap.timeline({ paused: true });

    // Skizze: erst perfekt, nach 0,5 s knallt das X drauf und bleibt bis "Warum ...".
    const tX = Math.min(0.5, Math.max(0.3, C.trotzdem - 0.6));
    const tPulse = Math.max(tX + 0.5, C.trotzdem - 0.05);           // "... und trotzdem lass ich ihn liegen": X pulsiert einmal
    const tOut = Math.max(tPulse + 0.9, C.warum - 0.05);             // "Warum, ...": X + Setup ausblenden
    const tQ = Math.max(tOut + 0.8, C.drei - 0.05);                  // "... mit den 3 Fragen": "3 Fragen" einblenden

    // Erstes Bild: Chart 70 px tiefer (mittig unter dem X); bei "Warum" schiebt er sich in die Ansicht,
    // mit der der Body beginnt, und macht unten Platz für "3 Fragen". Pfeil + Haken blenden mit dem X aus,
    // damit der Hook genau im Startbild des Body endet.
    const PAN = 70;
    FX.init(tl, "#a3hb-pan", { y: PAN });
    FX.tween(tl, "#a3hb-pan", { y: PAN }, { y: 0, duration: 0.4, ease: "power2.inOut" }, tOut);
    FX.init(tl, "#a3hb-x", { opacity: 0 });
    FX.init(tl, "#a3hb-q", { opacity: 0 });
    FX.slam(tl, "#a3hb-x", tX);
    FX.tween(tl, "#a3hb-xw", { scale: 1, transformOrigin: "50% 50%" }, { scale: 1.08, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 1, transformOrigin: "50% 50%" }, tPulse);
    FX.fadeOut(tl, "#a3hb-xw", tOut);
    FX.fadeOut(tl, "#a3hb-ok", tOut);
    FX.fadeIn(tl, "#a3hb-q", tQ);

    // Cursor: kreist ab Frame 1 knapp außerhalb um das Setup (Kerze + Pfeil + Haken), 1 Runde in 1,5 s, und bleibt
    // dann unter der Kerze stehen (frei vom X). Bei "Warum" eine ruhige Bewegung zum Übergabepunkt links neben der "3",
    // dort Klick: "3 Fragen" erscheint. Hook A endet am selben Punkt, der Body startet dort.
    const HAND = [215, 590];
    const ORB = { cx: 888, cy: 200 + PAN, rx: 150, ry: 235 };
    // Gegen den Uhrzeigersinn ab unten: in der ersten halben Sekunde rechts hoch an Kerze, Pfeil und Haken vorbei.
    const a0 = Math.PI * 0.5, NSEG = 36;
    const orbit = [];
    for (let i = 1; i <= NSEG; i++) {
      const a = a0 - (i / NSEG) * Math.PI * 2;
      orbit.push({ t: ((i - 1) * 1.5) / NSEG, to: [ORB.cx + ORB.rx * Math.cos(a), ORB.cy + ORB.ry * Math.sin(a)], d: 1.5 / NSEG, ease: "none" });
    }
    FX.cursor(tl, "#a3hb-cur", "#a3hb-ring", [ORB.cx + ORB.rx * Math.cos(a0), ORB.cy + ORB.ry * Math.sin(a0)], [
      ...orbit,
      { t: tOut, to: HAND, d: Math.min(0.7, Math.max(0.35, tQ - tOut - 0.2)) },
      { t: tQ, click: true },
    ]);

    window.__timelines["ad3-hookB"] = tl;
  </script>
