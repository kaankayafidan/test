<template>
  <style>
    #root { position: absolute; inset: 0; background: #FFFFFF; overflow: hidden; }
    #a3b-scene { position: absolute; inset: 0; }
    #a3b-chart { position: absolute; left: 0; top: 0; width: 1080px; height: 710px; overflow: hidden; }
    #a3b-chart line { stroke-width: 4; vector-effect: non-scaling-stroke; }
    /* Zeichnungen wie im Chart-Tool: Linienbreite bleibt beim Zoomen gleich */
    .a3b-ln { fill: none; stroke-width: 7; stroke-linecap: butt; vector-effect: non-scaling-stroke; }
    /* Fragen-Labels oben links (44 px), daneben Haken / Kreuz */
    .a3b-row { position: absolute; left: 36px; top: 28px; display: flex; align-items: center; gap: 14px; }
    .a3b-row .fx-label { position: relative; }
    .a3b-row svg { width: 58px; height: 58px; flex: none; }
    #a3b-x { position: absolute; left: 280px; top: 100px; width: 520px; height: 520px; }
    #a3b-x svg { position: absolute; inset: 0; width: 520px; height: 520px; overflow: visible; }
  </style>
  <div id="root" data-composition-id="ad3-body" data-width="1080" data-height="710">
    <div id="a3b-scene" class="clip" data-start="0" data-duration="{{DUR}}">
      <!-- Gold-Chart (4h, bereinigt): die letzten 30 Kerzen, heller Hintergrund, kein Gitter, keine Achsen,
           keine Preise, kein Plattformname. Alle Zeichnungen sind vorbereitet und werden per Klick eingeblendet.
           Kamera: #a3b-wrap = langsamer Zoom (100/108 %), #a3b-zoom = 150 %-Zoom, beide um denselben Punkt;
           #a3b-view = Start in der Hook-Ansicht. -->
      <svg id="a3b-chart" viewBox="0 0 1080 710" data-layout-allow-overflow>
        <g id="a3b-wrap">
        <g id="a3b-zoom">
          <g id="a3b-view">
            <!--gen:chart-->
            <g><line x1="52" y1="598.6" x2="52" y2="637" stroke="#16A34A" /><rect x="41" y="605.8" width="22" height="19.2" fill="#16A34A" /></g>
            <g><line x1="80" y1="521.8" x2="80" y2="613" stroke="#16A34A" /><rect x="69" y="529" width="22" height="76.8" fill="#16A34A" /></g>
            <g><line x1="108" y1="517" x2="108" y2="560.2" stroke="#DC2626" /><rect x="97" y="529" width="22" height="21.6" fill="#DC2626" /></g>
            <g><line x1="136" y1="401.8" x2="136" y2="555.4" stroke="#16A34A" /><rect x="125" y="411.4" width="22" height="139.2" fill="#16A34A" /></g>
            <g><line x1="164" y1="262.6" x2="164" y2="418.6" stroke="#16A34A" /><rect x="153" y="272.2" width="22" height="139.2" fill="#16A34A" /></g>
            <g><line x1="192" y1="176.2" x2="192" y2="281.8" stroke="#16A34A" /><rect x="181" y="185.8" width="22" height="86.4" fill="#16A34A" /></g>
            <g><line x1="220" y1="147.4" x2="220" y2="207.4" stroke="#DC2626" /><rect x="209" y="185.8" width="22" height="14.4" fill="#DC2626" /></g>
            <g><line x1="248" y1="183.4" x2="248" y2="253" stroke="#DC2626" /><rect x="237" y="200.2" width="22" height="43.2" fill="#DC2626" /></g>
            <g><line x1="276" y1="217" x2="276" y2="250.6" stroke="#16A34A" /><rect x="265" y="224.2" width="22" height="19.2" fill="#16A34A" /></g>
            <g><line x1="304" y1="219.4" x2="304" y2="305.8" stroke="#DC2626" /><rect x="293" y="224.2" width="22" height="72" fill="#DC2626" /></g>
            <g><line x1="332" y1="289" x2="332" y2="387.4" stroke="#DC2626" /><rect x="321" y="296.2" width="22" height="81.6" fill="#DC2626" /></g>
            <g><line x1="360" y1="370.6" x2="360" y2="437.8" stroke="#DC2626" /><rect x="349" y="377.8" width="22" height="50.4" fill="#DC2626" /></g>
            <g><line x1="388" y1="361" x2="388" y2="435.4" stroke="#16A34A" /><rect x="377" y="368.2" width="22" height="60" fill="#16A34A" /></g>
            <g><line x1="416" y1="320.2" x2="416" y2="375.4" stroke="#16A34A" /><rect x="405" y="329.8" width="22" height="38.4" fill="#16A34A" /></g>
            <g><line x1="444" y1="319" x2="444" y2="353.8" stroke="#DC2626" /><rect x="433" y="329.8" width="22" height="16.8" fill="#DC2626" /></g>
            <g><line x1="472" y1="341.8" x2="472" y2="411.4" stroke="#DC2626" /><rect x="461" y="346.6" width="22" height="57.6" fill="#DC2626" /></g>
            <g><line x1="500" y1="399.4" x2="500" y2="476.2" stroke="#DC2626" /><rect x="489" y="404.2" width="22" height="64.8" fill="#DC2626" /></g>
            <g><line x1="528" y1="464.2" x2="528" y2="536.2" stroke="#DC2626" /><rect x="517" y="469" width="22" height="60" fill="#DC2626" /></g>
            <g><line x1="556" y1="521.8" x2="556" y2="553" stroke="#DC2626" /><rect x="545" y="529" width="22" height="9.6" fill="#DC2626" /></g>
            <g><line x1="584" y1="524.2" x2="584" y2="545.8" stroke="#16A34A" /><rect x="573" y="529" width="22" height="9.6" fill="#16A34A" /></g>
            <g><line x1="612" y1="517" x2="612" y2="536.2" stroke="#16A34A" /><rect x="601" y="521.8" width="22" height="7.2" fill="#16A34A" /></g>
            <g><line x1="640" y1="518.2" x2="640" y2="538.6" stroke="#DC2626" /><rect x="629" y="521.8" width="22" height="12" fill="#DC2626" /></g>
            <g><line x1="668" y1="519.4" x2="668" y2="541" stroke="#16A34A" /><rect x="657" y="524.2" width="22" height="9.6" fill="#16A34A" /></g>
            <g><line x1="696" y1="512.2" x2="696" y2="531.4" stroke="#16A34A" /><rect x="685" y="517" width="22" height="7.2" fill="#16A34A" /></g>
            <g><line x1="724" y1="512.2" x2="724" y2="531.4" stroke="#DC2626" /><rect x="713" y="517" width="22" height="9.6" fill="#DC2626" /></g>
            <g><line x1="752" y1="514.6" x2="752" y2="533.8" stroke="#16A34A" /><rect x="741" y="519.4" width="22" height="7.2" fill="#16A34A" /></g>
            <g><line x1="780" y1="507.4" x2="780" y2="526.6" stroke="#16A34A" /><rect x="769" y="512.2" width="22" height="7.2" fill="#16A34A" /></g>
            <g><line x1="808" y1="506.2" x2="808" y2="524.2" stroke="#DC2626" /><rect x="797" y="512.2" width="22" height="7.2" fill="#DC2626" /></g>
            <g><line x1="836" y1="509.8" x2="836" y2="524.2" stroke="#16A34A" /><rect x="825" y="514.6" width="22" height="4.8" fill="#16A34A" /></g>
            <g id="a3b-bo"><line x1="864" y1="437.8" x2="864" y2="519.4" stroke="#16A34A" /><rect x="853" y="445" width="22" height="69.6" fill="#16A34A" /></g>
            <!--/gen:chart-->
            <!-- Long-Position-Box: zwei einfache Rechtecke ohne Beträge (rot = Stop-Abstand, grün = Ziel-Abstand) -->
            <g id="a3b-box">
              <rect id="a3b-bg" x="888" y="205" width="120" height="240" fill="#16A34A" />
              <rect id="a3b-br" x="888" y="445" width="120" height="120" fill="#DC2626" />
            </g>
            <!-- Stop: knapp unter dem Tief der Basis -->
            <path id="a3b-stop" class="a3b-ln" stroke="#DC2626" d="M535 565 L1008 565" />
            <!-- Widerstand: das Hoch der Erholung (zwei Dochte) liegt nur so weit über dem Einstieg wie der Stop darunter -->
            <path id="a3b-res" class="a3b-ln" stroke="#0E1A2B" d="M396 319 L1008 319" />
            <!-- Signal-Pfeil des Indikators unter der Ausbruchskerze -->
            <path id="a3b-sig" d="M864 577 L887 603 L873 603 L873 627 L855 627 L855 603 L841 603 Z" fill="#16A34A" />
          </g>
        </g>
        </g>
      </svg>

      <div id="a3b-r1" class="a3b-row"><div id="a3b-l1" class="fx-label">1/3 Signal?</div>
        <svg id="a3b-t1" viewBox="0 0 58 58"><circle cx="29" cy="29" r="29" fill="#16A34A" /><path d="M16 30 L25 39 L43 20" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /></svg></div>
      <div id="a3b-r2" class="a3b-row"><div id="a3b-l2" class="fx-label">2/3 Stop?</div>
        <svg id="a3b-t2" viewBox="0 0 58 58"><circle cx="29" cy="29" r="29" fill="#16A34A" /><path d="M16 30 L25 39 L43 20" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /></svg></div>
      <div id="a3b-r3" class="a3b-row"><div id="a3b-l3" class="fx-label">3/3 Lohnt sich’s?</div>
        <svg id="a3b-t3" viewBox="0 0 58 58"><circle cx="29" cy="29" r="29" fill="#DC2626" /><path d="M19 19 L39 39 M39 19 L19 39" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" /></svg></div>

      <!-- Großes rotes X über dem Chart -->
      <div id="a3b-x"><svg viewBox="0 0 520 520"><path d="M40 40 L480 480 M480 40 L40 480" fill="none" stroke="#DC2626" stroke-width="64" stroke-linecap="round" /></svg></div>

      <!--@include more p="a3b-more"-->
      <!--@include course p="a3b-course" items="3 Fragen|Strategie|60-Tage-Plan"-->
      <!--@include cta p="a3b-cta"-->
      <!--@include cursor p="a3b"-->
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

    // Hook-Ansicht (reingezoomt auf Basis + Ausbruchskerze, wie in beiden Anfängen) -> ganzer Chart.
    // = matrix(2.62987 0 0 3.51563 -1422.21 -1444.14), als reine Skalierung um ihren Fixpunkt (seek-sicher).
    const HOOK = { scaleX: 2.62987, scaleY: 3.51563 };
    const HO = "872.59 574.07";
    // Kamera: langsamer Zoom (Wrapper, 100 <-> 108 %) und 150 %-Zoom (zoom-Gruppe) um denselben Punkt (950, 500),
    // die Faktoren multiplizieren sich: 1,08 x 1,389 = 1,5. S() = Position eines Chart-Punkts im Bild bei Zoom k.
    const PV = "950 500";
    const ZW = 1.08, ZT = 1.5, ZZ = ZT / ZW;
    const S = (x, y, k) => [950 + k * (x - 950), 500 + k * (y - 500)];
    // Box: Einstieg y 445, Stop y 565, 2:1-Ziel y 205, Widerstand y 319 (Chart-Koordinaten); Griff in der Box-Mitte x 948.
    const BOX_O = "948 445";

    // ---- Beats (aus den Cues; Mindestabstände halten die Bilder lesbar, wenn schneller gesprochen wird)
    const tL1 = Math.max(0, C.f1 - 0.05);                                  // Label "1/3 Signal?"
    const tSig = Math.max(tL1 + 1.5, C.hier - 0.05);                       // Signal-Pfeil einblenden (Klick)
    const tT1 = Math.max(tSig + 0.5, C.einstieg - 0.05);                   // Haken 1
    const tL2 = Math.max(tT1 + 0.6, C.f2 - 0.05);                          // Label "2/3 Stop?"
    const tStop = Math.max(tL2 + 1.0, C.stop - 0.05);                      // rote Stop-Linie einblenden (Klick)
    const tT2 = Math.max(tStop + 0.4, C.stopW - 0.05);                     // Haken 2
    const tBlink = Math.max(tT2 + 0.4, C.bevor - 0.05);                    // "... und zwar bevor ich einsteige": Stop blinkt 1x
    const tMore = Math.max(tBlink + 0.9, C.mehr - 0.05);                   // Banner "Mehr dazu ↓"
    const tPulseM = Math.max(tMore + 0.4, C.mehrDazu - 0.05);              // "klick unter dem Video ...": Banner pulsiert 1x
    // Banner mind. 3 s und nie weg, bevor "Mehr dazu" ausgesprochen ist (kein oberes Limit).
    const dMore = Math.max(3, Math.max(E.mehrDazu + 0.35, tPulseM + 0.85) - tMore);
    const tSZ = Math.max(tMore + 1.0, C.bleib - 0.05);                     // "Aber bleib noch kurz": langsamer Zoom 100 -> 108 %
    const tL3 = Math.max(tSZ + 0.5, C.f3 - 0.05);                          // Label "3/3 Lohnt sich's?"
    const tNehme = Math.max(tL3 + 0.6, C.nehme - 0.05);                    // "Ich nehme nur Trades ...": Hand zum Einstieg
    const tBox = Math.max(tNehme + 0.9, tSZ + 2.6, C.doppelt - 0.05);      // Long-Position-Box aufziehen (2:1)
    const tZoom = tBox + 0.5;                                              // ... und auf 150 % reinzoomen
    const tRes = Math.max(tZoom + 0.6, C.undhier - 0.05);                  // Widerstands-Linie einblenden
    const tShrink = Math.max(tRes + 0.5, C.ziel - 0.05);                   // Ziel nur bis zum Widerstand: ca. 1:1
    const tCross = Math.max(tShrink + 0.5, C.gerade - 0.05);               // rotes Kreuz am Label 3
    const tX = Math.max(tCross + 0.6, C.also - 0.05);                      // großes rotes X
    const tZO1 = Math.max(tX + 0.6, C.disziplin - 0.05);                   // leicht rauszoomen 108 -> 100 % (3 s), X bleibt
    const tZO2 = Math.max(tZO1 + 3.05, C.dauert - 0.05);                   // rauszoomen auf den ganzen Chart, X bleibt
    const tCourse = Math.max(tZO2 + 0.9, C.wie - 0.05);                    // Kurs-Mockup + 3 Haken
    const k1 = Math.max(tCourse + 0.45, C.denkweise - 0.05);
    const tVK = Math.max(k1 + 0.4, C.videokurs - 0.05);                    // "... in meinem kostenlosen Videokurs": Hand aufs Video
    const k2 = Math.max(k1 + 0.4, C.strategie - 0.05);
    const k3 = Math.max(k2 + 0.4, C.plan - 0.05);
    const tCTA = Math.max(k3 + 1.0, tCourse + 2.0, C.klick - 0.05);        // CTA-Bild bis zum Ende

    // ---- Startzustände
    FX.init(tl, "#a3b-view", { svgOrigin: HO, smoothOrigin: false, ...HOOK });
    FX.init(tl, "#a3b-wrap", { svgOrigin: PV, smoothOrigin: false, scale: 1 });
    FX.init(tl, "#a3b-zoom", { svgOrigin: PV, smoothOrigin: false, scale: 1 });
    FX.init(tl, "#a3b-sig", { opacity: 0, svgOrigin: "864 602", smoothOrigin: false });
    FX.init(tl, "#a3b-box", { opacity: 0 });
    FX.init(tl, "#a3b-bg", { svgOrigin: BOX_O, smoothOrigin: false, scaleY: 0.02 });
    FX.init(tl, "#a3b-br", { svgOrigin: BOX_O, smoothOrigin: false, scaleY: 0.02 });
    ["#a3b-stop", "#a3b-res", "#a3b-l1", "#a3b-t1", "#a3b-l2", "#a3b-t2", "#a3b-l3", "#a3b-t3", "#a3b-x"].forEach((el) => FX.init(tl, el, { opacity: 0 }));

    // Body-Start: aus der Hook-Ansicht auf den ganzen Chart rauszoomen (0,6 s).
    FX.tween(tl, "#a3b-view", { ...HOOK, svgOrigin: HO, smoothOrigin: false }, { scaleX: 1, scaleY: 1, duration: 0.6, ease: "power2.inOut", svgOrigin: HO, smoothOrigin: false }, 0);

    // Frage 1: "Gibt's hier überhaupt ein klares Signal ..." -> "Hier ja, mein Indikator zeigt einen Einstieg" -> Pfeil, Haken.
    FX.pop(tl, "#a3b-l1", tL1, { origin: "0% 50%" });
    FX.fadeIn(tl, "#a3b-sig", tSig);
    FX.pop(tl, "#a3b-t1", tT1);
    const dPulse = tL2 - 0.3 - (tT1 + 1.0);
    if (dPulse >= 0.8) FX.pulse(tl, "#a3b-sig", tT1 + 1.0, Math.min(1.6, dPulse), { svgOrigin: "864 602" });

    // Frage 2: Label tauschen, "Genau da kommt mein Stop hin" -> rote Stop-Linie, Haken; "... bevor ich einsteige" -> blinkt.
    FX.cut(tl, "#a3b-r1", null, tL2);
    FX.pop(tl, "#a3b-l2", tL2, { origin: "0% 50%" });
    FX.fadeIn(tl, "#a3b-stop", tStop);
    FX.pop(tl, "#a3b-t2", tT2);
    FX.blink(tl, "#a3b-stop", tBlink, 0.8);

    // "Wenn du sehen willst, wie ich das Schritt für Schritt mache ...": kleines Banner unten, pulsiert auf "klick ...".
    FX.more(tl, "a3b-more", tMore, dMore);
    FX.pulse(tl, "#a3b-more", tPulseM, 0.8);

    // "Aber bleib noch kurz ...": langsamer Zoom Richtung Einstieg. Frage 3: Label tauschen.
    FX.slowZoom(tl, "#a3b-wrap", tSZ, { svgOrigin: PV, from: 1, to: ZW });
    FX.cut(tl, "#a3b-r2", null, tL3);
    FX.pop(tl, "#a3b-l3", tL3, { origin: "0% 50%" });

    // "... mindestens doppelt so weit weg ..." -> Box aufziehen (2:1), dann auf 150 % reinzoomen.
    tl.set("#a3b-box", { opacity: 1 }, tBox);
    FX.tween(tl, "#a3b-bg", { scaleY: 0.02, svgOrigin: BOX_O }, { scaleY: 1, duration: 0.4, ease: "power2.out", svgOrigin: BOX_O }, tBox);
    FX.tween(tl, "#a3b-br", { scaleY: 0.02, svgOrigin: BOX_O }, { scaleY: 1, duration: 0.3, ease: "power2.out", svgOrigin: BOX_O }, tBox);
    FX.zoomIn(tl, "#a3b-zoom", tZoom, { svgOrigin: PV, to: ZZ });

    // "Und hier? Das nächste Ziel liegt gerade mal so weit weg wie der Stop." -> Widerstand (die zwei Dochte der Erholung
    // sind im 150 %-Bild links zu sehen), Box ca. 1:1, rotes Kreuz.
    FX.fadeIn(tl, "#a3b-res", tRes);
    FX.tween(tl, "#a3b-bg", { scaleY: 1, svgOrigin: BOX_O }, { scaleY: 126 / 240, duration: 0.4, ease: "power2.inOut", svgOrigin: BOX_O }, tShrink);
    FX.pop(tl, "#a3b-t3", tCross);

    // "Also lass ich den Trade weg ..." -> großes rotes X. "Genau diese Disziplin ..." -> leicht rauszoomen (108 -> 100 %,
    // 3 s, linear), X bleibt. "Das dauert keine 2 Minuten ..." -> zurück auf den ganzen Chart (0,5 s), X bleibt.
    FX.slam(tl, "#a3b-x", tX);
    FX.slowZoom(tl, "#a3b-wrap", tZO1, { svgOrigin: PV, from: ZW, to: 1 });
    FX.zoomOut(tl, "#a3b-zoom", tZO2, { svgOrigin: PV, from: ZZ });

    // Kurs-Mockup mit 3 Haken: 3 Fragen · Strategie · 60-Tage-Plan.
    FX.cut(tl, ["#a3b-chart", "#a3b-r3", "#a3b-x"], null, tCourse);
    FX.course(tl, "a3b-course", tCourse, [k1, k2, k3]);

    // "Klick unter dem Video auf „Mehr dazu“." -> CTA-Bild, bleibt bis zum Ende.
    tl.set("#a3b-course", { opacity: 0 }, tCTA);
    FX.cta(tl, "a3b-cta", tCTA);

    // ---- Cursor: ruhig, eine Bewegung pro Satz; Klick-Ring nur, wenn der Klick direkt daneben etwas aufdeckt.
    // Start = Übergabepunkt beider Hooks (links neben der "3").
    const P = (t) => Math.max(0.05, t);
    const m2 = Math.max(1.7, tSig - 0.75);
    const sStop = tL2 + 0.5;
    const hBox = S(948, 445, ZW);                                          // Griff der Box (Einstieg) bei 108 %
    FX.cursor(tl, "#a3b-cur", "#a3b-ring", [215, 590], [
      { t: P(0.7), to: [910, 478], d: 0.8 },                               // "Gibt's hier ...": zeigt auf die Ausbruchskerze
      { t: m2, to: [910, 598], d: Math.min(0.6, Math.max(0.3, tSig - 0.05 - m2)) },  // "Hier ja ...": runter neben den Pfeil
      { t: tSig, click: true },
      { t: sStop, to: [560, 574], d: Math.min(0.8, Math.max(0.3, tStop - 0.1 - sStop)) }, // "Wo weiß ich ...": unter das Tief der Basis
      { t: tStop, click: true },
      { t: tMore + 0.05, to: [742, 634], d: 0.6 },                         // zeigt aufs Banner
      { t: tNehme, to: hBox, d: Math.min(0.9, Math.max(0.4, tBox - 0.1 - tNehme)) },   // zum Einstieg
      { t: tBox, click: true },
      { t: tBox + 0.02, to: S(948, 205, ZW), d: 0.4, ease: "power2.out" },  // Ziel auf 2:1 hochziehen
      { t: tZoom, to: S(948, 205, ZT), d: 0.5, ease: "power2.inOut" },      // fährt mit dem 150 %-Zoom mit
      { t: tShrink, to: S(948, 319, ZT), d: 0.4, ease: "power2.inOut" },    // Ziel runter bis zum Widerstand ziehen
      { t: tX + 0.25, to: [1000, 632], d: 0.7 },                            // aus dem Weg, X bleibt frei
      { t: tVK, to: [408, 268], d: 0.8 },                                   // aufs Kurs-Video
      { t: tCTA, hide: true },
    ]);

    window.__timelines["ad3-body"] = tl;
  </script>
</template>
