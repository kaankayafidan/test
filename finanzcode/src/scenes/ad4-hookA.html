    let busy = 0;
    function mv(t, to, d, ease) { t = Math.max(t, busy + 0.01); steps.push({ t: t, to: to, d: d, ease: ease || "power2.inOut" }); busy = t + d; return busy; }
    function path(t, pts, d) { t = Math.max(t, busy + 0.01); const seg = d / (pts.length - 1); for (let i = 1; i < pts.length; i++) steps.push({ t: t + (i - 1) * seg, to: pts[i], d: seg, ease: "none" }); busy = t + d; return busy; }

    // "?"-Karte wackelt leicht (±2,5°, 0,6 s pro Schwung), sobald sie liegt (nach dem Austeilen, 0,49 s), bis kurz vor "… noch einen 4." und hält dann an.
    // Sie startet gerade (0°), damit sie im ersten Frame nicht doppelt gekippt ist; eine Viertel-Schwingung führt weich ins Wackeln.
    const WO = "792px 532px";
    const tCirc = Math.max(1.8, C.vierter - 0.1);
    const tW0 = 0.49;
    FX.init(tl, "#a4ha-w4", { rotation: 0, transformOrigin: WO });
    FX.tween(tl, "#a4ha-w4", { rotation: 0, transformOrigin: WO, smoothOrigin: false }, { rotation: -2.5, duration: 0.3, ease: "sine.out", transformOrigin: WO, smoothOrigin: false }, tW0);
    const w = FX.wobble(tl, "#a4ha-w4", tW0 + 0.3, Math.max(0.6, tCirc - 0.35 - tW0 - 0.3), { deg: 2.5, origin: WO });
    FX.settle(tl, "#a4ha-w4", w.end, w.endRotation, { origin: WO });

    // "… aber es gibt noch einen 4." -> die verdeckte Karte wird eingekreist (rot, 0,5 s); der Cursor zeichnet mit.
    FX.drawCircle(tl, "#a4ha-circ", tCirc);
    const TRACE = [[746.4,419.3],[750.5,418.2],[762.7,414.9],[783.7,412.2],[813.2,413.8],[849.3,425.5],[885.3,454.5],[910.4,503],[912,565.9],[876.6,627],[802.4,652.8],[727.1,627.8],[677.3,576.8],[661.6,516.2],[678.3,464.5],[710.6,431.5],[744.5,414.5],[773.2,407.6],[794.3,406.5],[807,407.5],[811.2,407.8]];

    // Cursor: kreist ab Frame 1 über die 3 offenen Karten (1 Runde ≈ 1,6 s), danach ruhig.
    path(0, LOOP, 1.6);
    // "Alle 3 geben nach mindestens ein paar Wochen auf …" -> der Cursor sinkt ruhig in die Lücke in der Mitte des Rasters.
    const tApp = Math.max(C.aber, tCirc - 0.8);              // Anflug auf den Kreis um die "?"-Karte
    const tAlle = Math.max(busy + 0.1, C.alle);
    mv(tAlle, MID, Math.max(0.4, Math.min(1.1, tApp - 0.15 - tAlle)), "sine.inOut");
    mv(tApp, TRACE[0], Math.min(0.7, Math.max(0.3, tCirc - 0.05 - Math.max(tApp, busy + 0.01))));
    path(tCirc, TRACE, 0.5);
    // "… und zu dem kommen wir gleich." -> ruhig zurück auf Karte 1 (dort klickt der Body weiter); der rote Kreis blendet dabei aus,
    // damit er am Schnitt in den Body nicht in einem Frame verschwindet.
    const tBack = Math.max(busy + 0.25, Math.min(E.gleich - 0.9, DUR - 1.0));
    mv(tBack, R, Math.max(0.3, Math.min(0.8, DUR - 0.1 - tBack)));
    FX.fadeOut(tl, "#a4ha-circ", Math.max(tCirc + 0.6, Math.min(tBack, DUR - 0.3)), 0.2);
    // "… geben nach mindestens ein paar Wochen auf" -> die 3 offenen Karten werden blass (0,2 s), nur die "?"-Karte bleibt kräftig;
    // auf "… und zu dem kommen wir gleich." sind sie wieder voll da (Übergang in den Body: Raster wie im ersten Bild).
    const tDim = Math.min(tCirc - 0.3, Math.max(C.alle + 0.6, C.auf - 0.1));
    const tUndim = Math.min(DUR - 0.35, Math.max(tDim + 0.6, tBack));
    ["#a4ha-c1", "#a4ha-c2", "#a4ha-c3"].forEach(function (el) {
      FX.tween(tl, el, { opacity: 1 }, { opacity: 0.35, duration: 0.2, ease: "none" }, tDim);
      FX.tween(tl, el, { opacity: 0.35 }, { opacity: 1, duration: 0.2, ease: "none" }, tUndim);
    });
    FX.cursor(tl, "#a4ha-cur", "#a4ha-ring", LOOP[0], steps);

    window.__timelines["ad4-hookA"] = tl;
  </script>
</template>
