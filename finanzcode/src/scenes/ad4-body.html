  <script>
    const tl = gsap.timeline({ paused: true });
    const S = 1 / 1.9;                                    // Groß-Format 912 x 638 -> Raster 480 x 336
    const SL = [[288,178],[792,178],[288,532],[792,532]];
    const card = function (n) { return "#a4b-c" + n; };
    const others = function (n) { return [1, 2, 3, 4].filter(function (k) { return k !== n; }).map(card); };
    const grid = function (n) { return { x: SL[n - 1][0] - 540, y: SL[n - 1][1] - 355, scale: S }; };
    const st = {};                                         // aktueller Transform jeder Karte (für lückenlose fromTo-Ketten)
    function moveCard(n, to, t, d, ease) {
      FX.tween(tl, card(n), { x: st[n].x, y: st[n].y, scale: st[n].scale }, { x: to.x, y: to.y, scale: to.scale, duration: d, ease: ease }, t);
      st[n] = { x: to.x, y: to.y, scale: to.scale };
    }
    function zone(n, nx, ny) { const s = st[n]; return [540 + s.x + (nx - 456) * s.scale, 355 + s.y + (ny - 319) * s.scale]; }
    const DIG = { x: 138, y: 191 };                        // Ziffer wandert in der großen Karte nach rechts unten (190 px)
    const PH = { 1: [156, 450, -50], 2: [156, 450, -50], 3: [156, 450, -50], 4: [256, 350, -75] }; // Bildausschnitt groß
    const NOTES = ["#a4b-nt1", "#a4b-nt2", "#a4b-nt3", "#a4b-nt4", "#a4b-nt5"];

    // ---------------------------------------------------------------- Anfangszustand = letztes Bild der Anfänge
    [1, 2, 3, 4].forEach(function (n) {
      st[n] = grid(n);
      FX.init(tl, card(n), { x: st[n].x, y: st[n].y, scale: S, transformOrigin: "50% 50%", zIndex: 1, opacity: 1 });
      FX.init(tl, "#a4b-d" + n, { x: 0, y: 0, scale: 1.9, transformOrigin: "50% 50%", opacity: 1 });
      FX.init(tl, ["#a4b-n" + n, "#a4b-va" + n, "#a4b-vb" + n], { opacity: 0 });
    });
    FX.init(tl, ["#a4b-clock", "#a4b-badge", "#a4b-job", "#a4b-t1", "#a4b-t2", "#a4b-t3", "#a4b-stamp1", "#a4b-vid"], { opacity: 0 });
    FX.init(tl, ["#a4b-badge", "#a4b-job"], { rotation: -4, transformOrigin: "50% 50%" });
    FX.init(tl, "#a4b-sec", { rotation: 0, svgOrigin: "0 0" });
    NOTES.forEach(function (el, k) { FX.init(tl, el, { opacity: 0, x: -300, rotation: [-3, 3, -2, 3, -3][k], transformOrigin: "50% 50%" }); });
    FX.init(tl, "#a4b-front4", { rotationY: -90, opacity: 0, transformPerspective: 2400, transformOrigin: "50% 50%" });
    FX.init(tl, "#a4b-back4", { rotationY: 0, opacity: 1, transformPerspective: 2400, transformOrigin: "50% 50%" });
    FX.init(tl, "#a4b-cta-more", { opacity: 0 });

    // Karte fliegt groß nach vorn: wächst in 0,4 s (ease-out) auf 90 % der Motiv-Zone, die anderen blenden aus.
    // Name (96 px) und genau 2 Werte (72 px) erscheinen erst jetzt.
    function fly(n, t) {
      tl.set(card(n), { zIndex: 5 }, t);
      moveCard(n, { x: 0, y: 0, scale: 1 }, t, 0.4, "power2.out");
      others(n).forEach(function (el) { FX.fadeOut(tl, el, t); });
      FX.tween(tl, "#a4b-p" + n, { top: 32, height: 574 }, { top: PH[n][0], height: PH[n][1], duration: 0.4, ease: "power2.out" }, t);
      FX.tween(tl, "#a4b-pi" + n, { y: 0 }, { y: PH[n][2], duration: 0.4, ease: "power2.out" }, t);
      if (n < 4) FX.tween(tl, "#a4b-d" + n, { x: 0, y: 0, scale: 1.9 }, { x: DIG.x, y: DIG.y, scale: 1, duration: 0.4, ease: "power2.out" }, t);
      else FX.fadeOut(tl, "#a4b-d4", t, 0.15);
      FX.pop(tl, "#a4b-n" + n, t + 0.25);
      FX.pop(tl, "#a4b-va" + n, t + 0.35);
      FX.pop(tl, "#a4b-vb" + n, t + 0.45);
    }
    // Karte zurück ins Raster (0,4 s), Namen/Werte/Extras blenden aus, die anderen Karten blenden wieder ein.
    // extras: nur Elemente, die zu diesem Zeitpunkt sichtbar sind (fadeOut startet bei Deckkraft 1).
    function back(n, t, extras) {
      ["#a4b-n" + n, "#a4b-va" + n, "#a4b-vb" + n].concat(extras || []).forEach(function (el) { FX.fadeOut(tl, el, t, 0.15); });
      moveCard(n, grid(n), t, 0.4, "power2.inOut");
      others(n).forEach(function (el) { FX.fadeIn(tl, el, t); });
      FX.tween(tl, "#a4b-p" + n, { top: PH[n][0], height: PH[n][1] }, { top: 32, height: 574, duration: 0.4, ease: "power2.inOut" }, t);
      FX.tween(tl, "#a4b-pi" + n, { y: PH[n][2] }, { y: 0, duration: 0.4, ease: "power2.inOut" }, t);
      if (n < 4) FX.tween(tl, "#a4b-d" + n, { x: DIG.x, y: DIG.y, scale: 1 }, { x: 0, y: 0, scale: 1.9, duration: 0.4, ease: "power2.inOut" }, t);
      else FX.fadeIn(tl, "#a4b-d4", t + 0.25, 0.15);
      tl.set(card(n), { zIndex: 1 }, t + 0.4);
    }
    const zooms = { 1: [], 2: [], 3: [], 4: [] };          // langsame Zooms je Karte (für Cursor-Ziele während des Zooms)
    function slow(n, t, d, zoomOut) {   // langsamer Zoom 100 -> 108 % über 3 s (anteilig), oder zurück
      if (d < 1) return;
      const k = 0.08 * Math.min(3, d) / 3, s0 = st[n].scale, s1 = zoomOut ? Math.max(1, s0 - k) : s0 + k;
      if (Math.abs(s1 - s0) < 0.005) return;
      moveCard(n, { x: st[n].x, y: st[n].y, scale: s1 }, t, Math.min(3, d), "none");
      zooms[n].push({ t: t, d: Math.min(3, d), s0: s0, s1: s1 });
    }
    function scaleAt(n, t) {            // Maßstab der Karte n zur Zeit t (nur für Zeiten nach dem Groß-Flug)
      let s = 1;
      zooms[n].forEach(function (z) { if (t >= z.t) s = z.s0 + (z.s1 - z.s0) * Math.min(1, (t - z.t) / z.d); });
      return s;
    }
    function zoneAt(n, nx, ny, t) { const s = scaleAt(n, t); return [540 + st[n].x + (nx - 456) * s, 355 + st[n].y + (ny - 319) * s]; }

    // Cursor-Hilfen (eine ruhige Bewegung pro Satz; nie zwei Cursor-Tweens gleichzeitig)
    const steps = [];
    let busy = 0;
    function mv(t, to, d, ease) { t = Math.max(t, busy + 0.01); steps.push({ t: t, to: to, d: d, ease: ease || "power2.inOut" }); busy = t + d; return busy; }
    function path(t, pts, d) { t = Math.max(t, busy + 0.01); const seg = d / (pts.length - 1); for (let i = 1; i < pts.length; i++) steps.push({ t: t + (i - 1) * seg, to: pts[i], d: seg, ease: "none" }); busy = t + d; return busy; }
    function click(t) { steps.push({ t: t, click: true }); }
    const R = [215, 270];                                  // = Endpunkt der Anfänge (auf dem Bild von Karte 1)
    // Klickpunkte auf den Raster-Karten. K[4] liegt auf dem "?".
    const K = { 2: [720, 270], 3: [215, 624], 4: [784, 576] };
    // Nach jedem Klick gleitet der Cursor einmal auf eine freie Fläche der großen Karte (nie an den Rand der Motiv-Zone, nie auf den Kartenrand).
    const REST1 = [624, 486];                              // Karte 1 groß: unter den Werten, links der Ziffer
    const REST2 = [560, 505];                              // Karte 2: frei sowohl groß als auch verkleinert (links der Ziffer)
    const REST3 = [752, 446];                              // Karte 3 groß: zwischen Uhr und Ziffer

    // ---------------------------------------------------------------- Typ 1: der Zocker
    // "Typ 1 ist der Zocker." -> Klick, Karte 1 fliegt groß nach vorn: "Der Zocker", "Risiko 10 · Plan 0".
    const tF1 = Math.max(0, C.typ1 - 0.05);
    click(tF1);
    fly(1, tF1);
    mv(tF1 + 0.2, REST1, 0.7);
    // "… hat keinen Stop-Loss und hofft auf den großen Wurf …" -> "Plan 0" einkreisen; der Cursor zeichnet mit und bleibt am Ende des Kreises liegen.
    const TR1 = [[689.5,303.9],[695.2,303.6],[712.2,302.5],[740.7,301.4],[780.5,301.4],[831.7,304.1],[893.6,313.3],[961.6,340.7],[937.5,403.2],[844.5,428.4],[736.6,433.9],[629.1,423.1],[537,394.4],[535.7,333.6],[606.1,311.5],[668.1,302.7],[719.2,299],[759,298.1],[787.4,298.4],[804.5,299.1],[810.2,299.3]];
    const tC1 = Math.max(tF1 + 1.0, C.stop - 0.1);
    FX.drawCircle(tl, "#a4b-o1", tC1);
    mv(Math.max(C.setzt, tC1 - 0.75), TR1[0], 0.6);
    path(tC1, TR1, 0.5);
    // "… und meistens ist er als Erster der, der wieder raus ist." -> langsamer Zoom; auf "Erster" knallt ein roter Stempel "Raus" drauf (8° schräg).
    const tR2 = Math.max(tC1 + 1.6, C.typ2 - 0.55);
    const tZ1 = Math.max(tC1 + 0.6, Math.min(C.raus, tR2 - 1.1));
    slow(1, tZ1, tR2 - 0.1 - tZ1);
    const tSt = Math.min(tR2 - 0.6, Math.max(tC1 + 0.9, C.erster - 0.1));
    FX.slam(tl, "#a4b-stamp1", tSt, { rotation: -8 });

    // ---------------------------------------------------------------- Typ 2: der Dauerlerner
    back(1, tR2, ["#a4b-o1", "#a4b-stamp1"]);
    mv(tR2, K[2], 0.45);
    const tF2 = Math.max(C.typ2 - 0.05, busy);
    click(tF2);
    fly(2, tF2);
    mv(tF2 + 0.2, REST2, 0.7);
    // "Der hat 50 Videos geschaut …" -> Karte rückt nach links (78 %), rechts daneben ein kleiner Stapel Video-Kacheln "50 Videos".
    const tV = Math.max(tF2 + 0.9, C.videos - 0.1);
    moveCard(2, { x: -148, y: 6, scale: 0.78 }, tV, 0.4, "power2.inOut");   // Karte x 36–748
    FX.pop(tl, "#a4b-vid", tV + 0.2);
    // "… und 20 Strategien gespeichert …" -> die Video-Kacheln gehen, dahinter ein Stapel Zettel "Strategie 1 … 20".
    const t20 = Math.max(tV + 0.9, C.strat20 - 0.3);
    FX.fadeOut(tl, "#a4b-vid", t20, 0.15);
    NOTES.forEach(function (el, k) {
      FX.tween(tl, el, { opacity: 0, x: -300 }, { opacity: 1, x: 0, duration: 0.25, ease: "power2.out" }, t20 + 0.05 + k * 0.08);
    });
    // "… aber noch keinen einzigen Trade gesetzt …" -> "Trades 0" einkreisen; der Cursor zeigt ruhig von links unten auf die "0".
    const tC2 = Math.max(t20 + 0.8, C.keinen - 0.1);
    FX.drawCircle(tl, "#a4b-o2", tC2);
    mv(Math.max(busy + 0.05, tC2 - 0.55), zone(2, 790, 358), 0.55);
    // "… weil er alles verstehen will …" -> Kreis geht, "Wissen 9" wird unterstrichen.
    const tU2 = Math.max(tC2 + 0.9, C.verstehen - 0.1);
    FX.fadeOut(tl, "#a4b-o2", tU2, 0.2);
    FX.drawLine(tl, "#a4b-u2", tU2);

    // ---------------------------------------------------------------- Typ 3: der Ungeduldige
    const tR3 = Math.max(busy + 0.6, tU2 + 0.8, C.typ3 - 0.55);
    back(2, tR3, ["#a4b-u2"].concat(NOTES));
    mv(tR3, K[3], 0.45);
    const tF3 = Math.max(C.typ3 - 0.05, busy);
    click(tF3);
    fly(3, tF3);
    mv(tF3 + 0.2, REST3, 0.7);
    // "… nach 2 Wochen Ergebnisse sehen …" -> kleine tickende Uhr (der Sekundenzeiger springt alle 0,5 s).
    const tW = Math.max(tF3 + 0.8, C.wochen - 0.05);
    FX.pop(tl, "#a4b-clock", tW);
    // "… macht er aus Frust einen Rache-Trade." -> "Frust 10" einkreisen; der Cursor zeigt ruhig von links unten auf die "10".
    const tC3 = Math.max(tW + 1.0, C.frust - 0.1);
    FX.drawCircle(tl, "#a4b-o3", tC3);
    mv(Math.max(busy + 0.05, tC3 - 0.55), zone(3, 768, 360), 0.55);
    const tR4 = Math.max(busy + 0.6, tC3 + 0.9, C.typ4 - 0.55);
    for (let k = 1, t = tW + 0.5; t < tR4 - 0.05; k++, t += 0.5) tl.set("#a4b-sec", { rotation: k * 30, svgOrigin: "0 0" }, t);

    // ---------------------------------------------------------------- Typ 4: der, der dranbleibt
    // "Und jetzt zum Typ Nummer 4:" -> zurück zum Raster, der Cursor geht auf die verdeckte Karte;
    // auf "4" dreht sie sich um (0,4 s um die senkrechte Achse).
    back(3, tR4, ["#a4b-clock", "#a4b-o3"]);
    mv(tR4, K[4], 0.45);
    const tFl = Math.max(C.typ4n - 0.1, busy + 0.05);
    click(tFl);
    FX.tween(tl, "#a4b-back4", { rotationY: 0 }, { rotationY: 90, duration: 0.2, ease: "power1.in" }, tFl);
    tl.set("#a4b-back4", { opacity: 0 }, tFl + 0.2);
    tl.set("#a4b-front4", { opacity: 1 }, tFl + 0.2);
    FX.tween(tl, "#a4b-front4", { rotationY: -90 }, { rotationY: 0, duration: 0.2, ease: "power1.out" }, tFl + 0.2);
    // "Von über 2.000 Leuten in meinem Coaching …" -> Klick, Karte 4 groß: "Der, der dranbleibt", "Plan 10 · Geduld 9", Einblendung "2.000+ im Coaching".
    const tF4 = Math.max(C.coaching - 0.05, tFl + 0.6, busy);
    click(tF4);
    fly(4, tF4);
    FX.pop(tl, "#a4b-badge", Math.max(tF4 + 0.35, C.k2000 - 0.05));
    // "… sind das die, die wirklich dranbleiben." -> "dranbleibt" wird unterstrichen; der Cursor zeigt von links unten auf das Wort.
    const tU4 = Math.max(tF4 + 1.0, C.dran - 0.1);
    mv(Math.max(busy + 0.05, tU4 - 0.55), zone(4, 420, 246), 0.55);
    FX.drawLine(tl, "#a4b-u4", tU4);
    // "Das sind keine Genies und keine Zocker …" -> langsamer Zoom.
    // "… sondern ganz normale Leute, die in einem Vollzeitjob sind …" -> Cursor auf das Bild; "2.000+" geht, "Vollzeitjob" ploppt an seiner Stelle auf.
    // "… einer einzigen Strategie … wenig Zeit … geduldig …" -> 3 Haken.
    const tZ4 = Math.max(tU4 + 0.5, C.genies);
    const tJob = Math.max(C.job - 0.1, tZ4 + 0.4, busy + 0.1);
    const tJ = Math.max(tJob + 0.6, C.vollzeit - 0.1);
    const tk1 = Math.max(tJ + 0.6, C.einzige - 0.05), tk2 = Math.max(tk1 + 0.5, C.wenig - 0.05), tk3 = Math.max(tk2 + 0.5, C.geduldig - 0.05);
    // "Und wenn du zu den vierten Typen passen möchtest …" -> zurück zum Raster (alle 4 Karten offen), die "4" wird eingekreist.
    const tD = Math.max(C.disziplin, tk3 + 0.35);
    const tR5 = Math.max(tD + 1.15, C.vierten - 0.55);
    const tZo = Math.max(tD + 1.0, E.disziplin + 0.2);
    slow(4, tZ4, Math.min(tk1 - 0.1, tZo - 0.1) - tZ4);
    mv(tJob, zoneAt(4, 312, 418, tJob + 0.7), 0.7);
    FX.fadeOut(tl, "#a4b-badge", tJ, 0.15);
    FX.pop(tl, "#a4b-job", tJ + 0.05);
    FX.pop(tl, "#a4b-t1", tk1);
    FX.pop(tl, "#a4b-t2", tk2);
    FX.pop(tl, "#a4b-t3", tk3);
    // "… und Disziplin haben." -> der Cursor gleitet einmal über die 3 Haken und bleibt zwischen Haken 2 und 3; danach leicht rauszoomen.
    mv(tD, zoneAt(4, 470, 556, tD + 0.4), 0.4, "power1.in");
    mv(tD + 0.41, zoneAt(4, 746, 540, tD + 1.11), 0.7, "power1.out");
    slow(4, tZo, tR5 - 0.1 - tZo, true);
    back(4, tR5, ["#a4b-job", "#a4b-t1", "#a4b-t2", "#a4b-t3", "#a4b-u4"]);
    const TR4 = [[887.4,418.1],[919.1,419.2],[962.8,437.9],[986.1,459.9],[1006.8,503.7],[1008.9,536],[1001.8,567.1],[978,607.4],[955.2,628.8],[911.6,649.1],[878.5,650.2],[846.9,639],[811.8,603],[799.4,572.5],[794.7,524.7],[799.7,493.2],[812.2,463.1],[846.5,427.4],[877.2,414.8],[926.7,415.7],[957.3,428.4]];
    const tC4 = Math.max(tR5 + 0.45, C.vierten - 0.1);
    mv(Math.max(busy + 0.05, tR5 + 0.05), TR4[0], Math.max(0.3, Math.min(0.6, tC4 - 0.05 - Math.max(busy + 0.06, tR5 + 0.05))));
    FX.drawCircle(tl, "#a4b-c4o", tC4);
    path(tC4, TR4, 0.5);

    // ---------------------------------------------------------------- Kurs-Mockup (ohne Punkte: nur der Laptop, mittig)
    // "… einen kostenfreien Videokurs anschauen." -> Schnitt auf den Kurs; der Laptop schiebt sich in 0,25 s rein,
    // der Cursor gleitet auf das grüne Badge "Kostenloser Videokurs".
    const tK = Math.max(tC4 + 0.9, C.kurs - 0.05);
    tl.set("#a4b-grid", { opacity: 0 }, tK);
    tl.set("#a4b-course", { opacity: 0 }, 0);
    tl.set("#a4b-course", { opacity: 1 }, tK);
    FX.tween(tl, "#a4b-course-laptop", { opacity: 0, x: -1100 }, { opacity: 1, x: 0, duration: 0.25, ease: "power2.out" }, tK);
    mv(Math.max(tK + 0.15, busy + 0.05), [418, 165], 0.8);
    // "Dort zeige ich dir alles, was du brauchst …" -> langsamer Zoom auf den Laptop.
    // "… um zum vierten Typ dazuzugehören." -> der Cursor gleitet ruhig auf "Kostenlos starten".
    const tCTA = Math.max(C.klick - 0.05, busy + 0.2);
    const tDort = Math.max(tK + 1.0, C.dort - 0.05);
    if (tCTA - 0.1 - tDort >= 1) FX.slowZoom(tl, "#a4b-course-laptop", tDort, { d: Math.min(3, tCTA - 0.1 - tDort), to: 1 + 0.08 * Math.min(3, tCTA - 0.1 - tDort) / 3 });
    const tDazu = Math.max(busy + 0.3, C.dazu - 0.1);
    if (tDazu + 0.7 < tCTA - 0.1) mv(tDazu, [476, 470], 0.7);

    // ---------------------------------------------------------------- CTA-Bild (bleibt bis zum Ende)
    // "Deswegen klicke auf den Button, und ich wünsche dir ganz viel Erfolg." -> Laptop + "Mehr dazu" + Pfeil nach unten.
    tl.set("#a4b-course", { opacity: 0 }, tCTA);
    FX.cta(tl, "a4b-cta", tCTA);
    steps.push({ t: tCTA, hide: true });

    FX.cursor(tl, "#a4b-cur", "#a4b-ring", R, steps);
    window.__timelines["ad4-body"] = tl;
  </script>
</template>
