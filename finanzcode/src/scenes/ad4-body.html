              <div id="a4b-p4" class="a4b-photo photo-slot" data-asset="ad4-portrait-dranbleiber"><svg id="a4b-pi4" viewBox="0 0 380 574"><rect width="380" height="574" fill="#DDE3EA"/><path d="M24 574 V478 C24 400 88 352 190 348 C292 352 356 400 356 478 V574 Z" fill="#16A34A"/><path d="M160 250 H220 V338 Q190 360 160 338 Z" fill="#74431B"/><path d="M140 352 C150 330 230 330 240 352 C226 372 154 372 140 352 Z" fill="#15803D"/><ellipse cx="114" cy="206" rx="15" ry="24" fill="#8D5524"/><ellipse cx="266" cy="206" rx="15" ry="24" fill="#8D5524"/><ellipse cx="190" cy="196" rx="77" ry="92" fill="#8D5524"/><path d="M114 182 C108 116 150 92 192 92 C236 92 274 118 266 182 C256 150 232 132 192 132 C152 132 126 150 114 182 Z" fill="#111827"/><path d="M138 168 Q157 160 176 168" fill="none" stroke="#111827" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M204 168 Q223 160 242 168" fill="none" stroke="#111827" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="158" cy="204" rx="14" ry="12" fill="#FFFFFF"/><circle cx="158" cy="204" r="8" fill="#111827"/><circle cx="161" cy="201" r="2.6" fill="#FFFFFF"/><ellipse cx="222" cy="204" rx="14" ry="12" fill="#FFFFFF"/><circle cx="222" cy="204" r="8" fill="#111827"/><circle cx="225" cy="201" r="2.6" fill="#FFFFFF"/><path d="M144 198 Q158 190 172 198" fill="none" stroke="#74431B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M208 198 Q222 190 236 198" fill="none" stroke="#74431B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M192 214 Q181 236 194 241" fill="none" stroke="#74431B" stroke-width="7" stroke-linecap="round"/><path d="M164 252 Q190 274 216 252" fill="none" stroke="#3B1F0E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="150" y="306" width="80" height="50" rx="20" fill="#15803D"/><path d="M230 344 C266 344 266 388 230 388" fill="none" stroke="#FFFFFF" stroke-width="13"/><rect x="146" y="324" width="88" height="88" rx="14" fill="#FFFFFF"/><ellipse cx="190" cy="326" rx="40" ry="9" fill="#6B3F1D"/><rect x="146" y="352" width="88" height="20" fill="#0E1A2B"/><ellipse cx="144" cy="392" rx="27" ry="21" fill="#8D5524"/><ellipse cx="236" cy="394" rx="27" ry="21" fill="#8D5524"/></svg></div>
              <div id="a4b-d4" class="a4b-dig">4</div>
              <div id="a4b-n4" class="a4b-name">Der, der<br>dranbleibt</div>
              <div id="a4b-va4" class="a4b-val" style="top:256px"><span>Plan</span><span>10</span></div>
              <div id="a4b-vb4" class="a4b-val" style="top:372px"><span>Geduld</span><span>9</span></div>
              <div id="a4b-badge" style="position:absolute;left:578px;top:30px;width:306px;height:150px;border-radius:26px;background:#0E1A2B;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Poppins';font-weight:700;color:#FFFFFF;line-height:1.08;white-space:nowrap;"><span style="font-size:64px">2.000+</span><span style="font-size:40px">im Coaching</span></div>
              <svg id="a4b-t1" viewBox="0 0 96 96" style="position:absolute;left:444px;top:496px;width:96px;height:96px;overflow:visible;"><circle cx="48" cy="48" r="48" fill="#16A34A"/><path d="M26 50 L41 65 L71 33" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <svg id="a4b-t2" viewBox="0 0 96 96" style="position:absolute;left:614px;top:496px;width:96px;height:96px;overflow:visible;"><circle cx="48" cy="48" r="48" fill="#16A34A"/><path d="M26 50 L41 65 L71 33" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <svg id="a4b-t3" viewBox="0 0 96 96" style="position:absolute;left:784px;top:496px;width:96px;height:96px;overflow:visible;"><circle cx="48" cy="48" r="48" fill="#16A34A"/><path d="M26 50 L41 65 L71 33" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>

      <!--@include cta p="a4b-cta"-->

      <div id="a4b-k"><span>Kommentar</span><svg viewBox="0 0 30 44"><path d="M9 0 H21 V25 H30 L15 44 L0 25 H9 Z" fill="#0E1A2B"/></svg></div>
      <!--@include more p="a4b-more"-->
      <!--@include cursor p="a4b"-->
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const S = 1 / 1.9;                                    // Groß-Format 912 x 638 -> Raster 480 x 336
    const SL = [[288,178],[792,178],[288,532],[792,532]];
    const card = function (n) { return "#a4b-c" + n; };
    const others = function (n) { return [1, 2, 3, 4].filter(function (k) { return k !== n; }).map(card); };
    const grid = function (n) { return { x: SL[n - 1][0] - 540, y: SL[n - 1][1] - 355, scale: S }; };
    const st = {};                                         // aktueller Transform jeder Karte (für lückenlose fromTo-Ketten)
    function moveCard(n, to, t, d, ease) {
      FX.tween(tl, card(n), { x: st[n].x, y: st[n].y, scale: st[n].scale }, { x: to.x, y: to.y, scale: to.scale, duration: d, ease: ease }, t);
      st[n] = { x: to.x, y: to.y, scale: to.scale };
    }
    function zone(n, nx, ny) { const s = st[n]; return [540 + s.x + (nx - 456) * s.scale, 355 + s.y + (ny - 319) * s.scale]; }
    const DIG = { x: 138, y: 191 };                        // Ziffer wandert in der großen Karte nach rechts unten (190 px)
    const PH = { 1: [156, 450, -50], 2: [156, 450, -50], 3: [156, 450, -50], 4: [256, 350, -75] }; // Bildausschnitt groß

    // ---------------------------------------------------------------- Anfangszustand = letztes Bild der Anfänge
    [1, 2, 3, 4].forEach(function (n) {
      st[n] = grid(n);
      FX.init(tl, card(n), { x: st[n].x, y: st[n].y, scale: S, transformOrigin: "50% 50%", zIndex: 1, opacity: 1 });
      FX.init(tl, "#a4b-d" + n, { x: 0, y: 0, scale: 1.9, transformOrigin: "50% 50%", opacity: 1 });
      FX.init(tl, ["#a4b-n" + n, "#a4b-va" + n, "#a4b-vb" + n], { opacity: 0 });
    });
    FX.init(tl, ["#a4b-clock", "#a4b-badge", "#a4b-t1", "#a4b-t2", "#a4b-t3"], { opacity: 0 });
    FX.init(tl, "#a4b-badge", { rotation: -4, transformOrigin: "50% 50%" });
    FX.init(tl, "#a4b-sec", { rotation: 0, svgOrigin: "0 0" });
    [1, 2, 3, 4, 5].forEach(function (k) { FX.init(tl, "#a4b-nt" + k, { opacity: 0, x: -300, rotation: [-3, 3, -2, 3, -3][k - 1], transformOrigin: "50% 50%" }); });
    FX.init(tl, "#a4b-front4", { rotationY: -90, opacity: 0, transformPerspective: 2400, transformOrigin: "50% 50%" });
    FX.init(tl, "#a4b-back4", { rotationY: 0, opacity: 1, transformPerspective: 2400, transformOrigin: "50% 50%" });
    FX.init(tl, ["#a4b-q", "#a4b-k", "#a4b-cta-more"], { opacity: 0 });

    // Karte fliegt groß nach vorn: wächst in 0,4 s (ease-out) auf 90 % der Motiv-Zone, die anderen blenden aus.
    // Name (96 px) und genau 2 Werte (72 px) erscheinen erst jetzt.
    function fly(n, t) {
      tl.set(card(n), { zIndex: 5 }, t);
      moveCard(n, { x: 0, y: 0, scale: 1 }, t, 0.4, "power2.out");
      others(n).forEach(function (el) { FX.fadeOut(tl, el, t); });
      FX.tween(tl, "#a4b-p" + n, { top: 32, height: 574 }, { top: PH[n][0], height: PH[n][1], duration: 0.4, ease: "power2.out" }, t);
      FX.tween(tl, "#a4b-pi" + n, { y: 0 }, { y: PH[n][2], duration: 0.4, ease: "power2.out" }, t);
      if (n < 4) FX.tween(tl, "#a4b-d" + n, { x: 0, y: 0, scale: 1.9 }, { x: DIG.x, y: DIG.y, scale: 1, duration: 0.4, ease: "power2.out" }, t);
      else FX.fadeOut(tl, "#a4b-d4", t, 0.15);
      FX.pop(tl, "#a4b-n" + n, t + 0.25);
      FX.pop(tl, "#a4b-va" + n, t + 0.35);
      FX.pop(tl, "#a4b-vb" + n, t + 0.45);
    }
    // Karte zurück ins Raster (0,4 s), Namen/Werte/Extras blenden aus, die anderen Karten blenden wieder ein.
    function back(n, t, extras) {
      ["#a4b-n" + n, "#a4b-va" + n, "#a4b-vb" + n].concat(extras || []).forEach(function (el) { FX.fadeOut(tl, el, t, 0.15); });
      moveCard(n, grid(n), t, 0.4, "power2.inOut");
      others(n).forEach(function (el) { FX.fadeIn(tl, el, t); });
      FX.tween(tl, "#a4b-p" + n, { top: PH[n][0], height: PH[n][1] }, { top: 32, height: 574, duration: 0.4, ease: "power2.inOut" }, t);
      FX.tween(tl, "#a4b-pi" + n, { y: PH[n][2] }, { y: 0, duration: 0.4, ease: "power2.inOut" }, t);
      FX.tween(tl, "#a4b-d" + n, { x: DIG.x, y: DIG.y, scale: 1 }, { x: 0, y: 0, scale: 1.9, duration: 0.4, ease: "power2.inOut" }, t);
      tl.set(card(n), { zIndex: 1 }, t + 0.4);
    }
    const zooms = { 1: [], 2: [], 3: [], 4: [] };          // langsame Zooms je Karte (für Cursor-Ziele während des Zooms)
    function slow(n, t, d, zoomOut) {   // langsamer Zoom 100 -> 108 % über 3 s (anteilig), oder zurück
      if (d < 1) return;
      const k = 0.08 * Math.min(3, d) / 3, s0 = st[n].scale, s1 = zoomOut ? s0 - k : s0 + k;
      moveCard(n, { x: st[n].x, y: st[n].y, scale: s1 }, t, Math.min(3, d), "none");
      zooms[n].push({ t: t, d: Math.min(3, d), s0: s0, s1: s1 });
    }
    function scaleAt(n, t) {            // Maßstab der Karte n zur Zeit t (nur für Zeiten nach dem Groß-Flug)
      let s = 1;
      zooms[n].forEach(function (z) { if (t >= z.t) s = z.s0 + (z.s1 - z.s0) * Math.min(1, (t - z.t) / z.d); });
      return s;
    }
    function zoneAt(n, nx, ny, t) { const s = scaleAt(n, t); return [540 + st[n].x + (nx - 456) * s, 355 + st[n].y + (ny - 319) * s]; }

    // Cursor-Hilfen (eine ruhige Bewegung pro Satz; nie zwei Cursor-Tweens gleichzeitig)
    const steps = [];
    let busy = 0;
    function mv(t, to, d, ease) { t = Math.max(t, busy + 0.01); steps.push({ t: t, to: to, d: d, ease: ease || "power2.inOut" }); busy = t + d; return busy; }
    function path(t, pts, d) { t = Math.max(t, busy + 0.01); const seg = d / (pts.length - 1); for (let i = 1; i < pts.length; i++) steps.push({ t: t + (i - 1) * seg, to: pts[i], d: seg, ease: "none" }); busy = t + d; return busy; }
    function click(t) { steps.push({ t: t, click: true }); }
    const R = [215, 270];                                  // = Endpunkt der Anfänge (auf dem Bild von Karte 1)
    // Klickpunkte auf den Raster-Karten. K[4] liegt auf dem "?" und ist zugleich ein freier Ruhepunkt der großen Karte 4 (unten Mitte).
    const K = { 2: [720, 270], 3: [215, 624], 4: [784, 576] };
    // Nach jedem Klick gleitet der Cursor einmal auf eine freie Fläche der großen Karte (nie an den Rand der Motiv-Zone, nie auf den Kartenrand).
    const REST1 = [624, 486];                              // Karte 1 groß: unter den Werten, links der Ziffer
    const REST2 = [560, 505];                              // Karte 2: frei sowohl groß als auch verkleinert (links der Ziffer)
    const REST3 = [752, 446];                              // Karte 3 groß: zwischen Uhr und Ziffer

    // ---------------------------------------------------------------- Typ 1: der Zocker
    // "Typ 1 ist der Zocker." -> Klick, Karte 1 fliegt groß nach vorn: "Der Zocker", "Risiko 10 · Plan 0".
    const tF1 = Math.max(0, C.typ1 - 0.05);
    click(tF1);
    fly(1, tF1);
    mv(tF1 + 0.2, REST1, 0.7);
    // "… hat keinen Stop und hofft auf den großen Wurf …" -> "Plan 0" einkreisen; der Cursor zeichnet mit und bleibt am Ende des Kreises liegen.
    const TR1 = [[689.5,303.9],[695.2,303.6],[712.2,302.5],[740.7,301.4],[780.5,301.4],[831.7,304.1],[893.6,313.3],[961.6,340.7],[937.5,403.2],[844.5,428.4],[736.6,433.9],[629.1,423.1],[537,394.4],[535.7,333.6],[606.1,311.5],[668.1,302.7],[719.2,299],[759,298.1],[787.4,298.4],[804.5,299.1],[810.2,299.3]];
    const tC1 = Math.max(tF1 + 1.0, C.stop - 0.1);
    FX.drawCircle(tl, "#a4b-o1", tC1);
    mv(Math.max(C.setzt, tC1 - 0.75), TR1[0], 0.6);
    path(tC1, TR1, 0.5);
    // "… und meistens ist er als Erster wieder raus." -> langsamer Zoom.
    const tR2 = Math.max(tC1 + 1.4, C.typ2 - 0.55);
    const tZ1 = Math.max(tC1 + 0.8, C.raus);
    slow(1, tZ1, tR2 - 0.1 - tZ1);

    // ---------------------------------------------------------------- Typ 2: der Dauerlerner
    back(1, tR2, ["#a4b-o1"]);
    mv(tR2, K[2], 0.45);
    const tF2 = Math.max(C.typ2 - 0.05, busy);
    click(tF2);
    fly(2, tF2);
    mv(tF2 + 0.2, REST2, 0.7);
    // "… 50 Videos geschaut und 20 Strategien gespeichert …" -> Karte rückt nach links (78 %, Werte ≈ 56 px), dahinter ein Stapel Zettel "Strategie 1 … 20".
    const tV = Math.max(tF2 + 0.9, C.videos - 0.1);
    moveCard(2, { x: -148, y: 6, scale: 0.78 }, tV, 0.4, "power2.inOut");   // Karte x 36–748: ≈ 20 px Luft bis "Strategie 20"
    [1, 2, 3, 4].forEach(function (k) {
      FX.tween(tl, "#a4b-nt" + k, { opacity: 0, x: -300 }, { opacity: 1, x: 0, duration: 0.25, ease: "power2.out" }, tV + 0.2 + (k - 1) * 0.08);
    });
    const t20 = Math.max(tV + 0.65, C.strat20 - 0.05);
    FX.tween(tl, "#a4b-nt5", { opacity: 0, x: -300 }, { opacity: 1, x: 0, duration: 0.25, ease: "power2.out" }, t20);
    // "… aber noch keinen einzigen Trade gesetzt …" -> Cursor zeigt ruhig von links unten auf die "0" von "Trades 0".
    mv(Math.max(C.keinen, t20 + 0.4), zone(2, 790, 358), 0.6);

    // ---------------------------------------------------------------- Typ 3: der Ungeduldige
    const tR3 = Math.max(busy + 0.6, C.typ3 - 0.55);
    back(2, tR3, ["#a4b-nt1", "#a4b-nt2", "#a4b-nt3", "#a4b-nt4", "#a4b-nt5"]);
    mv(tR3, K[3], 0.45);
    const tF3 = Math.max(C.typ3 - 0.05, busy);
    click(tF3);
    fly(3, tF3);
    mv(tF3 + 0.2, REST3, 0.7);
    // "… nach 2 Wochen Ergebnisse sehen …" -> kleine tickende Uhr (der Sekundenzeiger springt alle 0,5 s).
    const tW = Math.max(tF3 + 0.8, C.wochen - 0.05);
    FX.pop(tl, "#a4b-clock", tW);
    // "… macht er aus Frust einen Rache-Trade …" -> Cursor zeigt ruhig von links unten auf "10" von "Frust 10".
    mv(Math.max(C.frust, tW + 0.5), zone(3, 768, 360), 0.6);
    const tR4 = Math.max(busy + 0.6, C.typ4 - 0.55);
    for (let k = 1, t = tW + 0.5; t < tR4 - 0.05; k++, t += 0.5) tl.set("#a4b-sec", { rotation: k * 30, svgOrigin: "0 0" }, t);

    // ---------------------------------------------------------------- Typ 4: der, der dranbleibt
    // "Und dann gibt's noch einen 4. Typ:" -> zurück zum Raster, der Cursor geht auf die verdeckte Karte;
    // auf "4." dreht sie sich um (0,4 s um die senkrechte Achse).
    back(3, tR4, ["#a4b-clock"]);
    mv(tR4, K[4], 0.45);
    const tFl = Math.max(C.typ4n - 0.1, busy + 0.05);
    click(tFl);
    FX.tween(tl, "#a4b-back4", { rotationY: 0 }, { rotationY: 90, duration: 0.2, ease: "power1.in" }, tFl);
    tl.set("#a4b-back4", { opacity: 0 }, tFl + 0.2);
    tl.set("#a4b-front4", { opacity: 1 }, tFl + 0.2);
    FX.tween(tl, "#a4b-front4", { rotationY: -90 }, { rotationY: 0, duration: 0.2, ease: "power1.out" }, tFl + 0.2);
    // "Von über 2.000 Leuten in meinem Coaching …" -> Klick, Karte 4 groß: "Der, der dranbleibt", "Plan 10 · Geduld 9", Einblendung "2.000+ im Coaching".
    // Der Cursor bleibt liegen: der Klickpunkt ist auf der großen Karte eine freie Fläche (unten Mitte, über den späteren Haken).
    const tF4 = Math.max(C.coaching - 0.05, tFl + 0.6, busy);
    click(tF4);
    fly(4, tF4);
    FX.pop(tl, "#a4b-badge", Math.max(tF4 + 0.35, C.k2000 - 0.05));   // Untergrenze klein, damit "2.000+" auch bei schnellem Sprechen nie nach "2.000" kommt
    // "… sind das die, die dranbleiben." -> Cursor zeigt ruhig auf "10" von "Plan 10".
    const tZ4 = Math.max(tF4 + 1.0, C.genies);
    const tk1 = Math.max(tF4 + 1.2, C.einzige - 0.05), tk2 = Math.max(tk1 + 0.4, C.wenig - 0.05), tk3 = Math.max(tk2 + 0.4, C.geduldig - 0.05);
    mv(Math.max(C.dran - 0.1, tF4 + 0.6), zone(4, 768, 336), 0.6);
    // "Das sind keine Genies …" -> langsamer Zoom; "… ganz normale Leute mit Job …" -> Cursor zeigt auf das Bild;
    // "… eine einzige Strategie … wenig riskieren … geduldig" -> 3 Haken.
    slow(4, tZ4, tk1 - 0.1 - tZ4);
    const tJob = Math.max(C.job - 0.1, busy + 0.3);
    mv(tJob, zoneAt(4, 312, 418, tJob + 0.7), 0.7);
    FX.pop(tl, "#a4b-t1", tk1);
    FX.pop(tl, "#a4b-t2", tk2);
    FX.pop(tl, "#a4b-t3", tk3);
    // "Dafür musst du kein Profi sein …" -> leicht rauszoomen; der Cursor gleitet einmal über die 3 Haken und bleibt zwischen Haken 2 und 3.
    const tK = Math.max(tk3 + 0.6, C.kurs - 0.05);
    const tZ4b = Math.max(tk3 + 0.4, C.profi);
    slow(4, tZ4b, Math.min(st[4].scale > 1 ? 3 * (st[4].scale - 1) / 0.08 : 0, tK - 0.1 - tZ4b), true);
    const tP = Math.max(C.profi, busy + 0.2);
    if (tP + 1.45 < tK - 0.1) {
      mv(tP, zoneAt(4, 470, 556, tP + 0.55), 0.55, "power1.in");
      mv(tP + 0.56, zoneAt(4, 746, 540, tP + 1.41), 0.85, "power1.out");
    }

    // ---------------------------------------------------------------- Kurs-Mockup (ohne Punkte: nur der Laptop, mittig)
    // "Wie du zu diesem 4. Typ wirst …" -> Schnitt auf den Kurs; der Laptop schiebt sich in 0,25 s rein.
    tl.set("#a4b-grid", { opacity: 0 }, tK);
    tl.set("#a4b-course", { opacity: 0 }, 0);
    tl.set("#a4b-course", { opacity: 1 }, tK);
    FX.tween(tl, "#a4b-course-laptop", { opacity: 0, x: -1100 }, { opacity: 1, x: 0, duration: 0.25, ease: "power2.out" }, tK);
    // Eine ruhige Bewegung für den Satz: gleich nach dem Schnitt gleitet der Cursor vom Laptop-Rand auf das rechte Ende des grünen Badges
    // (Badge ≈ x 218–422, y 148–177) und liegt dort, während "kostenlosen Videokurs" gesprochen wird.
    mv(Math.max(tK + 0.1, Math.min(tK + 0.35, C.kostenlos - 1.0)), [418, 165], 0.9);

    // ---------------------------------------------------------------- CTA-Bild
    // "Klick unter dem Video auf „Mehr dazu“ …" -> Laptop + "Mehr dazu" + Pfeil nach unten.
    const tCTA = Math.max(C.klick - 0.05, busy + 0.2);
    tl.set("#a4b-course", { opacity: 0 }, tCTA);
    FX.cta(tl, "a4b-cta", tCTA);
    steps.push({ t: tCTA, hide: true });

    // ---------------------------------------------------------------- Schlussbild
    // "… welcher Typ du bisher warst." -> Raster mit allen 4 Karten offen, "Welcher warst du?" + "Kommentar ↓", Banner "Mehr dazu ↓" bis zum Ende.
    const tEnd = Math.max(C.welcher - 0.05, tCTA + 1.2);
    tl.set("#a4b-cta", { opacity: 0 }, tEnd);
    const G = 0.58, GX = 40, GY = 96;                       // Raster auf 58 %, links; Text rechts
    [1, 2, 3, 4].forEach(function (n) {
      const c = SL[n - 1];
