  <script>
    const tl = gsap.timeline({ paused: true });
    const PIV = "540 650";    // Fußpunkt (Wackeln)
    const TIP = "478 588";    // Kipp-Drehpunkt: nach -90° liegt der Sitzrand auf dem Boden
    const REST = "364 650";   // Sitzrand am Boden: darum fällt der liegende Hocker auf seinen Fuß
    const HG = "540 355";     // Mitte der Sanduhr (Umdrehen)
    // Hook framing: the hooks draw the same user units at 1.125x with viewBox x/y 60. In this viewBox
    // (-100 -4, 1:1) that is world scale 1.125 + offset (-167.5, -71.5).
    const HOOK = { scale: 1.125, x: -167.5, y: -71.5 };
    // Pivot of every transformed SVG element is set once at t = 0 (no smoothOrigin offsets on seek).
    const pv = (el, o) => FX.init(tl, el, { ...o, smoothOrigin: false });

    document.querySelector("#a6b-circ").setAttribute("d", FX.handCircle(200, 232, 240, 64, 7));

    // ---------------------------------------------------------------- initial states (t = 0)
    pv("#a6b-world", { svgOrigin: "0 0", ...HOOK });
    FX.init(tl, "#a6b-floor", { attr: { x1: 250, x2: 830 } });
    pv("#a6b-restG", { svgOrigin: REST });
    pv("#a6b-tipG", { svgOrigin: TIP });
    pv("#a6b-rig", { svgOrigin: PIV });
    pv("#a6b-screw", { transformOrigin: "50% 50%", opacity: 0 });
    pv("#a6b-stand", { transformOrigin: "50% 100%", opacity: 0 });
    pv("#a6b-fallen", { svgOrigin: "0 0", opacity: 0 });
    pv("#a6b-lGehalt", { transformOrigin: "50% 50%", opacity: 0 });
    pv("#a6b-lAG", { transformOrigin: "50% 50%", opacity: 0 });
    pv("#a6b-lTrading", { transformOrigin: "50% 50%", opacity: 0 });
    pv("#a6b-sandTop", { transformOrigin: "50% 100%" });
    pv("#a6b-sandBot", { transformOrigin: "50% 100%" });
    pv("#a6b-hgRot", { svgOrigin: HG });
    FX.init(tl, "#a6b-hg", { transformOrigin: "50% 50%" });
    FX.init(tl, ["#a6b-leg2", "#a6b-saw", "#a6b-armsFall", "#a6b-faceFall"], { opacity: 0 });
    FX.init(tl, ["#a6b-s2", "#a6b-s3", "#a6b-s4"], { opacity: 0 });
    FX.init(tl, ["#a6b-t0", "#a6b-t1", "#a6b-t2", "#a6b-m30", "#a6b-mTick"], { opacity: 0 });
    // (The course ticks #a6b-course-i0..2 are hidden at t = 0 by FX.course itself.)

    // ---------------------------------------------------------------- Folie 1
    // Anschluss an den Hook: gleicher Bildausschnitt und das gestrichelte Bein vom Hook-Ende. Das
    // gestrichelte Bein blendet aus, das Bild rückt nach rechts (Platz für die Labels), dann "Gehalt".
    const tGeh = Math.max(0.6, C.gehalt - 0.05);
    const tMove = Math.min(0.45, Math.max(0.1, tGeh - 0.6));
    FX.fadeOut(tl, "#a6b-dash", Math.max(0.05, tMove - 0.15));
    FX.tween(tl, "#a6b-world", { ...HOOK, svgOrigin: "0 0" }, { scale: 1, x: 0, y: 0, duration: 0.4, ease: "power2.inOut", svgOrigin: "0 0" }, tMove);
    FX.tween(tl, "#a6b-floor", { attr: { x1: 250, x2: 830 } }, { attr: { x1: -20, x2: 880 }, duration: 0.4, ease: "power2.inOut" }, tMove);

    // "Das erste Bein ist das Gehalt." -> Label "Gehalt" am Bein.
    FX.pop(tl, "#a6b-lGehalt", tGeh);

    // "Das hängt an einem einzigen Arbeitgeber ..." -> Label "1 Arbeitgeber", einkreisen.
    const tAG = Math.max(tGeh + 0.4, C.einzigen - 0.05);
    FX.pop(tl, "#a6b-lAG", tAG);
    const tCirc = Math.max(tAG + 0.25, C.arbeitgeber - 0.1);
    FX.drawCircle(tl, "#a6b-circ", tCirc);

    // "... solange keiner dran sägt, steht der Stuhl." -> eine Säge erscheint am Bein.
    const tSaw = Math.max(tCirc + 0.6, C.saegt - 0.1);
    FX.fadeIn(tl, "#a6b-saw", tSaw);
    // "Aber wenn doch," -> die Säge sägt (hin und her, endet vor dem Kippen).
    const sawFrom = Math.max(tSaw + 0.3, C.aber);
    const strokes = 2 * Math.floor((C.kippt - 0.05 - sawFrom) / 0.5);
    if (strokes >= 2) FX.tween(tl, "#a6b-saw", { x: 0 }, { x: 30, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: strokes - 1 }, sawFrom);

    // "... kippt alles auf einmal." -> der Hocker kippt um 90°, die Figur fällt.
    const tTip = Math.max(C.kippt, tSaw + 0.4);
    FX.fadeOut(tl, ["#a6b-lGehalt", "#a6b-lAG", "#a6b-circG", "#a6b-saw"], tTip - 0.1);
    FX.set(tl, ["#a6b-armsRelax", "#a6b-faceRelax"], { opacity: 0 }, tTip);
    FX.set(tl, ["#a6b-armsFall", "#a6b-faceFall"], { opacity: 1 }, tTip);
    FX.tip(tl, "#a6b-tipG", tTip, { from: 0, to: -90, svgOrigin: TIP });
    // Aufschlag: der liegende Hocker fällt auf seinen Fuß, die Figur plumpst daneben auf den Rücken.
    const tLand = tTip + 0.35;
    FX.tween(tl, "#a6b-restG", { rotation: 0, svgOrigin: REST }, { rotation: 22, duration: 0.15, ease: "power2.in", svgOrigin: REST }, tLand);
    FX.set(tl, "#a6b-sit", { opacity: 0 }, tLand);
    FX.tween(tl, "#a6b-fallen", { opacity: 1, x: 30, y: -40 }, { opacity: 1, x: 0, y: 0, duration: 0.15, ease: "power2.in" }, tLand);

    // "Ein zweites Standbein heißt nicht, dass du morgen kündigst." -> die Figur steht wieder auf
    // (und stellt den Hocker wieder hin; der steht wieder nur auf einem Bein und wackelt).
    const tUp = Math.max(C.standbein - 0.05, tLand + 0.4);
    FX.set(tl, "#a6b-fallen", { opacity: 0 }, tUp);
    FX.pop(tl, "#a6b-stand", tUp, { origin: "50% 100%" });
    FX.tween(tl, "#a6b-tipG", { rotation: -90, svgOrigin: TIP }, { rotation: 0, duration: 0.35, ease: "power2.out", svgOrigin: TIP }, tUp);
    FX.tween(tl, "#a6b-restG", { rotation: 22, svgOrigin: REST }, { rotation: 0, duration: 0.35, ease: "power2.out", svgOrigin: REST }, tUp);
    // Wackeln ±6° (0,6 s pro Schwung); der letzte Schwung endet bei -6° genau, wenn das zweite Bein kommt.
    const tSettle = Math.max(C.nicht - 0.05, tUp + 0.4);
    const nSw = Math.floor((tSettle - (tUp + 0.35) - 0.3) / 0.6);
    if (nSw >= 1) {
      const s0 = nSw % 2 === 0 ? -6 : 6;
      const tw = tSettle - nSw * 0.6;
      FX.tween(tl, "#a6b-rig", { rotation: 0 }, { rotation: s0, duration: 0.3, ease: "sine.out", svgOrigin: PIV }, tw - 0.3);
      FX.tween(tl, "#a6b-rig", { rotation: s0 }, { rotation: -s0, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: nSw - 1, svgOrigin: PIV }, tw);
      FX.settle(tl, "#a6b-rig", tSettle, -6, { svgOrigin: PIV });
    }

    // "... nicht mehr alles an einer einzigen Unterschrift hängt." -> das zweite Bein "Trading" wird
    // angeschraubt (schiebt sich rein, Schraube dreht sich), der Hocker steht stabil.
    const tLeg = tSettle + 0.05;
    FX.flyIn(tl, "#a6b-leg2", tLeg, { from: "right", dist: 560 });
    FX.pop(tl, "#a6b-screw", tLeg + 0.27);
    FX.tween(tl, "#a6b-screw", { rotation: 0 }, { rotation: 720, duration: 0.5, ease: "power1.inOut", transformOrigin: "50% 50%" }, tLeg + 0.42);
    const tLab = Math.min(Math.max(tLeg + 0.95, C.unterschrift), Math.max(tLeg + 0.5, E.nicht - 0.15));
    FX.pop(tl, "#a6b-lTrading", tLab);
    // "... ist Trading für mich das sinnvollste zweite Bein" -> das Label pulsiert.
    const tPulse = Math.max(C.trading - 0.1, tLab + 0.4);
    if (tPulse + 1.6 < C.kunden) FX.pulse(tl, "#a6b-lTrading", tPulse, 1.6);

    // ---------------------------------------------------------------- Folie 2: 3 Haken
    // "... keine Kunden brauchst, nichts verkaufen musst und es nicht nach Stunden läuft"
    FX.cut(tl, "#a6b-s1", "#a6b-s2", C.kunden);
    const tk1 = C.kunden, tk2 = Math.max(tk1 + 0.4, C.verkaufen - 0.05), tk3 = Math.max(tk2 + 0.4, C.stunden - 0.05);
    FX.pop(tl, "#a6b-t0", tk1, { origin: "0% 50%" });
    FX.pop(tl, "#a6b-t1", tk2, { origin: "0% 50%" });
    FX.pop(tl, "#a6b-t2", tk3, { origin: "0% 50%" });
    // "Ein Trade kostet dich gleich viel Zeit ..." (keine eigene Zeile): "nicht nach Stunden" pulsiert
    // einmal auf "gleich viel Zeit", dazu ein langsamer Zoom auf die Liste.
    const tZ1 = Math.max(C.trade, tk3 + 0.4);
    const dZ1 = Math.min(3, C.klar - 0.05 - tZ1);
    if (dZ1 > 1) FX.slowZoom(tl, "#a6b-tList", tZ1, { d: dZ1, to: 1 + 0.08 * dZ1 / 3 });
    const tRow = Math.max(C.gleich - 0.1, tk3 + 0.3);
    if (tRow + 0.8 <= C.klar - 0.1) FX.pulse(tl, "#a6b-t2", tRow, 0.8, { origin: "0% 50%" });

    // ---------------------------------------------------------------- Folie 3: Sanduhr
    // "Klar, das baut sich nicht über Nacht auf." -> eine Sanduhr ploppt auf und läuft.
    FX.cut(tl, "#a6b-s2", "#a6b-s3", C.klar);
    FX.pop(tl, "#a6b-hg", C.klar);
    // "Am Anfang lernst du ..." (keine eigene Zeile): die Sanduhr wird umgedreht (180° in 0,35 s)
    // und läuft neu bis zur nächsten Folie; dazu ein langsamer Zoom.
    const tFlip = Math.min(Math.max(C.klar + 1.2, C.anfang - 0.1), C.min30 - 2);
    const flip = tFlip - C.klar >= 1.2;
    const tRun2 = tFlip + 0.35;
    const tEndDrain = Math.max(flip ? tRun2 + 1.2 : C.klar + 1.5, C.min30 - 0.2);
    if (flip) {
      FX.tween(tl, "#a6b-sandTop", { scale: 1 }, { scale: 0.14, duration: tFlip - C.klar, ease: "none", transformOrigin: "50% 100%" }, C.klar);
      FX.tween(tl, "#a6b-sandBot", { scale: 0.3 }, { scale: 1, duration: tFlip - C.klar, ease: "none", transformOrigin: "50% 100%" }, C.klar);
      FX.set(tl, "#a6b-stream", { opacity: 0 }, tFlip);
      FX.tween(tl, "#a6b-hgRot", { rotation: 0, svgOrigin: HG }, { rotation: 180, duration: 0.35, ease: "power2.inOut", svgOrigin: HG }, tFlip);
      // The glass is symmetric: after the half turn it is reset to 0° with the sand swapped (top full again).
      FX.set(tl, "#a6b-hgRot", { rotation: 0 }, tRun2);
      FX.set(tl, "#a6b-stream", { opacity: 1 }, tRun2);
      FX.tween(tl, "#a6b-sandTop", { scale: 1 }, { scale: 0.14, duration: tEndDrain - tRun2, ease: "none", transformOrigin: "50% 100%" }, tRun2);
      FX.tween(tl, "#a6b-sandBot", { scale: 0.3 }, { scale: 1, duration: tEndDrain - tRun2, ease: "none", transformOrigin: "50% 100%" }, tRun2);
    } else {
      FX.tween(tl, "#a6b-sandTop", { scale: 1 }, { scale: 0.14, duration: tEndDrain - C.klar, ease: "none", transformOrigin: "50% 100%" }, C.klar);
      FX.tween(tl, "#a6b-sandBot", { scale: 0.3 }, { scale: 1, duration: tEndDrain - C.klar, ease: "none", transformOrigin: "50% 100%" }, C.klar);
    }
    const tZ2 = Math.max(C.anfang, C.klar + 0.6);
    const dZ2 = Math.min(3, C.min30 - 0.05 - tZ2);
    if (dZ2 > 1) FX.slowZoom(tl, "#a6b-hg", tZ2, { d: dZ2, to: 1 + 0.08 * dZ2 / 3 });

    // ---------------------------------------------------------------- Folie 4: 30 Min. am Tag ✓
    FX.cut(tl, "#a6b-s3", "#a6b-s4", C.min30);
    FX.pop(tl, "#a6b-m30", C.min30);
    FX.pop(tl, "#a6b-mTick", Math.max(C.min30 + 0.3, C.tag - 0.05));

    // ---------------------------------------------------------------- Folie 5: Kurs-Mockup
    FX.set(tl, "#a6b-s4", { opacity: 0 }, C.kurs);
    const tc1 = Math.max(C.kurs + 0.35, C.grund - 0.05), tc2 = Math.max(tc1 + 0.4, C.strategie - 0.05), tc3 = Math.max(tc2 + 0.4, C.plan - 0.05);
    FX.course(tl, "a6b-course", C.kurs, [tc1, tc2, tc3]);
    FX.set(tl, "#a6b-course", { opacity: 0 }, C.klick);

    // ---------------------------------------------------------------- Folie 6: CTA
    FX.cta(tl, "a6b-cta", C.klick);

    // ---------------------------------------------------------------- Schlussbild
    // "... solange das erste noch fest steht." -> die Figur sitzt entspannt auf dem stabilen Hocker und nickt.
    const tEnd = Math.max(C.ende, C.klick + 1.2);
    FX.set(tl, "#a6b-cta", { opacity: 0 }, tEnd);
    FX.set(tl, "#a6b-s1", { opacity: 1 }, tEnd);
    FX.set(tl, "#a6b-world", { x: -141, y: -70 }, tEnd);
    FX.set(tl, "#a6b-floor", { attr: { x1: 281, x2: 881 } }, tEnd);
    FX.set(tl, ["#a6b-stand", "#a6b-lTrading", "#a6b-fallen"], { opacity: 0 }, tEnd);
    FX.set(tl, "#a6b-sit", { opacity: 1 }, tEnd);
    FX.set(tl, ["#a6b-armsRelax", "#a6b-faceRelax"], { opacity: 1 }, tEnd);
    FX.set(tl, ["#a6b-armsFall", "#a6b-faceFall"], { opacity: 0 }, tEnd);
    const nods = Math.max(1, Math.min(3, Math.floor((DUR - 0.5 - (tEnd + 0.3)) / 0.6)));
    FX.tween(tl, "#a6b-head", { y: 0 }, { y: 10, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: nods * 2 - 1 }, tEnd + 0.3);
    FX.more(tl, "a6b-more", tEnd);

    window.__timelines["ad6-body"] = tl;
  </script>
</template>
