    document.querySelector("#a6b-circ").setAttribute("d", FX.handCircle(200, 134, 240, 58, 7));

    // Local helpers (same look and values as FX.course / FX.cta):
    // - course without tick items: FX.course would address the missing tick ids.
    // - CTA: FX.cta's arrow bounces 2.4 s; here the number of bounces is clamped so that nothing moves
    //   in the last 0.3 s of the scene.
    function courseLocal(p, t) {
      tl.set(`#${p}`, { opacity: 0 }, 0);
      tl.set(`#${p}`, { opacity: 1 }, t);
      FX.tween(tl, `#${p}-laptop`, { opacity: 0, x: -1100 }, { opacity: 1, x: 0, duration: 0.25, ease: "power2.out" }, t);
    }
    function ctaLocal(p, t) {
      tl.set(`#${p}`, { opacity: 0 }, 0);
      tl.set(`#${p}-laptop`, { opacity: 0 }, 0);
      tl.set(`#${p}-more`, { opacity: 0 }, 0);
      tl.set(`#${p}`, { opacity: 1 }, t);
      FX.tween(tl, `#${p}-laptop`, { scale: 1.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.15, ease: "power2.out" }, t);
      FX.tween(tl, `#${p}-more`, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, t + 0.2);
      const bounces = Math.min(3, Math.floor((DUR - 0.3 - (t + 0.5)) / 0.8));
      if (bounces >= 1) FX.tween(tl, `#${p}-arrow`, { y: 0 }, { y: 14, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: bounces * 2 - 1 }, t + 0.5);
    }

    // ---------------------------------------------------------------- initial states (t = 0)
    pv("#a6b-world", { svgOrigin: "0 0", ...HOOK });
    FX.init(tl, "#a6b-floor", { attr: { x1: 250, x2: 830 } });
    pv("#a6b-restG", { svgOrigin: REST });
    pv("#a6b-tipG", { svgOrigin: TIP });
    pv("#a6b-rig", { svgOrigin: PIV });
    pv("#a6b-leg2", { svgOrigin: LEG2, opacity: 0 });
    pv("#a6b-screw", { transformOrigin: "50% 50%", opacity: 0 });
    pv("#a6b-stand", { transformOrigin: "50% 100%", opacity: 0 });
    pv("#a6b-fallen", { svgOrigin: "0 0", opacity: 0 });
    ["#a6b-lGehalt", "#a6b-lAG", "#a6b-lAZ", "#a6b-lTrading", "#a6b-lMin", "#a6b-lJob"].forEach((el) => pv(el, { transformOrigin: "50% 50%", opacity: 0 }));
    FX.init(tl, ["#a6b-saw", "#a6b-armsFall", "#a6b-faceFall"], { opacity: 0 });
    FX.init(tl, ["#a6b-s2", "#a6b-s3", "#a6b-s4"], { opacity: 0 });
    FX.init(tl, ["#a6b-yBig", "#a6b-yExp", "#a6b-yAng", "#a6b-t0", "#a6b-t1", "#a6b-t2", "#a6b-t3", "#a6b-free"], { opacity: 0 });

    // ---------------------------------------------------------------- Folie 1: Hocker
    // Anschluss an den Hook: gleicher Bildausschnitt und das gestrichelte Bein vom Hook-Ende. Das
    // gestrichelte Bein blendet aus, das Bild rückt nach rechts (Platz für die Labels), dann "Gehalt".
    const tGeh = Math.max(0.6, C.gehalt - 0.05);
    const tMove = Math.min(0.45, Math.max(0.1, tGeh - 0.6));
    FX.fadeOut(tl, "#a6b-dash", Math.max(0.05, tMove - 0.15));
    FX.tween(tl, "#a6b-world", { ...HOOK, svgOrigin: "0 0" }, { scale: 1, x: 0, y: 0, duration: 0.4, ease: "power2.inOut", svgOrigin: "0 0" }, tMove);
    FX.tween(tl, "#a6b-floor", { attr: { x1: 250, x2: 830 } }, { attr: { x1: -20, x2: 880 }, duration: 0.4, ease: "power2.inOut" }, tMove);

    // "Das erste Bein ist dein Gehalt." -> Label "Gehalt" am Bein.
    FX.pop(tl, "#a6b-lGehalt", tGeh);

    // "Das hängt an deinem einzigen Arbeitgeber ..." -> Label "1 Arbeitgeber", einkreisen.
    const tAG = Math.max(tGeh + 0.4, C.einzigen - 0.05);
    FX.pop(tl, "#a6b-lAG", tAG);
    const tCirc = Math.max(tAG + 0.25, C.arbeitgeber - 0.1);
    FX.drawCircle(tl, "#a6b-circ", tCirc);
    // "... und deiner eigenen Arbeitszeit" -> Label "Arbeitszeit" darunter.
    const tAZ = Math.max(tCirc + 0.55, C.arbeitszeit - 0.15);
    FX.pop(tl, "#a6b-lAZ", tAZ);

    // "... solange keiner dran sägt, steht der Stuhl." -> eine Säge erscheint am Bein.
    const tSaw = Math.max(tAZ + 0.4, C.saegt - 0.1);
    FX.fadeIn(tl, "#a6b-saw", tSaw);
    // "Aber wenn doch," -> die Säge sägt (hin und her, endet vor dem Kippen).
    const sawFrom = Math.max(tSaw + 0.3, C.aber);
    const strokes = 2 * Math.floor((C.kippt - 0.05 - sawFrom) / 0.5);
    if (strokes >= 2) FX.tween(tl, "#a6b-saw", { x: 0 }, { x: 30, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: strokes - 1 }, sawFrom);

    // "... dann kippt alles auf einmal." -> der Hocker kippt um 90°, die Figur fällt.
    const tTip = Math.max(C.kippt, tSaw + 0.4);
    FX.fadeOut(tl, ["#a6b-lGehalt", "#a6b-lAG", "#a6b-lAZ", "#a6b-circG", "#a6b-saw"], tTip - 0.1);
    FX.set(tl, ["#a6b-armsRelax", "#a6b-faceRelax"], { opacity: 0 }, tTip);
    FX.set(tl, ["#a6b-armsFall", "#a6b-faceFall"], { opacity: 1 }, tTip);
    FX.tip(tl, "#a6b-tipG", tTip, { from: 0, to: -90, svgOrigin: TIP });
    // Aufschlag: der liegende Hocker fällt auf seinen Fuß, die Figur plumpst daneben auf den Rücken.
    const tLand = tTip + 0.35;
    FX.tween(tl, "#a6b-restG", { rotation: 0, svgOrigin: REST }, { rotation: 22, duration: 0.15, ease: "power2.in", svgOrigin: REST }, tLand);
    FX.set(tl, "#a6b-sit", { opacity: 0 }, tLand);
    FX.tween(tl, "#a6b-fallen", { opacity: 1, x: 30, y: -40 }, { opacity: 1, x: 0, y: 0, duration: 0.15, ease: "power2.in" }, tLand);

    // "Und ein zweites Standbein heißt nicht, dass du morgen kündigst," -> die Figur steht wieder auf
    // (und stellt den Hocker wieder hin; der steht wieder nur auf einem Bein und wackelt).
    const tUp = Math.max(C.standbein - 0.05, tLand + 0.4);
    FX.set(tl, "#a6b-fallen", { opacity: 0 }, tUp);
    FX.pop(tl, "#a6b-stand", tUp, { origin: "50% 100%" });
    FX.tween(tl, "#a6b-tipG", { rotation: -90, svgOrigin: TIP }, { rotation: 0, duration: 0.35, ease: "power2.out", svgOrigin: TIP }, tUp);
    FX.tween(tl, "#a6b-restG", { rotation: 22, svgOrigin: REST }, { rotation: 0, duration: 0.35, ease: "power2.out", svgOrigin: REST }, tUp);
    // Wackeln ±6° (0,6 s pro Schwung); der letzte Schwung endet bei -6° genau, wenn das zweite Bein kommt.
    const tSettle = Math.max(C.nicht - 0.05, tUp + 0.4);
    const nSw = Math.floor((tSettle - (tUp + 0.35) - 0.3) / 0.6);
    if (nSw >= 1) {
      const s0 = nSw % 2 === 0 ? -6 : 6;
      const tw = tSettle - nSw * 0.6;
      FX.tween(tl, "#a6b-rig", { rotation: 0 }, { rotation: s0, duration: 0.3, ease: "sine.out", svgOrigin: PIV }, tw - 0.3);
      FX.tween(tl, "#a6b-rig", { rotation: s0 }, { rotation: -s0, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: nSw - 1, svgOrigin: PIV }, tw);
      FX.settle(tl, "#a6b-rig", tSettle, -6, { svgOrigin: PIV });
    }

    // "... aber es heißt, dass nicht mehr alles von einem Arbeitgeber abhängig ist." -> das zweite Bein
    // wird angeschraubt (schiebt sich rein, Schraube dreht sich), der Hocker steht stabil.
    const tLeg = tSettle + 0.05;
    FX.flyIn(tl, "#a6b-leg2", tLeg, { from: "right", dist: 560 });
    FX.pop(tl, "#a6b-screw", tLeg + 0.27);
    FX.tween(tl, "#a6b-screw", { rotation: 0 }, { rotation: 720, duration: 0.5, ease: "power1.inOut", transformOrigin: "50% 50%" }, tLeg + 0.42);

    // ---------------------------------------------------------------- Folie 2: 9 Jahre
    // "Nach über 9 Jahren Trading-Erfahrung kann ich dir sagen, als eine Person, die selber angestellt war:"
    const tYrs = Math.max(tLeg + 1.2, C.neun - 0.15);
    FX.cut(tl, "#a6b-s1", "#a6b-s2", tYrs);
    FX.pop(tl, "#a6b-yBig", tYrs);
    const tExp = Math.max(tYrs + 0.4, C.erfahrung - 0.1);
    FX.pop(tl, "#a6b-yExp", tExp);
    const tAng = Math.max(tExp + 0.6, C.angestellt - 0.1);
    FX.pop(tl, "#a6b-yAng", tAng);

    // ---------------------------------------------------------------- Folie 1 again: stabiler Hocker
    // "Es ist das Sinnvollste für die meisten Angestellten, sich ein zweites Standbein aufzubauen."
    // -> zurück zum Hocker: die Figur sitzt entspannt auf dem Hocker mit 2 Beinen (Bild mittig).
    const tSit = Math.max(tAng + 0.8, C.sinnvoll - 0.1);
    FX.cut(tl, "#a6b-s2", "#a6b-s1", tSit);
    FX.set(tl, "#a6b-world", { x: -100, y: 0 }, tSit);
    FX.set(tl, "#a6b-floor", { attr: { x1: 30, x2: 1050 } }, tSit);
    FX.set(tl, "#a6b-stand", { opacity: 0 }, tSit);
    FX.set(tl, ["#a6b-sit", "#a6b-armsRelax", "#a6b-faceRelax"], { opacity: 1 }, tSit);
    FX.set(tl, ["#a6b-armsFall", "#a6b-faceFall"], { opacity: 0 }, tSit);
    // "... für die meisten Angestellten" -> die Figur nickt zweimal.
    const tNod = Math.max(tSit + 0.3, C.meisten - 0.1);
    FX.tween(tl, "#a6b-head", { y: 0 }, { y: 10, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 3 }, tNod);
    // "... sich ein zweites Standbein aufzubauen." -> das zweite Bein pulsiert.
    const tP1 = Math.max(tSit + 0.5, C.standbein2 - 0.05);
    FX.pulse(tl, "#a6b-leg2", tP1, 0.8, { svgOrigin: LEG2 });
    // "Und Trading ist die perfekte Lösung," -> Label "Trading" am zweiten Bein.
    const tTr = Math.max(tP1 + 0.85, C.trading - 0.1);
    FX.pop(tl, "#a6b-lTrading", tTr);
    // "... neben deinem Job" -> Label "Job" am ersten Bein.
    const tJob = Math.max(tTr + 0.6, C.job - 0.15);
    FX.pop(tl, "#a6b-lJob", tJob);
    // "... mit 30 bis 60 Minuten am Tag" -> "30–60 Min. am Tag" unter "Trading".
    const tMin = Math.max(tJob + 0.35, C.minuten - 0.1);
    FX.pop(tl, "#a6b-lMin", tMin);
    // "... ein zweites Standbein mit Trading aufbauen kannst," -> das zweite Bein pulsiert noch einmal.
    const tTicks = Math.max(tMin + 1.2, C.zeit - 0.05);
    const tP2 = Math.max(tMin + 0.5, C.standbein3 - 0.05);
    if (tP2 + 0.8 <= tTicks - 0.1) FX.pulse(tl, "#a6b-leg2", tP2, 0.8, { svgOrigin: LEG2 });

    // ---------------------------------------------------------------- Folie 3: 4 Haken
    // "zeiteffizient, anfängerfreundlich, ohne Vorerfahrung und ohne Fachchinesisch."
    FX.cut(tl, "#a6b-s1", "#a6b-s3", tTicks);
    const tk = [tTicks];
    tk.push(Math.max(tk[0] + 0.3, C.anfaenger - 0.05));
    tk.push(Math.max(tk[1] + 0.3, C.vorerf - 0.05));
    tk.push(Math.max(tk[2] + 0.3, C.fach - 0.05));
    tk.forEach((t, i) => FX.pop(tl, `#a6b-t${i}`, t, { origin: "0% 50%" }));

    // ---------------------------------------------------------------- Folie 4: Kurs-Mockup
    // "Und wie das Ganze funktioniert, das zeige ich dir in meinem kostenlosen Videokurs."
    const tKurs = Math.max(tk[3] + 1.0, C.zeige - 0.1);
    FX.cut(tl, "#a6b-s3", "#a6b-s4", tKurs);
    courseLocal("a6b-course", tKurs);
    FX.pop(tl, "#a6b-free", Math.max(tKurs + 0.4, C.kostenlos - 0.1));

    // ---------------------------------------------------------------- Folie 5: CTA-Bild (bis zum Ende)
    // "Klick gerne auf den Button unter dem Video."
    const tCTA = Math.max(tKurs + 1.0, C.klick - 0.1);
    FX.set(tl, "#a6b-s4", { opacity: 0 }, tCTA);
    ctaLocal("a6b-cta", tCTA);

    window.__timelines["ad6-body"] = tl;
  </script>
</template>
