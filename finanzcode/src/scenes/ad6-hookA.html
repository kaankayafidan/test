<template>
  <style>
    #root { position: absolute; inset: 0; background: #FFFFFF; overflow: hidden; }
    #a6ha-scene { position: absolute; inset: 0; }
    #a6ha-art { position: absolute; left: 0; top: 0; width: 1080px; height: 710px; overflow: visible; }
  </style>
  <div id="root" data-composition-id="ad6-hookA" data-width="1080" data-height="710">
    <!-- One clip spans the whole scene; everything inside is animated, never the clip itself. -->
    <div id="a6ha-scene" class="clip" data-start="0" data-duration="{{DUR}}">
      <svg id="a6ha-art" viewBox="60 60 960 631">
        <line x1="250" y1="652" x2="830" y2="652" stroke="#9CA3AF" stroke-width="6" stroke-linecap="round" />
        <!-- gestricheltes zweites Bein (Andeutung), erscheint auf "und mit Trading kannst du dir ein zweites Standbein aufbauen" -->
        <g id="a6ha-leg2">
          <path d="M640 480 L712 646" fill="none" stroke="#16A34A" stroke-width="12" stroke-linecap="round" stroke-dasharray="22 16" />
          <ellipse cx="716" cy="650" rx="30" ry="7" fill="none" stroke="#16A34A" stroke-width="6" stroke-dasharray="10 8" />
        </g>
        <!-- Hocker + Figur wackeln zusammen um den Fußpunkt (540, 650) -->
        <g id="a6ha-rig">
          <ellipse cx="540" cy="650" rx="48" ry="9" fill="#7C2D12" />
          <rect x="527" y="470" width="26" height="182" rx="8" fill="#7C2D12" />
          <ellipse cx="540" cy="474" rx="124" ry="24" fill="#9A3412" />
          <ellipse cx="540" cy="462" rx="124" ry="24" fill="#EA580C" />
          <!-- Beine baumeln (Füße in der Luft, das eine Hocker-Bein bleibt darunter sichtbar wie in der Skizze) -->
          <path d="M518 448 Q492 490 485 546" fill="none" stroke="#1E293B" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M562 448 Q588 490 595 546" fill="none" stroke="#1E293B" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" />
          <ellipse cx="477" cy="556" rx="26" ry="13" fill="#111827" />
          <ellipse cx="603" cy="556" rx="26" ry="13" fill="#111827" />
          <!-- Arme (rudern) -->
          <!-- Hemd mit hochgekrempelten Ärmeln: Oberarm blau, Unterarm hautfarben (wie die Arme in der Skizze) -->
          <g id="a6ha-armL">
            <path d="M446 270 L420 214" fill="none" stroke="#F2C29B" stroke-width="24" stroke-linecap="round" />
            <path d="M498 322 L446 270" fill="none" stroke="#2563EB" stroke-width="28" stroke-linecap="round" />
            <circle cx="418" cy="206" r="16" fill="#F2C29B" />
          </g>
          <g id="a6ha-armR">
            <path d="M634 270 L660 214" fill="none" stroke="#F2C29B" stroke-width="24" stroke-linecap="round" />
            <path d="M582 322 L634 270" fill="none" stroke="#2563EB" stroke-width="28" stroke-linecap="round" />
            <circle cx="662" cy="206" r="16" fill="#F2C29B" />
          </g>
          <!-- Oberkörper (Hemd) -->
          <path d="M486 330 Q486 304 512 302 L568 302 Q594 304 594 330 L590 452 L490 452 Z" fill="#2563EB" />
          <path d="M528 302 L540 330 L552 302 Z" fill="#FFFFFF" />
          <rect x="522" y="282" width="36" height="26" rx="8" fill="#F2C29B" />
          <!-- Erleichtert (ab "zweites"): Arme entspannt, Hände auf den Oberschenkeln. Exakt die Pose und das
               Gesicht, mit denen der Body beginnt, damit der Schnitt Hook -> Body nahtlos ist. -->
          <g id="a6ha-armsRelax">
            <path d="M497 326 L483 390" fill="none" stroke="#2563EB" stroke-width="28" stroke-linecap="round" />
            <path d="M583 326 L597 390" fill="none" stroke="#2563EB" stroke-width="28" stroke-linecap="round" />
            <path d="M483 390 L503 438" fill="none" stroke="#F2C29B" stroke-width="24" stroke-linecap="round" />
            <path d="M597 390 L577 438" fill="none" stroke="#F2C29B" stroke-width="24" stroke-linecap="round" />
            <circle cx="505" cy="443" r="15" fill="#F2C29B" />
            <circle cx="575" cy="443" r="15" fill="#F2C29B" />
          </g>
          <!-- Kopf -->
          <circle cx="540" cy="240" r="54" fill="#F2C29B" />
          <path d="M488 232 Q490 180 540 180 Q594 180 594 230 Q580 206 552 204 Q520 204 500 222 Z" fill="#5B3A1E" />
          <g id="a6ha-faceNerv">
            <circle cx="521" cy="246" r="7" fill="#111827" />
            <circle cx="559" cy="246" r="7" fill="#111827" />
            <path d="M507 232 L529 224 M573 232 L551 224" stroke="#111827" stroke-width="5" stroke-linecap="round" />
          </g>
          <g id="a6ha-faceRelax">
            <circle cx="522" cy="248" r="7" fill="#111827" />
            <circle cx="558" cy="248" r="7" fill="#111827" />
            <path d="M522 268 Q540 284 558 268" fill="none" stroke="#111827" stroke-width="5" stroke-linecap="round" />
          </g>
          <!-- Mund: offen (Panik), nach dem Anhalten ein nervöser Wellenmund -->
          <ellipse id="a6ha-mouthO" cx="540" cy="274" rx="11" ry="14" fill="#7F1D1D" />
          <path id="a6ha-mouthN" d="M524 276 Q532 268 540 276 Q548 284 556 276" fill="none" stroke="#111827" stroke-width="5" stroke-linecap="round" />
          <!-- Schweißtropfen -->
          <path id="a6ha-drop" d="M606 196 Q616 214 606 222 Q596 214 606 196 Z" fill="#60A5FA" />
        </g>
      </svg>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const PIVOT = "540 650";
    const SH_L = "498 322", SH_R = "582 322";   // Schultern (Drehpunkte der Arme)

    // Initial states (t = 0). Every transformed SVG group gets its pivot here first, so GSAP never
    // switches origin on an already rotated element (smoothOrigin would add a lasting x/y offset).
    FX.init(tl, "#a6ha-rig", { svgOrigin: PIVOT, smoothOrigin: false });
    FX.init(tl, "#a6ha-armL", { svgOrigin: SH_L, smoothOrigin: false });
    FX.init(tl, "#a6ha-armR", { svgOrigin: SH_R, smoothOrigin: false });
    FX.init(tl, "#a6ha-leg2", { svgOrigin: "676 563", smoothOrigin: false, opacity: 0 });
    FX.init(tl, "#a6ha-drop", { opacity: 1, x: 0, y: 0 });
    FX.init(tl, ["#a6ha-mouthN", "#a6ha-armsRelax", "#a6ha-faceRelax"], { opacity: 0 });

    // Frame 1: der Hocker wackelt ±6° um den Fußpunkt. Die Schwünge werden so gestreckt, dass das
    // Anhalten (0,3 s) 0,15 s vor "Genau" beginnt und kurz nach dem Wort steht (~0,6 s pro Schwung).
    const tStop = Math.max(0.6, C.genau - 0.15);
    const n = Math.max(1, Math.round(tStop / 0.6));
    const sw = tStop / n;
    FX.tween(tl, "#a6ha-rig", { rotation: -6, svgOrigin: PIVOT, smoothOrigin: false },
      { rotation: 6, duration: sw, ease: "sine.inOut", yoyo: true, repeat: n - 1, svgOrigin: PIVOT, smoothOrigin: false }, 0);
    FX.settle(tl, "#a6ha-rig", tStop, n % 2 ? 6 : -6, { svgOrigin: PIVOT });

    // Die Arme rudern gegenläufig, solange es wackelt (2 Schläge pro Schwung, enden genau bei tStop) ...
    FX.tween(tl, "#a6ha-armL", { rotation: -14, svgOrigin: SH_L }, { rotation: 10, duration: sw / 2, ease: "sine.inOut", yoyo: true, repeat: 2 * n - 1, svgOrigin: SH_L }, 0);
    FX.tween(tl, "#a6ha-armR", { rotation: 10, svgOrigin: SH_R }, { rotation: -14, duration: sw / 2, ease: "sine.inOut", yoyo: true, repeat: 2 * n - 1, svgOrigin: SH_R }, 0);
    // ... und sinken beim Anhalten in eine vorsichtige Balance-Haltung (Arme seitlich ausgestreckt).
    FX.tween(tl, "#a6ha-armL", { rotation: -14, svgOrigin: SH_L }, { rotation: -40, duration: 0.3, ease: "power2.out", svgOrigin: SH_L }, tStop);
    FX.tween(tl, "#a6ha-armR", { rotation: 10, svgOrigin: SH_R }, { rotation: 40, duration: 0.3, ease: "power2.out", svgOrigin: SH_R }, tStop);
    // Der Panik-Mund wird zum nervösen Wellenmund, sobald der Hocker steht.
    FX.set(tl, "#a6ha-mouthO", { opacity: 0 }, tStop + 0.3);
    FX.set(tl, "#a6ha-mouthN", { opacity: 1 }, tStop + 0.3);

    // Ein Schweißtropfen fliegt ab dem ersten Frame vom Kopf weg (zweimal, solange es wackelt).
    [0, 1.2].filter((t) => t + 0.7 <= tStop).forEach((t) => {
      FX.tween(tl, "#a6ha-drop", { opacity: 1, x: 0, y: 0 }, { opacity: 0, x: 46, y: -26, duration: 0.7, ease: "power1.out" }, t);
    });
    tl.set("#a6ha-drop", { x: 0, y: 0, opacity: 0 }, Math.min(tStop, 1.9));

    // "... und mit Trading kannst du dir ein zweites Standbein aufbauen.": kurz ein gestricheltes zweites Bein
    // als Andeutung (ploppt zum Satzanfang auf, pulsiert einmal auf "zweites").
    // Same formula as the pop sfx "t" in ad6-hookA.cues.json.
    const tLeg = Math.max(tStop + 0.9, C.trading - 0.1);
    FX.pop(tl, "#a6ha-leg2", tLeg, { svgOrigin: "676 563" });
    const tPulse = Math.max(tLeg + 0.3, C.zweites - 0.05);
    if (tPulse + 0.8 <= DUR - 0.3) FX.pulse(tl, "#a6ha-leg2", tPulse, 0.8, { svgOrigin: "676 563" });
    // Auf "zweites": die Figur ist erleichtert (Arme runter auf die Oberschenkel, Lächeln). Das ist genau
    // das erste Bild des Bodys, so läuft der Schnitt Hook -> Body ohne Sprung in Pose oder Gesicht.
    const tRelax = Math.min(tPulse, DUR - 0.5);
    FX.set(tl, ["#a6ha-armL", "#a6ha-armR", "#a6ha-faceNerv", "#a6ha-mouthO", "#a6ha-mouthN"], { opacity: 0 }, tRelax);
    FX.set(tl, ["#a6ha-armsRelax", "#a6ha-faceRelax"], { opacity: 1 }, tRelax);

    window.__timelines["ad6-hookA"] = tl;
  </script>
</template>
