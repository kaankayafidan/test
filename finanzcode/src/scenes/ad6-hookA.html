<template>
  <style>
    #root { position: absolute; inset: 0; background: #FFFFFF; overflow: hidden; }
    #a6ha-scene { position: absolute; inset: 0; }
    #a6ha-art { position: absolute; left: 0; top: 0; width: 1080px; height: 710px; overflow: visible; }
  </style>
  <div id="root" data-composition-id="ad6-hookA" data-width="1080" data-height="710">
    <!-- One clip spans the whole scene; everything inside is animated, never the clip itself. -->
    <div id="a6ha-scene" class="clip" data-start="0" data-duration="{{DUR}}">
      <svg id="a6ha-art" viewBox="60 60 960 631">
        <line x1="250" y1="652" x2="830" y2="652" stroke="#9CA3AF" stroke-width="6" stroke-linecap="round" />
        <!-- gestricheltes zweites Bein (Andeutung), erscheint erst auf "ein zweites Bein bauen" -->
        <g id="a6ha-leg2">
          <path d="M640 480 L712 646" fill="none" stroke="#16A34A" stroke-width="12" stroke-linecap="round" stroke-dasharray="22 16" />
          <ellipse cx="716" cy="650" rx="30" ry="7" fill="none" stroke="#16A34A" stroke-width="6" stroke-dasharray="10 8" />
        </g>
        <!-- Hocker + Figur wackeln zusammen um den Fußpunkt (540, 650) -->
        <g id="a6ha-rig">
          <ellipse cx="540" cy="650" rx="48" ry="9" fill="#7C2D12" />
          <rect x="527" y="470" width="26" height="182" rx="8" fill="#7C2D12" />
          <ellipse cx="540" cy="474" rx="124" ry="24" fill="#9A3412" />
          <ellipse cx="540" cy="462" rx="124" ry="24" fill="#EA580C" />
          <!-- Beine -->
          <path d="M515 452 Q470 500 468 548 L482 612" fill="none" stroke="#1E293B" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M565 452 Q610 500 612 548 L598 612" fill="none" stroke="#1E293B" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" />
          <ellipse cx="474" cy="620" rx="26" ry="13" fill="#111827" />
          <ellipse cx="606" cy="620" rx="26" ry="13" fill="#111827" />
          <!-- Arme (rudern) -->
          <g id="a6ha-armL">
            <path d="M498 322 L446 270 L420 214" fill="none" stroke="#2563EB" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="418" cy="206" r="16" fill="#F2C29B" />
          </g>
          <g id="a6ha-armR">
            <path d="M582 322 L634 270 L660 214" fill="none" stroke="#2563EB" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="662" cy="206" r="16" fill="#F2C29B" />
          </g>
          <!-- Oberkörper (Hemd) -->
          <path d="M486 330 Q486 304 512 302 L568 302 Q594 304 594 330 L590 452 L490 452 Z" fill="#2563EB" />
          <path d="M528 302 L540 330 L552 302 Z" fill="#FFFFFF" />
          <rect x="522" y="282" width="36" height="26" rx="8" fill="#F2C29B" />
          <!-- Kopf -->
          <circle cx="540" cy="240" r="54" fill="#F2C29B" />
          <path d="M488 232 Q490 180 540 180 Q594 180 594 230 Q580 206 552 204 Q520 204 500 222 Z" fill="#5B3A1E" />
          <circle cx="521" cy="246" r="7" fill="#111827" />
          <circle cx="559" cy="246" r="7" fill="#111827" />
          <path d="M507 232 L529 224 M573 232 L551 224" stroke="#111827" stroke-width="5" stroke-linecap="round" />
          <ellipse cx="540" cy="274" rx="11" ry="14" fill="#7F1D1D" />
          <!-- Schweißtropfen -->
          <path id="a6ha-drop" d="M606 196 Q616 214 606 222 Q596 214 606 196 Z" fill="#60A5FA" />
        </g>
      </svg>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const PIVOT = "540 650";

    // Initial states (t = 0).
    FX.init(tl, "#a6ha-leg2", { opacity: 0 });
    FX.init(tl, "#a6ha-drop", { opacity: 1, x: 0, y: 0 });

    // Frame 1: der Hocker wackelt ±6° um den Fußpunkt, bis "Genau so sieht ..." – dann hält das Wackeln an.
    const w = FX.wobble(tl, "#a6ha-rig", 0, Math.max(0.6, C.genau), { svgOrigin: PIVOT });
    FX.settle(tl, "#a6ha-rig", w.end, w.endRotation, { svgOrigin: PIVOT });

    // Die Arme rudern gegenläufig, solange es wackelt (endliche Wiederholung).
    const flails = Math.max(1, Math.floor(w.end / 0.3));
    FX.tween(tl, "#a6ha-armL", { rotation: -14, svgOrigin: "498 322" }, { rotation: 10, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: flails - 1, svgOrigin: "498 322" }, 0);
    FX.tween(tl, "#a6ha-armR", { rotation: 10, svgOrigin: "582 322" }, { rotation: -14, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: flails - 1, svgOrigin: "582 322" }, 0);
    FX.tween(tl, "#a6ha-armL", { rotation: flails % 2 ? 10 : -14 }, { rotation: 0, duration: 0.3, ease: "power2.out", svgOrigin: "498 322" }, w.end);
    FX.tween(tl, "#a6ha-armR", { rotation: flails % 2 ? -14 : 10 }, { rotation: 0, duration: 0.3, ease: "power2.out", svgOrigin: "582 322" }, w.end);

    // Ein Schweißtropfen fliegt ab dem ersten Frame vom Kopf weg (zweimal).
    [0, 1.2].filter((t) => t < w.end).forEach((t) => {
      FX.tween(tl, "#a6ha-drop", { opacity: 1, x: 0, y: 0 }, { opacity: 0, x: 46, y: -26, duration: 0.7, ease: "power1.out" }, t);
    });
    tl.set("#a6ha-drop", { x: 0, y: 0, opacity: 0 }, Math.min(w.end, 1.9));

    // "... ein zweites Bein bauen": kurz ein gestricheltes zweites Bein als Andeutung.
    FX.pop(tl, "#a6ha-leg2", C.zweites, { svgOrigin: "676 563" });

    window.__timelines["ad6-hookA"] = tl;
  </script>
</template>
