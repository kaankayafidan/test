<template>

       Der Kalender am Ende ist dasselbe Markup wie in ad5-hookA / ad5-body (pixelgleicher Übergang in den Body). -->
  <style>
    #root { position: absolute; inset: 0; background: #FFFFFF; overflow: hidden; }
    #a5hb-scene { position: absolute; inset: 0; }
    #a5hb-bars { position: absolute; left: 0; top: 0; width: 1080px; height: 710px; }
    #a5hb-job { position: absolute; left: 80px; top: 140px; width: 920px; height: 160px; border-radius: 26px; background: #9CA3AF; }
    #a5hb-jobt { position: absolute; left: 48px; top: 0; height: 160px; font-family: 'Poppins'; font-weight: 700; font-size: 84px; line-height: 160px; color: #0E1A2B; white-space: nowrap; }
    #a5hb-tbar { position: absolute; left: 80px; top: 410px; width: 58px; height: 160px; border-radius: 16px; background: #16A34A; }
    #a5hb-tt { position: absolute; left: 172px; top: 410px; height: 160px; font-family: 'Poppins'; font-weight: 700; font-size: 84px; line-height: 160px; color: #0E1A2B; white-space: nowrap; }
    #a5hb-qw { position: relative; display: inline-block; }
    #a5hb-q { display: inline-block; }
    #a5hb-30 { position: absolute; left: 0; top: 0; display: inline-block; }
    /* Kalender (gleich wie Anfang A und Body) */
    #a5hb-cal { position: absolute; left: 0; top: 0; width: 1080px; height: 710px; background: #FFFFFF; }
    .a5hb-day { position: absolute; top: 0; width: 200px; height: 710px; }
    .a5hb-dl { position: absolute; left: 0; top: 14px; width: 200px; height: 60px; text-align: center; font-family: 'Poppins'; font-weight: 700; font-size: 40px; line-height: 60px; color: #0E1A2B; }
    .a5hb-card { position: absolute; left: 8px; top: 84px; width: 184px; height: 612px; border-radius: 22px; background: #F3F4F6; overflow: hidden; }
    .a5hb-b { position: absolute; left: 10px; width: 164px; }
    .a5hb-grey { top: 66px; height: 250px; border-radius: 16px; background: #9CA3AF; }
    .a5hb-ev { top: 380px; height: 80px; border-radius: 14px; }
    .a5hb-blue { background: #60A5FA; }
    .a5hb-yellow { background: #FACC15; }
  </style>
  <div id="root" data-composition-id="ad5-hookB" data-width="1080" data-height="710">
    <div id="a5hb-scene" class="clip" data-start="0" data-duration="{{DUR}}">
      <div id="a5hb-bars">
        <div id="a5hb-job"><div id="a5hb-jobt">Job: 40 h</div></div>
        <div id="a5hb-tbar"></div>
        <div id="a5hb-tt">Trading: <span id="a5hb-qw"><span id="a5hb-q">?</span><span id="a5hb-30">30 Min.</span></span></div>
      </div>
      <div id="a5hb-cal">
        <div class="a5hb-day" style="left: 40px;"><div class="a5hb-dl">Mo</div><div class="a5hb-card"><div class="a5hb-b a5hb-grey"></div><div class="a5hb-b a5hb-ev a5hb-blue"></div></div></div>
        <div class="a5hb-day" style="left: 240px;"><div class="a5hb-dl">Di</div><div class="a5hb-card"><div class="a5hb-b a5hb-grey"></div><div class="a5hb-b a5hb-ev a5hb-yellow"></div></div></div>
        <div class="a5hb-day" style="left: 440px;"><div class="a5hb-dl">Mi</div><div class="a5hb-card"><div class="a5hb-b a5hb-grey"></div><div class="a5hb-b a5hb-ev a5hb-blue"></div></div></div>
        <div class="a5hb-day" style="left: 640px;"><div class="a5hb-dl">Do</div><div class="a5hb-card"><div class="a5hb-b a5hb-grey"></div><div class="a5hb-b a5hb-ev a5hb-yellow"></div></div></div>
        <div class="a5hb-day" style="left: 840px;"><div class="a5hb-dl">Fr</div><div class="a5hb-card"><div class="a5hb-b a5hb-grey"></div><div class="a5hb-b a5hb-ev a5hb-blue"></div></div></div>
      </div>
      <!--@include cursor p="a5hb"-->
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });

    // "Gerade mal 30 Minuten am Tag …": Klick, aus dem "?" wird "30 Min." (ploppt auf).
    const t30 = Math.max(1.8, C.min30 - 0.05);
    // "… und ich zeig's dir direkt hier im Kalender.": harter Schnitt auf den vollen Kalender.
    const tCal = Math.max(t30 + 0.8, C.zeig - 0.05);

    // Frame 1: das offene "?" pulsiert (100 -> 108 %, 0,8 s pro Schlag) bis zum Klick.
    FX.init(tl, "#a5hb-q", { scale: 1, opacity: 1, transformOrigin: "50% 60%" });
    FX.pulse(tl, "#a5hb-q", 0, Math.max(0.8, t30 - 0.05), { origin: "50% 60%" });
    tl.set("#a5hb-q", { opacity: 0 }, t30);
    FX.init(tl, "#a5hb-30", { opacity: 0 });
    FX.pop(tl, "#a5hb-30", t30, { origin: "0% 55%" });

    FX.init(tl, "#a5hb-cal", { opacity: 0 });
    FX.cut(tl, "#a5hb-bars", "#a5hb-cal", tCal);

    // Cursor: ab Frame 1 kreist er knapp außerhalb um die beiden Balken (1 Runde in 1,5 s), danach ruhig:
    // eine Bewegung zum "?", Klick; nach dem Schnitt eine Bewegung in die freie Fläche unter den Blöcken
    // (= Startpunkt des Cursors im Body).
    const ORB = { cx: 540, cy: 355, rx: 505, ry: 280 };
    const a0 = (25 * Math.PI) / 180;
    const start = [ORB.cx + ORB.rx * Math.cos(a0), ORB.cy + ORB.ry * Math.sin(a0)];
    const Q = [586, 540];
    const steps = [{ t: 0, orbit: Object.assign({}, ORB, { start: a0, turns: 1 }), d: 1.5 }];
    const legQ = Math.max(0.25, Math.min(0.7, t30 - 0.05 - 1.55));
    steps.push({ t: Math.max(1.55, t30 - 0.05 - legQ - 0.4), to: Q, d: legQ });
    steps.push({ t: t30, click: true });
    steps.push({ t: tCal + 0.15, to: [620, 640], d: Math.max(0.3, Math.min(0.7, DUR - tCal - 0.6)) });
    FX.cursor(tl, "#a5hb-cur", "#a5hb-ring", start, steps);

    window.__timelines["ad5-hookB"] = tl;
  </script>
</template>
