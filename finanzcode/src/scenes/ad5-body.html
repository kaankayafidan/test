    const GE = DAYS.map(function (d) { return "#a5b-ge" + d; });
    const SIGNS = ["#a5b-sArb", "#a5b-sSp", "#a5b-sFr", "#a5b-sSa", "#a5b-sTr"];
    const PANES = ["#a5b-dt", "#a5b-chart", "#a5b-mon", "#a5b-think", "#a5b-photo", "#a5b-list", "#a5b-less", "#a5b-cw", "#a5b-free"];

    // Handgezeichnete Linien (leicht krakelig, immer gleich).
    document.getElementById("a5b-dtx").setAttribute("d", FX.handLine(196, 404, 884, 388, 7));
    document.getElementById("a5b-monx").setAttribute("d", FX.handLine(214, 566, 866, 54, 9));
    document.getElementById("a5b-bc").setAttribute("d", FX.handCircle(320, 160, 124, 28, 3));
    // Hektische Zickzack-Linie über "Daytrading" (feste Werte, kein Zufall).
    const ZZ = [0, -40, 25, -30, 40, -45, 10, -35, 30, -20, 45, -40, 15, -45, 35, -25, 40, -35, 20, -45, 30, -10, 40, -30, 25, -40, 10, -45, 35, -20, 30, -35];
    document.getElementById("a5b-zz").setAttribute("points", ZZ.map(function (v, i) { return (230 + i * 20) + "," + (210 + v); }).join(" "));

    // Cursor-Hilfen: ruhige Bewegungen, nie zwei Cursor-Tweens gleichzeitig.
    const steps = [];
    let busy = 0;
    function mv(t, to, d, ease) { t = Math.max(t, busy + 0.02); steps.push({ t: t, to: to, d: d, ease: ease || "power2.inOut" }); busy = t + d; return busy; }
    function arrive(tAt, to, dMax, dMin) { const d = Math.max(dMin || 0.3, Math.min(dMax, tAt - busy - 0.05)); return mv(tAt - d, to, d); }
    function click(t) { steps.push({ t: t, click: true }); }
    function hide(t) { steps.push({ t: t, hide: true }); }
    function show(t, at) { steps.push({ t: t, show: true, at: at }); busy = Math.max(busy, t); }
    // Bildwechsel: harter Schnitt vom alten auf das neue Bild.
    function cutTo(from, to, t) { if (from) tl.set(from, { opacity: 0 }, t); if (to) tl.set(to, { opacity: 1 }, t); }

    // ---------------------------------------------------------------- Anfangszustand (t = 0)
    const ZO = "140px 322px";                       // Zoom-Pivot: Montag
    FX.init(tl, GM.concat(GE), { opacity: 0 });
    FX.init(tl, SIGNS, { opacity: 0 });
    FX.init(tl, "#a5b-zoom", { scale: 1, x: 0, y: 0, transformOrigin: ZO, opacity: 1 });
    FX.init(tl, PANES, { opacity: 0 });
    FX.init(tl, ["#a5b-dtw", "#a5b-band", "#a5b-entry", "#a5b-exit", "#a5b-c0", "#a5b-c1", "#a5b-c2", "#a5b-8h", "#a5b-bub", "#a5b-dots", "#a5b-clock", "#a5b-r0", "#a5b-r1", "#a5b-fe", "#a5b-lw", "#a5b-lz", "#a5b-lk"], { opacity: 0 });
    FX.init(tl, ["#a5b-dtx", "#a5b-monx", "#a5b-strk", "#a5b-bc"], { opacity: 0 });
    FX.init(tl, "#a5b-line", { strokeDashoffset: 1.1 });
    FX.init(tl, "#a5b-photoz", { scale: 1, transformOrigin: "500px 290px" });
    FX.init(tl, "#a5b-fe", { opacity: 0, rotation: -8, transformOrigin: "50% 50%" });
    FX.init(tl, "#a5b-free", { opacity: 0, rotation: -4, transformOrigin: "50% 50%" });
    FX.init(tl, "#a5b-cw", { scale: 1, transformOrigin: "540px 330px" });
    FX.init(tl, "#a5b-mh", { rotation: 0, svgOrigin: "560 318", smoothOrigin: false });
    FX.init(tl, "#a5b-hh", { rotation: 0, svgOrigin: "560 318", smoothOrigin: false });

    // ---------------------------------------------------------------- Woche mit 40-Stunden-Job
    // "… eine ganz normale Woche mit einem 40-Stunden-Job." -> Cursor zum Montag, Klick: Schild "Arbeit".
    const ARB = [212, 330];
    const tArb = Math.max(0.9, C.job - 0.05);
    arrive(tArb - 0.03, ARB, 1.0);
    click(tArb);
    FX.pop(tl, "#a5b-sArb", tArb);
    // "Montag bis Freitag wird von 8 bis 17 Uhr gearbeitet." -> der Cursor fährt über die grauen Blöcke bis Freitag.
    const tSw = Math.max(tArb + 0.45, C.montag);
    const dSw = Math.max(0.6, Math.min(1.8, C.abends - 0.7 - tSw));
    mv(tSw, [950, 330], dSw, "sine.inOut");

    // "Abends ist mal Sport oder Freunde." -> Cursor über Blau und Gelb, Schilder "Sport" und "Freunde".
    const SP = [202, 532], FR = [432, 532];
    const tSp = Math.max(busy + 0.5, C.sport - 0.05);
    const t0Ev = Math.max(busy + 0.02, Math.min(C.abends - 0.15, tSp - 0.75));
    const dEv = tSp - 0.03 - t0Ev;
    mv(t0Ev, [950, 532], dEv * 0.3, "power1.in");
    mv(t0Ev + dEv * 0.3, SP, dEv * 0.7, "power2.out");
    click(tSp);
    FX.pop(tl, "#a5b-sSp", tSp);
    const tFr = Math.max(tSp + 0.4, C.freunde - 0.05);
    arrive(tFr - 0.03, FR, 0.5);
    click(tFr);
    FX.pop(tl, "#a5b-sFr", tFr);

    // "Das Wochenende bleibt frei, …" -> kleines Schild "Sa + So frei" (unten rechts, nach dem Freitag).
    const SA = [1016, 650];
    const tSa = Math.max(tFr + 0.6, C.wochenende - 0.05);
    arrive(tSa - 0.03, SA, 0.7);
    click(tSa);
    FX.pop(tl, "#a5b-sSa", tSa);

    // ---------------------------------------------------------------- Trading-Blöcke
    // "… und jetzt schau mal hier:" -> Cursor zeigt auf die Lücke vor der Arbeit (Montag früh).
    const MORN = [206, 128], EVE = [206, 440];
    const tSchau = Math.max(tSa + 0.5, C.schau);
    mv(tSchau, MORN, Math.max(0.5, Math.min(0.85, C.morgens - 0.15 - tSchau)));
    // "morgens 15 Minuten vor der Arbeit" -> Klick, an jedem Tag ploppt direkt vor dem grauen Block ein grüner Block rein.
    const tMorn = Math.max(busy + 0.05, C.morgens - 0.05);
    click(tMorn);
    GM.forEach(function (el, i) { FX.pop(tl, el, tMorn + i * 0.08); });
    // am Montag das Schild "Trading · 15 Min" (auf "15 Minuten")
    const tTr = Math.max(tMorn + 0.45, C.m15 - 0.05);
    FX.pop(tl, "#a5b-sTr", tTr, { origin: "10% 0%" });
    // "… und abends 15 Minuten nach Feierabend." -> Klick, direkt nach dem grauen Block ploppt der zweite grüne Block rein.
    // Der Cursor fährt gleich nach dem Klick in die Lücke nach der Arbeit weiter (so verdeckt er das Schild nicht).
    const tEve = Math.max(tTr + 0.6, C.abends2 - 0.05);
    mv(tMorn + 0.1, EVE, Math.max(0.4, Math.min(0.5, tEve - tMorn - 0.3)));
    click(tEve);
    GE.forEach(function (el, i) { FX.pop(tl, el, tEve + i * 0.08); });

    // Auf einen Tag zoomen (Montag, 150 % in 0,5 s, weich): Montag rückt in die Mitte, "Mo" bleibt lesbar,
    // die anderen Tage und die Schilder, die nicht mehr ins Bild passen, blenden aus. "Mehr ist es nicht." -> der Zoom hält.
    const ZX = 400, ZY = 152, ZS = 1.5;
    const tZoom = Math.max(tEve + 0.6, C.mehr - 0.55);
    FX.zoomIn(tl, "#a5b-zoom", tZoom, { origin: ZO, to: ZS, x: ZX, y: ZY });
    ["#a5b-d1", "#a5b-d2", "#a5b-d3", "#a5b-d4", "#a5b-sFr", "#a5b-sSa", "#a5b-sSp"].forEach(function (el) {
      FX.tween(tl, el, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "none" }, tZoom);
    });
    const Z = function (p) { return [140 + ZS * (p[0] - 140) + ZX, 322 + ZS * (p[1] - 322) + ZY]; };
    mv(tZoom, Z(EVE), 0.5);
    // "Und das funktioniert, …" -> eine ruhige Bewegung vom Abend- zum Morgen-Block.
    const tFk = Math.max(busy + 0.3, C.funkt);
    mv(tFk, Z(MORN), 0.6);

    // ---------------------------------------------------------------- "… weil ich eben kein Daytrading mache, …"
    // Schnitt: hektische Zickzack-Linie + "Daytrading" ploppt; auf "mache" rot durchgestrichen.
    const tDt = Math.max(busy + 0.3, C.kein - 0.05);
    hide(tDt);
    cutTo("#a5b-zoom", "#a5b-dt", tDt);
    FX.pop(tl, "#a5b-dtw", tDt);
    const tDtX = Math.max(tDt + 0.4, C.mache - 0.05);
    FX.drawLine(tl, "#a5b-dtx", tDtX);

    // ---------------------------------------------------------------- "… sondern wirklich ruhige Swing-Trades, die ich einfach laufen lasse, …"
    // Schnitt auf den schlichten Chart, die Kurslinie zeichnet sich ruhig (1 s).
    const tChart = Math.max(tDtX + 0.5, C.ruhige - 0.05);
    cutTo("#a5b-dt", "#a5b-chart", tChart);
    FX.tween(tl, "#a5b-line", { strokeDashoffset: 1.1 }, { strokeDashoffset: 0, duration: 1.0, ease: "power1.inOut", autoRound: false }, tChart);
    show(tChart, [620, 650]);
    // "Swing-Trades" -> der Trade erscheint (Einstieg, Ziel- und Stop-Zone).
    const tSet = Math.max(tChart + 0.6, C.swing - 0.05);
    FX.fadeIn(tl, "#a5b-band", tSet);
    FX.pop(tl, "#a5b-entry", tSet, { svgOrigin: "190 450" });
    arrive(tSet - 0.03, [196, 492], 0.6);
    // "laufen lasse" -> der Cursor fährt den Trade entlang, die Tage ploppen nacheinander auf, am Ende das Ziel.
    const tRun = Math.max(tSet + 0.5, C.laufen - 0.05);
    const dRun = Math.max(0.6, Math.min(1.0, C.acht - 0.35 - tRun));
    mv(tRun, [905, 492], dRun, "sine.inOut");
    ["#a5b-c0", "#a5b-c1", "#a5b-c2"].forEach(function (el, i) { FX.pop(tl, el, tRun + i * dRun * 0.45); });
    FX.pop(tl, "#a5b-exit", tRun + dRun, { svgOrigin: "905 190" });

    // ---------------------------------------------------------------- "… wo ich nicht 8 Stunden am Tag vor dem Bildschirm sitzen muss."
    // Schnitt: Bildschirm, "8 h" ploppt; auf "Bildschirm" rot durchgestrichen.
    const tMon = Math.max(tRun + dRun + 0.3, C.acht - 0.05);
    hide(tMon);
    cutTo("#a5b-chart", "#a5b-mon", tMon);
    FX.pop(tl, "#a5b-8h", tMon);
    const tMonX = Math.max(tMon + 0.5, C.bildschirm - 0.05);
    FX.drawLine(tl, "#a5b-monx", tMonX);

    // ---------------------------------------------------------------- "Die meisten Trader denken, sie müssen so viel Zeit investieren, …"
    // Schnitt: Denkblase mit drei Punkten; auf "so viel Zeit" ploppt eine Uhr hinein, ihre Zeiger rasen (2 Runden).
    const tTh = Math.max(tMonX + 0.5, C.meisten - 0.05);
    cutTo("#a5b-mon", "#a5b-think", tTh);
    FX.pop(tl, "#a5b-bub", tTh, { svgOrigin: "560 330" });
    FX.pop(tl, "#a5b-dots", tTh + 0.12, { svgOrigin: "560 320" });
    const tClk = Math.max(tTh + 0.6, C.zeit - 0.05);
    tl.set("#a5b-dots", { opacity: 0 }, tClk);
    FX.pop(tl, "#a5b-clock", tClk, { svgOrigin: "560 318" });
    const dSpin = Math.max(0.6, Math.min(1.2, C.verbringen - 0.3 - (tClk + 0.2)));
    FX.tween(tl, "#a5b-mh", { rotation: 0, svgOrigin: "560 318", smoothOrigin: false }, { rotation: 720, svgOrigin: "560 318", smoothOrigin: false, duration: dSpin, ease: "power1.inOut" }, tClk + 0.2);
    FX.tween(tl, "#a5b-hh", { rotation: 0, svgOrigin: "560 318", smoothOrigin: false }, { rotation: 60, svgOrigin: "560 318", smoothOrigin: false, duration: dSpin, ease: "power1.inOut" }, tClk + 0.2);

    // ---------------------------------------------------------------- "… verbringen 8 Stunden am Tag … neben der Arbeit am Bildschirm, und das ist genau der Fehler."
    // Schnitt auf das Foto (Platzhalter): gähnende Person vor vielen Bildschirmen, langsamer Zoom (3 s);
    // auf "Fehler" rot durchgestrichen. "Du tradest aus Langeweile" -> Strich weg, reinzoomen auf das Gähnen.
    const tPh = Math.max(tClk + 0.2 + dSpin + 0.1, C.verbringen - 0.05);
    cutTo("#a5b-think", "#a5b-photo", tPh);
    const tStrk = Math.max(tPh + 0.8, C.fehler - 0.05);
    FX.drawLine(tl, "#a5b-strk", tStrk);
    const tFace = Math.max(tStrk + 0.6, C.langeweile - 0.1);
    const dSlow = Math.max(0.5, Math.min(3, tFace - tPh - 0.1));
    const sSlow = 1 + 0.08 * dSlow / 3;
    FX.slowZoom(tl, "#a5b-photoz", tPh, { origin: "500px 290px", to: sSlow, d: dSlow });
    FX.fadeOut(tl, "#a5b-strk", tFace);
    FX.zoomIn(tl, "#a5b-photoz", tFace, { origin: "500px 290px", from: sSlow, to: 1.5 });

    // ---------------------------------------------------------------- "… du hast keine richtige Strategie, keine Disziplin, und schon passieren die ersten Fehler."
    // Schnitt: Karte, "✗ Strategie" ploppt; "✗ Disziplin" ploppt; auf "Fehler" knallt der rote Stempel "FEHLER" drauf (8° schräg).
    const tLi = Math.max(tFace + 0.6, C.strategie - 0.05);
    cutTo(["#a5b-photo", "#a5b-strk"], "#a5b-list", tLi);
    FX.pop(tl, "#a5b-r0", tLi, { origin: "0% 50%" });
    const tDi = Math.max(tLi + 0.5, C.disziplin - 0.05);
    FX.pop(tl, "#a5b-r1", tDi, { origin: "0% 50%" });
    const tFe = Math.max(tDi + 0.6, C.fehler2 - 0.05);
    FX.slam(tl, "#a5b-fe", tFe, { rotation: -8 });

    // ---------------------------------------------------------------- "… wirklich auch weniger anfangs zu investieren, Zeit als auch Kapital."
    // Schnitt: "weniger" ploppt; dann die Karten "Zeit" und "Kapital", je mit grünem Pfeil nach unten.
    const tLe = Math.max(tFe + 0.8, C.weniger - 0.05);
    cutTo("#a5b-list", "#a5b-less", tLe);
    FX.pop(tl, "#a5b-lw", tLe);
    const tZe = Math.max(tLe + 0.4, C.zeit2 - 0.05);
    FX.pop(tl, "#a5b-lz", tZe);
    const tKa = Math.max(tZe + 0.3, C.kapital - 0.05);
    FX.pop(tl, "#a5b-lk", tKa);

    // ---------------------------------------------------------------- Kurs-Mockup: "Und wenn du wissen möchtest, … einen kostenfreien Videokurs."
    // Der Laptop schiebt sich rein (0,25 s). Auf "kostenfreien" zeigt der Cursor auf "Kostenloser Videokurs", rot eingekreist.
    const tCo = Math.max(tKa + 0.6, C.wissen - 0.05);
    cutTo("#a5b-less", ["#a5b-cw", "#a5b-course"], tCo);
    FX.tween(tl, "#a5b-course-laptop", { opacity: 0, x: -1100 }, { opacity: 1, x: 0, duration: 0.25, ease: "power2.out" }, tCo);
    show(tCo + 0.3, [880, 650]);
    const tKu = Math.max(tCo + 1.0, C.kurs - 0.05);
    arrive(tKu - 0.03, [462, 142], 0.7);
    FX.drawCircle(tl, "#a5b-bc", tKu);
    // "Ich könnte dafür locker … verlangen, aber du bekommst den komplett umsonst." -> kein Betrag im Bild:
    // langsamer Zoom auf den Laptop, dann Klick: "Kostenlos" ploppt auf.
    const tCTA = Math.max(C.klick - 0.05, tKu + 1.6);
    const tZc = Math.max(tKu + 0.6, C.koennte - 0.05);
    FX.slowZoom(tl, "#a5b-cw", tZc, { origin: "540px 330px", d: Math.max(0.5, Math.min(3, tCTA - tZc - 0.05)) });
    const tFree = Math.max(tZc + 0.5, Math.min(C.bekommst - 0.05, tCTA - 0.5));
    arrive(tFree - 0.03, [724, 642], 0.7);
    click(tFree);
    FX.pop(tl, "#a5b-free", tFree);

    // ---------------------------------------------------------------- CTA-Bild: "Klick einfach unter dem Video auf den Link."
    // CTA-Bild ("Mehr dazu" + Pfeil) bis zum Ende. Lokale Variante von FX.cta: der Pfeil wippt nur so oft,
    // dass er vor DUR - 0,35 s ruhig steht (in den letzten 0,3 s bewegt sich nichts).
    cutTo(["#a5b-cw", "#a5b-free"], null, tCTA);
    hide(tCTA);
    (function cta(p, t, endBy) {
      tl.set("#" + p, { opacity: 0 }, 0);
      tl.set("#" + p + "-laptop", { opacity: 0 }, 0);
      tl.set("#" + p + "-more", { opacity: 0 }, 0);
      tl.set("#" + p, { opacity: 1 }, t);
      FX.tween(tl, "#" + p + "-laptop", { scale: 1.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.15, ease: "power2.out" }, t);
      FX.tween(tl, "#" + p + "-more", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, t + 0.2);
      const legs = 2 * Math.floor((endBy - (t + 0.5)) / 0.8);
      if (legs >= 2) FX.tween(tl, "#" + p + "-arrow", { y: 0 }, { y: 14, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: Math.min(6, legs) - 1 }, t + 0.5);
    })("a5b-cta", tCTA, DUR - 0.35);

    FX.cursor(tl, "#a5b-cur", "#a5b-ring", [1000, 640], steps);
    window.__timelines["ad5-body"] = tl;
  </script>
</template>
