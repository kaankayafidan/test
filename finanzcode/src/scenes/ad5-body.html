  <script>
    const tl = gsap.timeline({ paused: true });
    const DAYS = [0, 1, 2, 3, 4];
    const GM = DAYS.map(function (d) { return "#a5b-gm" + d; });
    const GE = DAYS.map(function (d) { return "#a5b-ge" + d; });
    const SIGNS = ["#a5b-sArb", "#a5b-sSp", "#a5b-sFr", "#a5b-sSa", "#a5b-sTr", "#a5b-sMo"];
    const ZO = "140px 322px";                       // Zoom auf Montag: Pivot = Montag-Mitte

    // Cursor-Hilfen: ruhige Bewegungen, nie zwei Cursor-Tweens gleichzeitig.
    const steps = [];
    let busy = 0;
    function mv(t, to, d, ease) { t = Math.max(t, busy + 0.02); steps.push({ t: t, to: to, d: d, ease: ease || "power2.inOut" }); busy = t + d; return busy; }
    function arrive(tAt, to, dMax, dMin) { const d = Math.max(dMin || 0.3, Math.min(dMax, tAt - busy - 0.05)); return mv(tAt - d, to, d); }
    function click(t) { steps.push({ t: t, click: true }); }

    // ---------------------------------------------------------------- Anfangszustand (t = 0)
    FX.init(tl, GM.concat(GE), { opacity: 0 });
    FX.init(tl, SIGNS, { opacity: 0 });
    FX.init(tl, "#a5b-zoom", { scale: 1, x: 0, y: 0, transformOrigin: ZO, opacity: 1 });
    FX.init(tl, ["#a5b-chart", "#a5b-phone", "#a5b-photo", "#a5b-plan", "#a5b-course"], { opacity: 0 });
    FX.init(tl, "#a5b-phone", { y: 780 });
    FX.init(tl, ["#a5b-band", "#a5b-entry", "#a5b-exit", "#a5b-brk", "#a5b-3t", "#a5b-c0", "#a5b-c1", "#a5b-c2", "#a5b-push", "#a5b-pc1"], { opacity: 0 });
    FX.init(tl, "#a5b-line", { strokeDashoffset: 1.1 });
    FX.init(tl, "#a5b-strk", { opacity: 0 });
    FX.init(tl, "#a5b-photoz", { scale: 1, transformOrigin: "500px 290px" });

    // ---------------------------------------------------------------- Woche mit 40-Stunden-Job
    // "Das ist eine ganz normale Woche mit 40-Stunden-Job …" -> Cursor zum Montag, Klick: Schild "Arbeit".
    const ARB = [212, 330];
    const tArb = Math.max(0.9, C.job - 0.05);
    arrive(tArb - 0.03, ARB, 1.0);
    click(tArb);
    FX.pop(tl, "#a5b-sArb", tArb);
    // "… Montag bis Freitag wird … gearbeitet" -> der Cursor fährt über die grauen Blöcke bis Freitag.
    const tSw = Math.max(tArb + 0.45, C.montag);
    const dSw = Math.max(0.6, Math.min(1.8, C.abends - 0.7 - tSw));
    mv(tSw, [950, 330], dSw, "sine.inOut");

    // "… abends ist mal Sport oder Freunde …" -> Cursor über Blau und Gelb, Schilder "Sport" und "Freunde".
    const SP = [202, 532], FR = [432, 532];
    // Weg: vom Freitag nach unten in die Abend-Reihe und über Blau und Gelb nach links bis Montag.
    const tSp = Math.max(busy + 0.5, C.sport - 0.05);
    const t0Ev = Math.max(busy + 0.02, Math.min(C.abends - 0.15, tSp - 0.75));
    const dEv = tSp - 0.03 - t0Ev;
    mv(t0Ev, [950, 532], dEv * 0.3, "power1.in");
    mv(t0Ev + dEv * 0.3, SP, dEv * 0.7, "power2.out");
    click(tSp);
    FX.pop(tl, "#a5b-sSp", tSp);
    const tFr = Math.max(tSp + 0.4, C.freunde - 0.05);
    arrive(tFr - 0.03, FR, 0.5);
    click(tFr);
    FX.pop(tl, "#a5b-sFr", tFr);

    // "… und das Wochenende bleibt frei." -> kleines Schild "Sa + So frei" (unten rechts, nach dem Freitag).
    const SA = [1016, 650];
    const tSa = Math.max(tFr + 0.6, C.wochenende - 0.05);
    arrive(tSa - 0.03, SA, 0.7);
    click(tSa);
    FX.pop(tl, "#a5b-sSa", tSa);

    // ---------------------------------------------------------------- Trading-Blöcke
    // "Und jetzt schau mal hier:" -> Cursor zeigt auf die Lücke vor der Arbeit (Montag früh).
    const MORN = [206, 128], EVE = [206, 440];
    const tSchau = Math.max(tSa + 0.5, C.schau);
    mv(tSchau, MORN, Math.max(0.5, Math.min(0.85, C.morgens - 0.15 - tSchau)));
    // "morgens 15 Minuten vor der Arbeit" -> Klick, an jedem Tag ploppt direkt vor dem grauen Block ein grüner Block rein.
    const tMorn = Math.max(busy + 0.05, C.morgens - 0.05);
    click(tMorn);
    GM.forEach(function (el, i) { FX.pop(tl, el, tMorn + i * 0.08); });
    // am Montag das Schild "Trading · 15 Min" (auf "15 Minuten")
    const tTr = Math.max(tMorn + 0.3, C.m15 - 0.05);
    FX.pop(tl, "#a5b-sTr", tTr, { origin: "10% 0%" });
    // "… und abends 15 Minuten nach Feierabend" -> Klick, direkt nach dem grauen Block ploppt der zweite grüne Block rein.
    const tEve = Math.max(tTr + 0.6, C.abends2 - 0.05);
    mv(tTr - 0.05, EVE, Math.max(0.4, Math.min(0.6, tEve - tTr - 0.1)));
    click(tEve);
    GE.forEach(function (el, i) { FX.pop(tl, el, tEve + i * 0.08); });

    // Auf einen Tag zoomen (Montag, 150 % in 0,5 s, weich); die anderen Tage treten zurück.
    // "… mehr ist es nicht." -> der Zoom hält.
    const tZoom = Math.max(tEve + 0.5, C.mehr - 0.6);
    FX.zoomIn(tl, "#a5b-zoom", tZoom, { origin: ZO, to: 1.5, x: 100, y: 33 });
    ["#a5b-d1", "#a5b-d2"].forEach(function (el) {
      FX.tween(tl, el, { opacity: 1 }, { opacity: 0.3, duration: 0.4, ease: "none" }, tZoom);
    });
    ["#a5b-d3", "#a5b-d4", "#a5b-sFr", "#a5b-sSa"].forEach(function (el) {
      FX.tween(tl, el, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "none" }, tZoom);
    });
    const Z = function (p) { return [140 + 1.5 * (p[0] - 140) + 100, 322 + 1.5 * (p[1] - 322) + 33]; };
    mv(tZoom, Z(EVE), 0.5);
    // "Das klappt, weil ich kein Daytrading mache …" -> eine ruhige Bewegung vom Abend- zum Morgen-Block.
    const tKl = Math.max(busy + 0.6, C.klappt);
    mv(tKl, Z(MORN), 0.7);

    // ---------------------------------------------------------------- Chart: ein Trade über 3 Tage
    // "… ruhige Swing-Trades auf höheren Zeiteinheiten." -> Schnitt auf den schlichten Chart, die Kurslinie zeichnet sich.
    const tChart = Math.max(tZoom + 1.2, C.swing - 0.05);
    tl.set("#a5b-zoom", { opacity: 0 }, tChart);
    tl.set("#a5b-chart", { opacity: 1 }, tChart);
    FX.tween(tl, "#a5b-line", { strokeDashoffset: 1.1 }, { strokeDashoffset: 0, duration: 0.7, ease: "power1.inOut", autoRound: false }, tChart);
    // "Die laufen oft mehrere Tage …" -> der Trade (Einstieg bis Ziel) erscheint, die Tage werden markiert.
    const tBand = Math.max(tChart + 0.85, C.laufen - 0.05);
    FX.fadeIn(tl, "#a5b-band", tBand);
    FX.pop(tl, "#a5b-entry", tBand, { svgOrigin: "190 450" });
    FX.pop(tl, "#a5b-exit", tBand + 0.12, { svgOrigin: "905 190" });
    ["#a5b-c0", "#a5b-c1", "#a5b-c2"].forEach(function (el, i) { FX.pop(tl, el, tBand + 0.2 + i * 0.12); });
    const t3T = Math.max(tBand + 0.6, C.tage - 0.05);
    FX.pop(tl, "#a5b-brk", t3T, { svgOrigin: "547 97" });
    FX.pop(tl, "#a5b-3t", t3T);
    // Cursor fährt den Trade entlang (Einstieg Mo -> Ziel Mi).
    arrive(tBand - 0.02, [196, 492], 0.6);
    mv(tBand + 0.05, [905, 492], Math.max(0.6, Math.min(1.2, t3T - tBand)), "sine.inOut");

    // ---------------------------------------------------------------- Push-Nachricht
    // "… ein Indikator schickt mir eine Push-Nachricht …" -> Handy-Mockup schiebt sich von unten rein (0,25 s),
    // der Chart tritt zurück; die Nachricht ploppt auf "Push-Nachricht" auf.
    const tPh = Math.max(t3T + 0.4, C.indikator - 0.05);
    tl.set("#a5b-phone", { opacity: 1 }, tPh);
    FX.tween(tl, "#a5b-phone", { y: 780 }, { y: 0, duration: 0.25, ease: "power2.out" }, tPh);
    FX.tween(tl, "#a5b-chart", { opacity: 1 }, { opacity: 0.15, duration: 0.25, ease: "none" }, tPh);
    FX.fadeOut(tl, ["#a5b-brk", "#a5b-3t", "#a5b-c0", "#a5b-c1", "#a5b-c2"], tPh, 0.15);
    const tPush = Math.max(tPh + 0.4, C.push - 0.05);
    FX.pop(tl, "#a5b-push", tPush, { origin: "50% 0%" });

    // ---------------------------------------------------------------- Den ganzen Tag vor dem Chart
    // Schnitt auf das Foto (Platzhalter): gähnende Person vor vielen Bildschirmen, langsamer Zoom;
    // "… nicht nur stressig …" -> rot durchgestrichen; "… aus Langeweile …" -> reinzoomen auf das Gähnen.
    const tPhoto = Math.max(tPush + 1.0, C.ganzen - 0.05);
    tl.set(["#a5b-chart", "#a5b-phone"], { opacity: 0 }, tPhoto);
    tl.set("#a5b-photo", { opacity: 1 }, tPhoto);
    const tStrk = Math.max(tPhoto + 0.8, C.stressig - 0.1);
    FX.drawLine(tl, "#a5b-strk", tStrk);
    const tFace = Math.max(tStrk + 1.0, C.langeweile - 0.1);
    const dSlow = Math.max(0.5, Math.min(3, tFace - tPhoto - 0.1));
    const sSlow = 1 + 0.08 * dSlow / 3;
    FX.slowZoom(tl, "#a5b-photoz", tPhoto, { origin: "500px 290px", to: sSlow, d: dSlow });
    FX.zoomIn(tl, "#a5b-photoz", tFace, { origin: "500px 290px", from: sSlow, to: 1.5 });

    // ---------------------------------------------------------------- "Plan ✓"
    // "… weder ein großes Startkapital noch Vorwissen …" -> Schnitt: "Plan" mit leerem Kreis;
    // "… sondern einen klaren Plan." -> der grüne Haken ploppt in den Kreis.
    const tPlan = Math.max(tFace + 0.8, C.weder - 0.05);
    tl.set(["#a5b-photo", "#a5b-strk"], { opacity: 0 }, tPlan);
    tl.set("#a5b-plan", { opacity: 1 }, tPlan);
    const tChk = Math.max(tPlan + 0.6, C.plan - 0.05);
    FX.pop(tl, "#a5b-pc1", tChk);

    // ---------------------------------------------------------------- Kurs-Mockup (ohne Punkte) und CTA
    // "Genau den Plan für deine ersten 60 Tage …" -> der Laptop schiebt sich rein (0,25 s).
    const tCourse = Math.max(tChk + 0.45, C.genau - 0.05);
    tl.set("#a5b-plan", { opacity: 0 }, tCourse);
    tl.set("#a5b-course", { opacity: 1 }, tCourse);
    FX.tween(tl, "#a5b-course-laptop", { opacity: 0, x: -1100 }, { opacity: 1, x: 0, duration: 0.25, ease: "power2.out" }, tCourse);
    // "… in meinem kostenlosen Videokurs" -> Cursor zeigt auf "Kostenloser Videokurs".
    const tKurs = Math.max(tCourse + 0.6, C.kurs - 0.3);
    mv(tKurs, [426, 166], 0.6);
    // "Klick unter dem Video auf „Mehr dazu“ …" -> CTA-Bild.
    const tCTA = Math.max(C.klick - 0.05, tCourse + 1.2, busy + 0.1);
    tl.set("#a5b-course", { opacity: 0 }, tCTA);
    FX.cta(tl, "a5b-cta", tCTA);
    steps.push({ t: tCTA, hide: true });

    // ---------------------------------------------------------------- Schlussbild
    // "… trag dir die ersten 15 Minuten gleich für morgen früh in den Kalender ein." -> zurück zum Kalender
    // (ganz, ohne die alten Schilder), der erste grüne Morgen-Block blinkt, Schild "Morgen 7:30". Banner "Mehr dazu ↓" bleibt.
    const tEnd = Math.max(C.trag - 0.05, tCTA + 1.2);
    tl.set("#a5b-cta", { opacity: 0 }, tEnd);
    tl.set("#a5b-zoom", { scale: 1, x: 0, y: 0, transformOrigin: ZO, opacity: 1 }, tEnd);
    tl.set(["#a5b-d1", "#a5b-d2", "#a5b-d3", "#a5b-d4"], { opacity: 1 }, tEnd);
    tl.set(["#a5b-sArb", "#a5b-sSp", "#a5b-sFr", "#a5b-sSa", "#a5b-sTr"], { opacity: 0 }, tEnd);
    FX.more(tl, "a5b-more", tEnd + 0.15);
    const tBlink = tEnd + 0.3;
    FX.blink(tl, "#a5b-gm0", tBlink, Math.max(0.8, DUR - 0.35 - tBlink));
    steps.push({ t: tEnd, show: true, at: [620, 520] });
    busy = tEnd;
    const tMo = Math.max(tEnd + 0.7, C.morgen - 0.05);
    arrive(tMo - 0.03, MORN, 0.7);
    click(tMo);
    FX.pop(tl, "#a5b-sMo", tMo, { origin: "10% 0%" });
    mv(tMo + 0.25, [452, 300], Math.max(0.3, Math.min(0.6, DUR - 0.4 - (tMo + 0.25))));

    FX.cursor(tl, "#a5b-cur", "#a5b-ring", [620, 640], steps);
    window.__timelines["ad5-body"] = tl;
  </script>
</template>
