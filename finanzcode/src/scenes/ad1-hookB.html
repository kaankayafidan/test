      <!-- roter Kreis, der sich in 0,5 s um die Null zieht (Bildschirm-Koordinaten) -->

  <script>
    const tl = gsap.timeline({ paused: true });
    const O = { svgOrigin: "0 0" };
    const K = 0.9375;                 // Grundgröße des Kessels (Radius 300 px bei Zoom 1)
    const CX = 540, CY = 355;
    const S0 = 5.2 / K;               // Close-up: 5,2-fach, zeigt 3 · 26 · 0 · 32 · 15
    const ZY = -210;                  // Mitte des Kreises um die Null (lokal)
    const Y0 = (285 - CY) / K - S0 * ZY; // Null-Tasche sitzt bei y = 285 px
    const toScreen = (x, y, s, oy) => [CX + K * (s * x), CY + K * (oy + s * y)];
    // Übergabe an den Body (identische Pixel): Kessel mittig, Radius 275 px (Zoom 0,86 / K), steht mit der Null oben, keine Kugel.
    const zEnd = 0.86 / K;
    const tEnd = DUR - 0.05;

    // Frame 1: Close-up. Danach weicher Push-in (Tempo wie "langsamer Zoom", die Null bleibt stehen) bis zum Rauszoomen.
    const tZ = Math.max(0.9, C.wegen - 0.05);
    const S1 = S0 * (1 + 0.08 * (tZ / 3));
    const Y1 = Y0 - (S1 - S0) * ZY;
    FX.init(tl, "#a1hb-pan", { x: 0, y: Y0 });
    FX.init(tl, "#a1hb-zoom", { scale: S0, ...O });
    FX.tween(tl, "#a1hb-pan", { x: 0, y: Y0 }, { x: 0, y: Y1, duration: tZ, ease: "none" }, 0);
    FX.tween(tl, "#a1hb-zoom", { scale: S0, ...O }, { scale: S1, duration: tZ, ease: "none", ...O }, 0);

    // In den ersten 0,5 s zieht sich der rote Kreis um die Null (der Cursor zeichnet ihn mit).
    // Danach übernimmt eine identische Kopie im Kessel, die beim Rauszoomen mitwandert.
    const ringL = FX.handCircle(0, ZY, 31, 44, 7);
    const sD = S0 + (S1 - S0) * (0.5 / tZ), yD = Y0 + (Y1 - Y0) * (0.5 / tZ);
    const pts = [...ringL.matchAll(/[ML]([-\d.]+) ([-\d.]+)/g)].map((m) => toScreen(+m[1], +m[2], sD, yD));
    document.getElementById("a1hb-ring0").setAttribute("d", pts.map((q, i) => (i ? "L" : "M") + q[0].toFixed(1) + " " + q[1].toFixed(1)).join(" "));
    document.getElementById("a1hb-ring1").setAttribute("d", ringL);
    FX.init(tl, "#a1hb-ring1", { opacity: 0 });
    FX.drawCircle(tl, "#a1hb-ring0", 0);
    FX.cut(tl, "#a1hb-ring0", "#a1hb-ring1", 0.5);

    // "Wegen ihr gewinnt das Casino ...": Rauszoomen auf den ganzen Kessel (0,5 s, weich), danach ganz langsam weiter raus
    // (Tempo wie 8 % / 3 s) bis genau auf die Übergabegröße.
    const tW = tZ + 0.5;
    const dZ = Math.min(3, tEnd - tW);
    const zW = dZ >= 0.3 ? zEnd * (1 + (0.08 * dZ) / 3) : zEnd;
    FX.tween(tl, "#a1hb-zoom", { scale: S1, ...O }, { scale: zW, duration: 0.5, ease: "power2.inOut", ...O }, tZ);
    FX.tween(tl, "#a1hb-pan", { x: 0, y: Y1 }, { x: 0, y: 0, duration: 0.5, ease: "power2.inOut" }, tZ);
    FX.fadeOut(tl, "#a1hb-blur", tZ, 0.35);
    FX.fadeOut(tl, "#a1hb-nums", tZ + 0.1, 0.3);
    if (dZ >= 0.3) FX.slowZoom(tl, "#a1hb-zoom", tEnd - dZ, { from: zW, to: zEnd, d: dZ, ...O });

    // "... und genau davon ...": der Kreis geht weg, der Kessel dreht eine ganze Runde und steht wieder mit der Null oben.
    const tU = Math.min(Math.max(tZ + 1.0, C.genau - 0.05), tEnd - 0.8);
    const D = tEnd - tU;
    FX.fadeOut(tl, "#a1hb-ring1", tU, 0.2);
    FX.tween(tl, "#a1hb-spin", { rotation: 0, ...O }, { rotation: 360 * Math.max(1, Math.round(D / 2.9)), duration: D, ease: "sine.inOut", ...O }, tU);

    // Cursor zeichnet den Kreis (folgt dem Strich), geht danach knapp rechts oben aus dem Kreis heraus;
    // eine ruhige Bewegung pro Satz. Zeitpunkte nach Weglänge und derselben Kurve (power1.inOut) wie der Strich.
    const followPath = (P, t0, d) => {
      const L = [0];
      for (let i = 1; i < P.length; i++) L.push(L[i - 1] + Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]));
      const inv = (f) => (f < 0.5 ? Math.sqrt(f / 2) : 1 - Math.sqrt((1 - f) / 2));
      const T = L.map((l) => t0 + d * inv(l / L[L.length - 1]));
      return P.slice(1).map((q, i) => ({ t: T[i], to: q, d: Math.max(0.001, T[i + 1] - T[i]), ease: "none" }));
    };
    const steps = followPath(pts, 0, 0.5);
    const a = (-40 * Math.PI) / 180;   // rechts oben, 55 px außerhalb des Kreises: der Pfeil hängt nach rechts unten weg vom Strich
    const park = toScreen(Math.cos(a) * 31 * 1.05, ZY + Math.sin(a) * 44 * 1.05, sD, yD).map((v, i) => v + (i ? -1 : 1) * 40);
    steps.push({ t: 0.55, to: park, d: 0.25 });
    steps.push({ t: Math.max(0.85, tZ + 0.15), to: [960, 640], d: 0.6 });
    FX.cursor(tl, "#a1hb-cur", "#a1hb-ring", pts[0], steps);

    window.__timelines["ad1-hookB"] = tl;
  </script>
