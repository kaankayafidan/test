      <!-- Kurs-Mockup mit 3 Haken (nur Gesagtes: "klare Regeln", "kostenfreien", "Trading-Videokurs") -->
      <!--@include course p="a1b-course" items="Klare Regeln|Kostenlos|Videokurs"-->
      <!-- roter Kreis um "Kostenlos starten" (auf "locker"; kein Betrag im Bild) -->
      <svg id="a1b-kfx" class="fx-svg" viewBox="0 0 1080 710"><path id="a1b-ckost" class="fx-stroke" pathLength="1" d="" /></svg>

  <script>
    const tl = gsap.timeline({ paused: true });
    const O = { svgOrigin: "0 0" };
    // clamp, die auch lo > hi verträgt (dann gewinnt lo)
    const clamp = (v, lo, hi) => (hi < lo ? lo : Math.min(hi, Math.max(lo, v)));
    const pathOf = (id, d) => { document.getElementById(id).setAttribute("d", d); return d; };
    // Cursor-Schritte, bei denen die Pfeilspitze am Ende eines Strichs bleibt (gleiche Kurve wie FX.draw: power1.inOut).
    const followPath = (P, t0, d) => {
      const L = [0];
      for (let i = 1; i < P.length; i++) L.push(L[i - 1] + Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]));
      const inv = (f) => (f < 0.5 ? Math.sqrt(f / 2) : 1 - Math.sqrt((1 - f) / 2));
      const T = L.map((l) => t0 + d * inv(l / L[L.length - 1]));
      return P.slice(1).map((q, i) => ({ t: T[i], to: q, d: Math.max(0.001, T[i + 1] - T[i]), ease: "none" }));
    };
    const ptsOf = (d) => [...d.matchAll(/[ML]([-\d.]+) ([-\d.]+)/g)].map((m) => [+m[1], +m[2]]);

    // ---------------------------------------------------------------- Zeitpunkte (alle aus den Cues, gesprochener Text)
    const t27 = C.rechnerisch - 0.05;          // "Rechnerisch sind das 2,7 Prozent": Schnitt auf "1 von 37"
    const tV = C.verliert - 0.05;              // "Das Casino verliert also jeden Abend ...": zurück zum Kessel
    const tT = C.tausende - 0.05;              // "über Tausende Spiele": "1.000 Spiele"
    const tG = C.genau9 - 0.05;                // "Und genau so trade ich ...": harter Schnitt auf den Chart
    const tE = Math.max(tG + 0.4, C.nehme + 0.15);                             // Einstiegslinie
    const tZ = Math.max(tE + 0.4, C.ziel - 0.05);                              // "Ziel 2"
    const tU = Math.max(C.weiter - 0.05, tZ + 0.35);                           // "Ziel 2" unterstreichen auf "weiter weg"
    const tS = Math.max(C.stop - 0.2, tU + 0.35);                              // "Stop 1" (auf "mein Stop-Loss")
    const tRk = Math.max(C.riskiere - 0.05, tS + 1.0);      // "und riskiere pro Trade ...": Schnitt auf den Kreis; "Stop 1" steht davor mind. 1 s
    const tR = Math.max(C.verliere - 0.05, tRk + 1.2);      // "Ich verliere auch Trades" (auf "verliere"): Haken und X
    const tC = C.casino - 0.1;                 // "... wie das Casino": Split
    const tK = C.kein - 0.05;                  // "kein Mathematikstudium": Doktorhut + Uhr
    const tKR = C.klare - 0.05;                // "... kleine, klare Regeln": "Klare Regeln"
    const tKu = Math.max(C.kurs - 0.05, tKR + 1.6); // "das zeige ich dir in meinem kostenfreien Trading-Videokurs": Kurs-Mockup
    const tCTA = C.klick - 0.05;               // "Deswegen klick unter dem Video ...": CTA-Bild bis zum Ende
    // Gleiche Formeln stehen für die Soundeffekte in ad1-body.cues.json ("t").
    const t27s = clamp(C.p27 - 0.1, t27 + 0.25, tV - 1.05);                     // "2,7 %" auf "2,7", steht mind. 1 s (bei ganz knapper Zeit: 0,25 s nach "1 von 37")
    const tWins = Math.max(tT + 0.25, Math.min(Math.max(tT + 0.5, C.mathe - 0.05), tG - 1.2)); // "Mathematik gewinnt" mind. 1,2 s

    // ---------------------------------------------------------------- Ebenen (harte Schnitte)
    ["#a1b-s27", "#a1b-s1000", "#a1b-chart", "#a1b-risk", "#a1b-trades", "#a1b-split", "#a1b-icons", "#a1b-rules"].forEach((s) => FX.init(tl, s, { opacity: 0 }));
    FX.cut(tl, "#a1b-wheel", "#a1b-s27", t27);
    tl.set("#a1b-labs", { opacity: 0 }, t27);
    FX.cut(tl, "#a1b-s27", "#a1b-wheel", tV);
    FX.cut(tl, "#a1b-wheel", "#a1b-s1000", tT);
    FX.cut(tl, "#a1b-s1000", "#a1b-chart", tG);
    FX.cut(tl, "#a1b-chart", "#a1b-risk", tRk);
    FX.cut(tl, "#a1b-risk", "#a1b-trades", tR);
    FX.cut(tl, "#a1b-trades", "#a1b-split", tC);
    FX.cut(tl, "#a1b-split", "#a1b-icons", tK);
    FX.cut(tl, "#a1b-icons", "#a1b-rules", tKR);
    tl.set("#a1b-rules", { opacity: 0 }, tKu);
    // Haken neben dem Kurs folgen dem Gesagten: "Klare Regeln" (gleich), "Kostenlos" (auf "kostenfreien"), "Videokurs".
    const tk0 = tKu + 0.35;
    const tk1 = Math.max(C.kostenfrei - 0.05, tk0 + 0.36);
    const tk2 = Math.max(C.videokurs - 0.05, tk1 + 0.36);
    FX.course(tl, "a1b-course", tKu, [tk0, tk1, tk2]);
    tl.set("#a1b-course", { opacity: 0 }, tCTA);
    // CTA-Bild (wie FX.cta), aber der Pfeil hüpft nur so oft, dass er spätestens 0,35 s vor Schluss still steht.
    const ctaLocal = (p, t) => {
      tl.set(`#${p}`, { opacity: 0 }, 0);
      tl.set(`#${p}-laptop`, { opacity: 0 }, 0);
      tl.set(`#${p}-more`, { opacity: 0 }, 0);
      tl.set(`#${p}`, { opacity: 1 }, t);
      FX.tween(tl, `#${p}-laptop`, { scale: 1.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.15, ease: "power2.out" }, t);
      FX.tween(tl, `#${p}-more`, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, t + 0.2);
      const room = DUR - 0.35 - (t + 0.5);
      if (room >= 0.8) {
        const n = Math.min(3, Math.floor(room / 0.8));
        FX.tween(tl, `#${p}-arrow`, { y: 0 }, { y: 14, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: n * 2 - 1 }, t + 0.5);
      }
    };
    ctaLocal("a1b-cta", tCTA);

    // ---------------------------------------------------------------- Kessel: Position, Zoom, Drehung, Kugel
    // Übergabe von beiden Hooks: Kessel mittig, Radius 275 px, steht still (Null oben), keine Kugel.
    FX.init(tl, "#a1b-wpan", { x: 540, y: 355 });
    FX.init(tl, "#a1b-wzoom", { scale: 0.86, ...O });
    FX.init(tl, "#a1b-spin", { rotation: 0, ...O });
    FX.init(tl, "#a1b-bdrop", { opacity: 0, y: 0 });
    FX.init(tl, "#a1b-borb", { rotation: 130, ...O });
    FX.init(tl, "#a1b-bin", { opacity: 0 });
    FX.init(tl, "#a1b-zp", { opacity: 0 });
    FX.init(tl, "#a1b-zh", { opacity: 0 });
    FX.init(tl, "#a1b-zglow", { opacity: 0.45 });

    // Bild 1: kurz vor "37 Felder" schiebt sich der Kessel nach links (0,25 s), dann ploppen die Labels auf.
    const tSl = Math.max(0.05, C.felder - 0.33);
    FX.tween(tl, "#a1b-wpan", { x: 540, y: 355 }, { x: 330, y: 355, duration: 0.25, ease: "power2.out" }, tSl);
    FX.init(tl, "#a1b-l37", { opacity: 0 });
    FX.init(tl, "#a1b-l36", { opacity: 0 });
    const tL37 = Math.max(C.felder - 0.05, tSl + 0.27);
    const tL36 = Math.max(C.nur36 - 0.05, tL37 + 0.4);
    FX.pop(tl, "#a1b-l37", tL37);
    FX.pop(tl, "#a1b-l36", tL36);

    // "Und dieses eine grüne Feld, die Null, ist der komplette Vorteil": grüner Lichthof ploppt um die Null, Null und Lichthof pulsieren bis zum Schnitt.
    const tP = Math.max(C.gruen - 0.05, tL36 + 0.4);
    const ZO = { svgOrigin: "0 -203" };
    FX.pop(tl, "#a1b-zh", tP, ZO);
    tl.set("#a1b-zp", { opacity: 1 }, tP);
    const dPu = Math.max(0.8, t27 - tP - 0.25);
    const nPu = Math.max(1, Math.floor(dPu / 0.8));
    FX.pulse(tl, "#a1b-zp", tP + 0.15, dPu, ZO);
    FX.pulse(tl, "#a1b-zh", tP + 0.15, dPu, ZO);
    FX.tween(tl, "#a1b-zglow", { opacity: 0.45 }, { opacity: 1, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: nPu * 2 - 1 }, tP + 0.15);
    tl.set("#a1b-zp", { opacity: 0 }, t27);
    tl.set("#a1b-zh", { opacity: 0 }, t27);

    // Bild 3: "Das Casino verliert also jeden Abend unzählige Spiele": Kessel mittig, läuft, du zoomst langsam raus.
    tl.set("#a1b-wpan", { x: 540, y: 355 }, tV);
    tl.set("#a1b-wzoom", { scale: 1.08, ...O }, tV);
    FX.slowZoom(tl, "#a1b-wzoom", tV, { from: 1.08, to: 1, d: Math.max(1, Math.min(3, tT - tV)), ...O });
    const d3 = Math.max(0.5, tT - tV);

    FX.init(tl, "#a1b-rpie", { opacity: 0 });
    FX.init(tl, "#a1b-rslice", { x: 0, y: 0 });

    FX.pop(tl, "#a1b-rpie", tRk, { svgOrigin: "400 375" });

    const tKl = clamp(C.klein - 0.2, tPT + 0.36, tR - 0.95);        // "kleiner Teil" steht bis zum Schnitt mind. 1 s
    FX.pop(tl, "#a1b-klab", tKl);

    // ---------------------------------------------------------------- Bild 6: Reihe aus Haken und X, nacheinander
    const nT = 8;

      FX.init(tl, `#a1b-t${i}`, { opacity: 0 });

    // ---------------------------------------------------------------- Bild 7: Split Casino / Zocker, "Regeln" einkreisen
    FX.flyIn(tl, "#a1b-cardL", tC, { from: "left" });

    // der Zocker rauft sich die Haare (Kopf + Arme rütteln, endlich)
    const shakes = Math.max(2, Math.floor((tK - tZo - 0.3) / 0.22));
    FX.tween(tl, "#a1b-zk", { rotation: -2.5, svgOrigin: "247 380" }, { rotation: 2.5, duration: 0.22, ease: "sine.inOut", yoyo: true, repeat: shakes - 1, svgOrigin: "247 380" }, tZo + 0.25);

    const ringR = pathOf("a1b-cregeln", FX.handCircle(381, 618, 94, 41, 3));
    const tCi = clamp(C.treffer - 0.05, tZo + 0.6, tK - 0.9);

    pathOf("a1b-xcap", FX.handLine(140, 218, 440, 478, 5));
    pathOf("a1b-xclock", FX.handLine(642, 208, 938, 496, 9));
    FX.init(tl, "#a1b-cap", { opacity: 0 });
    FX.init(tl, "#a1b-clock", { opacity: 0 });
    const tSt = Math.max(tK + 0.6, C.stunden - 0.05);
    FX.pop(tl, "#a1b-cap", tK, { svgOrigin: "290 300" });
    FX.drawLine(tl, "#a1b-xcap", clamp(E.kein, tK + 0.25, tSt - 0.3));
    FX.pop(tl, "#a1b-clock", tSt, { svgOrigin: "790 330" });
    FX.drawLine(tl, "#a1b-xclock", clamp(E.stunden, tSt + 0.25, tKR - 0.35));

    // ---------------------------------------------------------------- Bild 9: "Klare Regeln ✓" (Haken auf "Regeln"), "Regeln" unterstreichen auf "welche Regeln wirklich wichtig sind"
    FX.init(tl, "#a1b-rtext", { opacity: 0 });
    FX.init(tl, "#a1b-rcheck", { opacity: 0 });
    FX.pop(tl, "#a1b-rtext", tKR);
    const tRc = clamp(C.regeln - 0.05, tKR + 0.36, tKu - 1.0);
    FX.pop(tl, "#a1b-rcheck", tRc, { svgOrigin: "910 355" });
    pathOf("a1b-urules", FX.handLine(436, 440, 830, 436, 4));
    FX.drawLine(tl, "#a1b-urules", clamp(C.wichtig - 0.05, tRc + 0.4, tKu - 0.5));

    // ---------------------------------------------------------------- Kurs: "für diesen Kurs könnte ich locker ...": Detail-Zoom auf "Kostenlos starten", auf "locker" einkreisen (kein Betrag im Bild)

    // "Kostenlos starten" (Mockup 99–254 × 380–414) liegt dann bei x 162–448, y 466–529.
    const ZC = [304, 320], ZS = 1.85;
    const tZi = clamp(C.diesen - 0.05, tk2 + 0.6, tCTA - 1.6);
    FX.init(tl, "#a1b-course", { scale: 1, x: 0, y: 0, transformOrigin: `${ZC[0]}px ${ZC[1]}px` });
    FX.zoomIn(tl, "#a1b-course", tZi, { origin: `${ZC[0]}px ${ZC[1]}px`, to: ZS, x: 540 - ZC[0], y: 355 - ZC[1] });
    const ringK = pathOf("a1b-ckost", FX.handCircle(305, 498, 182, 60, 11));
    const tLo = clamp(C.locker - 0.05, tZi + 0.55, tCTA - 1.0);   // Kreis steht mindestens 0,5 s
    FX.init(tl, "#a1b-kfx", { opacity: 1 });
    FX.drawCircle(tl, "#a1b-ckost", tLo);
    tl.set("#a1b-kfx", { opacity: 0 }, tCTA);

    // ---------------------------------------------------------------- Cursor: ruhig, eine Bewegung pro Satz, Klick bei jeder Einblendung
    // Jede Bewegung beginnt frühestens, wenn die vorige fertig ist; Klicks liegen mindestens 0,36 s auseinander (Klick-Ring 0,35 s).
    const REST = [960, 640];
    const ZPARK = [402, 60];                       // knapp außerhalb des Rands, rechts über der Null
    const CHART = [827, 435];                      // unter dem Stop-Balken; im Kreis-Bild rechts unten frei
    const GUTTER = [530, 470];                     // Spalt zwischen den Karten, unter der Haken-Reihe (über beide Bilder hinweg frei)
    const steps = [];
    let busy = 0, lastClick = -1;
    const move = (t, to, d) => { const t0 = Math.max(t, busy + 0.02); steps.push({ t: t0, to, d }); busy = t0 + d; return t0; };
    const click = (t) => { if (t >= lastClick + 0.36 && t >= busy) { steps.push({ t, click: true }); lastClick = t; } };
    const trace = (P, t0, d) => { const t1 = Math.max(t0, busy + 0.02); steps.push(...followPath(P, t1, d)); busy = t1 + d; };

    click(tL37);
    click(tL36);
    move(Math.max(tL36 + 0.15, tP - 0.5), ZPARK, Math.max(0.25, Math.min(0.45, tP - Math.max(tL36 + 0.15, tP - 0.5) - 0.02)));
    click(tP);
    click(t27);
    click(t27s);
    move(tV + 0.1, REST, 0.5);
    click(tT);
    click(tWins);
    move(Math.max(tG + 0.1, tE - 0.55), CHART, 0.5);
    click(tE);
    click(tZ);
    click(tS);
    click(tRk);
    click(tKl);
    move(tR + 0.05, GUTTER, 0.5);
    const rp = ptsOf(ringR);
    move(tCi - 0.35, rp[0], 0.3);
    trace(rp, tCi, 0.5);
    move(busy + 0.05, [510, 602], 0.25);
    click(tK);
    click(tSt);
    click(tKR);
    click(tRc);
    click(tk0);
    click(tk1);

    move(busy + 0.05, [512, 512], 0.25);
    move(tCTA + 0.25, [818, 628], 0.5);
    FX.cursor(tl, "#a1b-cur", "#a1b-ring", REST, steps);

    window.__timelines["ad1-body"] = tl;
  </script>
