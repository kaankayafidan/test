      <!--@include course p="a1b-course" items="Grundlagen|Strategie|60-Tage-Plan"-->
      <!-- CTA-Bild -->
      <!--@include cta p="a1b-cta"-->
      <!-- kleines Banner "Mehr dazu ↓" bleibt im Schlussbild bis zum Ende -->

  <script>
    const tl = gsap.timeline({ paused: true });
    const O = { svgOrigin: "0 0" };
    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
    // Lokaler Ersatz für FX.drawCircle/drawLine: FX.draw rundet stroke-dashoffset auf ganze px (GSAP autoRound),
    // dann ploppt der Strich nur auf statt sich zu zeichnen. Gleiche Werte (Kreis 0,5 s, Linie 0,3 s), ohne Rundung.
    const draw = (el, t, d) => FX.tween(tl, el, { opacity: 1, strokeDashoffset: 1 }, { opacity: 1, strokeDashoffset: 0, autoRound: false, duration: d, ease: "power1.inOut" }, t);
    const pathOf = (id, d) => { document.getElementById(id).setAttribute("d", d); return d; };
    // Cursor-Schritte, bei denen die Pfeilspitze am Ende eines Strichs bleibt (gleiche Kurve wie draw()).
    const followPath = (P, t0, d) => {
      const L = [0];
      for (let i = 1; i < P.length; i++) L.push(L[i - 1] + Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]));
      const inv = (f) => (f < 0.5 ? Math.sqrt(f / 2) : 1 - Math.sqrt((1 - f) / 2));
      const T = L.map((l) => t0 + d * inv(l / L[L.length - 1]));
      return P.slice(1).map((q, i) => ({ t: T[i], to: q, d: Math.max(0.001, T[i + 1] - T[i]), ease: "none" }));
    };
    const ptsOf = (d) => [...d.matchAll(/[ML]([-\d.]+) ([-\d.]+)/g)].map((m) => [+m[1], +m[2]]);

    // ---------------------------------------------------------------- Zeitpunkte (alle aus den Cues)
    const t27 = C.rechnerisch - 0.05;          // Schnitt auf "1 von 37"
    const tV = C.verliert - 0.05;              // zurück zum Kessel
    const tT = C.tausende - 0.05;              // "1.000 Spiele"
    const tG = C.genau9 - 0.05;                // harter Schnitt auf den Chart
    const tR = C.verliere - 0.05;              // Haken und X
    const tC = C.casino - 0.1;                 // Split
    const tK = C.kein - 0.05;                  // Doktorhut + Uhr
    const tKR = C.klare - 0.05;                // "Klare Regeln"
    const tKu = C.welche - 0.05;               // Kurs-Mockup
    const tCTA = C.klick - 0.05;               // CTA-Bild
    const tW = C.wer - 0.05;                   // zurück zum Kessel, Kugel landet auf der Null

    // ---------------------------------------------------------------- Ebenen (harte Schnitte)
    ["#a1b-s27", "#a1b-s1000", "#a1b-chart", "#a1b-trades", "#a1b-split", "#a1b-icons", "#a1b-rules"].forEach((s) => FX.init(tl, s, { opacity: 0 }));
    FX.cut(tl, "#a1b-wheel", "#a1b-s27", t27);
    tl.set("#a1b-labs", { opacity: 0 }, t27);
    FX.cut(tl, "#a1b-s27", "#a1b-wheel", tV);
    FX.cut(tl, "#a1b-wheel", "#a1b-s1000", tT);
    FX.cut(tl, "#a1b-s1000", "#a1b-chart", tG);
    FX.cut(tl, "#a1b-chart", "#a1b-trades", tR);
    FX.cut(tl, "#a1b-trades", "#a1b-split", tC);
    FX.cut(tl, "#a1b-split", "#a1b-icons", tK);
    FX.cut(tl, "#a1b-icons", "#a1b-rules", tKR);
    tl.set("#a1b-rules", { opacity: 0 }, tKu);
    // FX.course/FX.cta setzen die Haken bzw. "Mehr dazu" nicht auf ihren Anfangszustand: hier nachholen, sonst stehen sie vor ihrem Einsatz schon da.
    [0, 1, 2].forEach((i) => FX.init(tl, `#a1b-course-i${i}`, { opacity: 0 }));
    FX.init(tl, "#a1b-cta-more", { opacity: 0 });
    FX.course(tl, "a1b-course", tKu, [C.grundlagen - 0.05, C.strategie - 0.05, C.plan - 0.05]);
    tl.set("#a1b-course", { opacity: 0 }, tCTA);
    FX.cta(tl, "a1b-cta", tCTA);
    FX.cut(tl, "#a1b-cta", "#a1b-wheel", tW);
    FX.more(tl, "a1b-more", tW + 0.15);

    // ---------------------------------------------------------------- Kessel: Position, Zoom, Drehung, Kugel
    // Bild 1: links, Radius 275 px, steht still (Null oben).
    FX.init(tl, "#a1b-wpan", { x: 330, y: 355 });
    FX.init(tl, "#a1b-wzoom", { scale: 0.86, ...O });
    FX.init(tl, "#a1b-spin", { rotation: 0, ...O });
    FX.init(tl, "#a1b-bdrop", { opacity: 0, y: 0 });
    FX.init(tl, "#a1b-borb", { rotation: 130, ...O });
    FX.init(tl, "#a1b-bin", { opacity: 0 });
    FX.init(tl, "#a1b-zp", { opacity: 0 });

    // Labels: "37 Felder" auf "37", "Auszahlung wie bei 36" auf "36".
    FX.init(tl, "#a1b-l37", { opacity: 0 });
    FX.init(tl, "#a1b-l36", { opacity: 0 });
    FX.pop(tl, "#a1b-l37", C.felder - 0.05);
    FX.pop(tl, "#a1b-l36", C.nur36 - 0.05);

    // "... dieses eine grüne Feld, die Null": die Null pulsiert grün bis zum Schnitt.
    const tP = C.gruen - 0.05;
    tl.set("#a1b-zp", { opacity: 1 }, tP);
    FX.pulse(tl, "#a1b-zp", tP, Math.max(0.8, t27 - tP), { svgOrigin: "0 -203" });
    tl.set("#a1b-zp", { opacity: 0 }, t27);

    // Bild 3: "Das Casino verliert jeden Abend unzählige Spiele": Kessel mittig, läuft, du zoomst langsam raus.
    tl.set("#a1b-wpan", { x: 540, y: 355 }, tV);
    tl.set("#a1b-wzoom", { scale: 1.08, ...O }, tV);
    FX.slowZoom(tl, "#a1b-wzoom", tV, { from: 1.08, to: 1, d: Math.max(1, Math.min(3, tT - tV)), ...O });
    const d3 = Math.max(0.5, tT - tV);
    FX.tween(tl, "#a1b-spin", { rotation: 0, ...O }, { rotation: 150 * d3, duration: d3, ease: "none", ...O }, tV);
    tl.set("#a1b-bdrop", { opacity: 1 }, tV);
    FX.tween(tl, "#a1b-borb", { rotation: 130, ...O }, { rotation: 130 - 420 * d3, duration: d3, ease: "none", ...O }, tV);
    tl.set("#a1b-bdrop", { opacity: 0 }, tT);

    // Schlussbild: "... wer am Tisch wirklich gewinnt." Kessel mittig (Platz für das Banner), Kugel läuft und landet auf der Null.
    const tStop = DUR - 0.35;
    const tLand = clamp(E.wer - 0.1, tW + 1.2, DUR - 0.9);
    const thA = 188, thC = 380;                       // Kessel dreht von 188° auf 380° und läuft aus
    const pOut = (p) => 1 - (1 - p) * (1 - p);        // = GSAP "power1.out"
    const thLand = thA + (thC - thA) * pOut((tLand - tW) / (tStop - tW));
    const phL = thLand - 360 * 2, ph0 = phL + 720;    // Kugel: 2 Runden gegen den Uhrzeigersinn, endet genau über der Null
    tl.set("#a1b-wpan", { x: 540, y: 312 }, tW);
    tl.set("#a1b-wzoom", { scale: 0.85, ...O }, tW);
    tl.set("#a1b-spin", { rotation: thA, ...O }, tW);
    FX.tween(tl, "#a1b-spin", { rotation: thA, ...O }, { rotation: thC, duration: tStop - tW, ease: "power1.out", ...O }, tW);
    tl.set("#a1b-borb", { rotation: ph0, ...O }, tW);
    FX.tween(tl, "#a1b-borb", { rotation: ph0, ...O }, { rotation: phL, duration: tLand - tW, ease: "power1.out", ...O }, tW);
    tl.set("#a1b-bdrop", { opacity: 1 }, tW);
    FX.tween(tl, "#a1b-bdrop", { y: 0 }, { y: 277 - 182, duration: 0.35, ease: "power2.in" }, tLand - 0.35);
    FX.cut(tl, "#a1b-bdrop", "#a1b-bin", tLand);
    if (tLand + 0.9 <= DUR - 0.3) {
      tl.set("#a1b-zp", { opacity: 1 }, tLand + 0.05);
      FX.pulse(tl, "#a1b-zp", tLand + 0.05, 0.8, { svgOrigin: "0 -203" });
    }

    // ---------------------------------------------------------------- Bild 2: "1 von 37", dann "2,7 %"
    FX.init(tl, "#a1b-n137", { opacity: 0 });
    FX.init(tl, "#a1b-n27", { opacity: 0 });
    FX.pop(tl, "#a1b-n137", t27);
    FX.slam(tl, "#a1b-n27", Math.max(t27 + 0.3, C.p27 - 0.2));

    // ---------------------------------------------------------------- Bild 4: "1.000 Spiele", danach "Mathematik gewinnt"
    FX.init(tl, "#a1b-n1000", { opacity: 0 });
    FX.init(tl, "#a1b-wins", { opacity: 0 });
    FX.pop(tl, "#a1b-n1000", tT);
    FX.pop(tl, "#a1b-wins", Math.max(tT + 0.5, C.mathe - 0.05));

    // ---------------------------------------------------------------- Bild 5: Chart, Einstieg, Ziel 2 / Stop 1, unterstreichen
    ["#a1b-entry", "#a1b-zbar", "#a1b-sbar", "#a1b-zlab", "#a1b-slab"].forEach((s) => FX.init(tl, s, { opacity: 0 }));
    const tE = Math.max(tG + 0.4, C.nehme + 0.15);
    FX.fadeIn(tl, "#a1b-entry", tE);
    const tZ = Math.max(tE + 0.4, C.ziel - 0.05);
    FX.fadeIn(tl, "#a1b-zbar", tZ);
    FX.fadeIn(tl, "#a1b-zlab", tZ);
    const tS = Math.max(tZ + 0.5, C.stop - 0.05);
    FX.fadeIn(tl, "#a1b-sbar", tS);
    FX.fadeIn(tl, "#a1b-slab", tS);
    const tU = clamp(E.stop + 0.15, tS + 0.35, tR - 0.6);
    draw("#a1b-uline", tU, 0.3);

    // ---------------------------------------------------------------- Bild 6: Reihe aus Haken und X, nacheinander
    const nT = 8;
    const tR1 = clamp(E.casinoVerliert - 0.2, tR + 1.2, tC - 0.3);
    for (let i = 0; i < nT; i++) {
      FX.init(tl, `#a1b-t${i}`, { opacity: 0 });
      FX.pop(tl, `#a1b-t${i}`, tR + ((tR1 - tR) * i) / (nT - 1));
    }

    // ---------------------------------------------------------------- Bild 7: Split Casino / Zocker, "Regeln" einkreisen
    FX.flyIn(tl, "#a1b-cardL", tC, { from: "left" });
    FX.init(tl, "#a1b-cardR", { opacity: 0 });
    const tZo = Math.max(tC + 0.5, C.zocker - 0.1);
    tl.set("#a1b-cardR", { opacity: 1 }, tZo);
    FX.flyIn(tl, "#a1b-cardR", tZo, { from: "right" });
    // der Zocker rauft sich die Haare (Kopf + Arme rütteln, endlich)
    const shakes = Math.max(2, Math.floor((tK - tZo - 0.3) / 0.22));
    FX.tween(tl, "#a1b-zk", { rotation: -2.5, svgOrigin: "247 380" }, { rotation: 2.5, duration: 0.22, ease: "sine.inOut", yoyo: true, repeat: shakes - 1, svgOrigin: "247 380" }, tZo + 0.25);
    const ringR = pathOf("a1b-cregeln", FX.handCircle(380, 618, 93, 41, 3));
    const tCi = clamp(C.treffer - 0.05, tZo + 0.6, tK - 0.6);
    draw("#a1b-cregeln", tCi, 0.5);
