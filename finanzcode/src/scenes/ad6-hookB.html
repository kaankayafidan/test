    #a6hb-scene { position: absolute; inset: 0; }
    #a6hb-art { position: absolute; left: 0; top: 0; width: 1080px; height: 710px; overflow: visible; }
    /* The art is drawn at 1.125x (viewBox 960 wide), so 8.9 user units = 10 px red line. */

  </style>
  <div id="root" data-composition-id="ad6-hookB" data-width="1080" data-height="710">
    <!-- One clip spans the whole scene; everything inside is animated, never the clip itself. -->
    <div id="a6hb-scene" class="clip" data-start="0" data-duration="{{DUR}}">
      <!-- Same stage, stool and figure as hook A (same viewBox), only the pose differs. -->
      <svg id="a6hb-art" viewBox="60 60 960 631">
        <line x1="250" y1="652" x2="830" y2="652" stroke="#9CA3AF" stroke-width="6" stroke-linecap="round" />
        <!-- gestricheltes zweites Bein, erscheint auf "ein zweites bauen" -->
        <g id="a6hb-leg2">
          <path d="M640 480 L712 646" fill="none" stroke="#16A34A" stroke-width="12" stroke-linecap="round" stroke-dasharray="22 16" />
          <ellipse cx="716" cy="650" rx="30" ry="7" fill="none" stroke="#16A34A" stroke-width="6" stroke-dasharray="10 8" />
        </g>
        <!-- Hocker + Figur wackeln zusammen um den Fußpunkt (540, 650); die Figur merkt nichts -->
        <g id="a6hb-rig">
          <ellipse cx="540" cy="650" rx="48" ry="9" fill="#7C2D12" />
          <rect x="527" y="470" width="26" height="182" rx="8" fill="#7C2D12" />
          <ellipse cx="540" cy="474" rx="124" ry="24" fill="#9A3412" />
          <ellipse cx="540" cy="462" rx="124" ry="24" fill="#EA580C" />
          <!-- Beine baumeln -->
          <path d="M518 448 Q492 490 485 546" fill="none" stroke="#1E293B" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M562 448 Q588 490 595 546" fill="none" stroke="#1E293B" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" />
          <ellipse cx="477" cy="556" rx="26" ry="13" fill="#111827" />
          <ellipse cx="603" cy="556" rx="26" ry="13" fill="#111827" />
          <!-- Oberkörper (Hemd) -->
          <path d="M486 330 Q486 304 512 302 L568 302 Q594 304 594 330 L590 452 L490 452 Z" fill="#2563EB" />
          <path d="M528 302 L540 330 L552 302 Z" fill="#FFFFFF" />
          <rect x="522" y="282" width="36" height="26" rx="8" fill="#F2C29B" />
          <!-- Oberarme an der Seite -->
          <path d="M497 326 L480 384" fill="none" stroke="#2563EB" stroke-width="28" stroke-linecap="round" />
          <path d="M583 326 L600 384" fill="none" stroke="#2563EB" stroke-width="28" stroke-linecap="round" />
          <!-- Handy mit beiden Händen vor der Brust -->
          <rect x="512" y="328" width="56" height="88" rx="10" fill="#0E1A2B" />
          <rect x="519" y="337" width="42" height="66" rx="5" fill="#334155" />
          <path d="M526 346 L548 346" stroke="#64748B" stroke-width="5" stroke-linecap="round" />
          <!-- Unterarme (hochgekrempelt) + Hände halten das Handy -->
          <path d="M480 384 L510 396" fill="none" stroke="#F2C29B" stroke-width="24" stroke-linecap="round" />
          <path d="M600 384 L570 396" fill="none" stroke="#F2C29B" stroke-width="24" stroke-linecap="round" />
          <circle cx="512" cy="394" r="15" fill="#F2C29B" />

          <!-- Kopf: entspannt, schaut aufs Handy, lächelt -->
          <circle cx="540" cy="240" r="54" fill="#F2C29B" />
          <path d="M488 232 Q490 180 540 180 Q594 180 594 230 Q580 206 552 204 Q520 204 500 222 Z" fill="#5B3A1E" />

          <circle cx="558" cy="251" r="7" fill="#111827" />
          <path d="M524 270 Q540 284 556 270" fill="none" stroke="#111827" stroke-width="5" stroke-linecap="round" />
        </g>
        <!-- "... auf einem einzigen Bein": das Bein einkreisen (rot, 10 px, 0,5 s) -->
        <path id="a6hb-circ" class="fx-stroke" pathLength="1" d="M0 0" />
      </svg>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const PIVOT = "540 650";

    // Hand-drawn circle around the single leg (seeded, identical every render).
    document.querySelector("#a6hb-circ").setAttribute("d", FX.handCircle(540, 562, 60, 116, 11));

    // Initial states (t = 0). Pivots first, so GSAP never switches origin on a rotated element.
    FX.init(tl, "#a6hb-rig", { svgOrigin: PIVOT, smoothOrigin: false });
    FX.init(tl, "#a6hb-leg2", { svgOrigin: "676 563", smoothOrigin: false, opacity: 0 });

    // Frame 1: der Hocker wackelt ±6° um den Fußpunkt, die Figur merkt nichts.
    // Wackelt weiter bis kurz vor "zweites", dann steht er (das gestrichelte Bein kommt dazu).
    const swings = Math.max(1, Math.floor((C.zweites - 0.3) / 0.6));
    const w = FX.wobble(tl, "#a6hb-rig", 0, swings * 0.6 + 0.01, { svgOrigin: PIVOT });
    FX.settle(tl, "#a6hb-rig", w.end, w.endRotation, { svgOrigin: PIVOT });

    // "Ihr ganzes Einkommen steht auf einem einzigen Bein.": das Bein einkreisen.
    FX.drawCircle(tl, "#a6hb-circ", Math.max(0.6, C.einzigen - 0.1));

    // "Mit Trading kannst du dir ein zweites bauen.": gestricheltes zweites Bein.
    FX.pop(tl, "#a6hb-leg2", Math.max(w.end + 0.3, C.zweites), { svgOrigin: "676 563" });

    window.__timelines["ad6-hookB"] = tl;
  </script>
