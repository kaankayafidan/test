  <script>
    const tl = gsap.timeline({ paused: true });
    const $ = (s) => document.querySelector(s);
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const W = 1080, H = 710;

    // ---------- Handschrift: Wischen von links, 0,4–0,6 s pro Wort ----------
    const H0 = "inset(-30% 112% -45% -12%)", H1 = "inset(-30% -12% -45% -12%)";
    const wordDur = (el) => clamp(0.26 + 0.03 * el.textContent.trim().length, 0.4, 0.6);
    function write(sel, t, d) {
      const el = $(sel);
      d = d ?? wordDur(el);
      FX.tween(tl, el, { clipPath: H0 }, { clipPath: H1, duration: d, ease: "none" }, t);
      return t + d;
    }
    function writeSeq(list, t, gap = 0.05) {
      for (const it of list) t = (Array.isArray(it) ? write(it[0], t, it[1]) : write(it, t)) + gap;
      return t - gap;
    }
    function draw(sel, t, d) { FX.draw(tl, sel, t, d); return t + d; }

    // hand-drawn shapes (seeded, identical every render)
    $("#a8-qc").setAttribute("d", FX.handCircle(810, 527, 100, 114, 3));
    $("#a8-dc").setAttribute("d", FX.handCircle(540, 500, 352, 70, 11));
    $("#a8-kiu").setAttribute("d", FX.handLine(708, 113, 912, 109, 5));
    let wv = "M95 338";
    for (let i = 0; i < 20; i++) wv += ` q8.75 ${i % 2 ? 9 : -9} 17.5 0`;
    $("#a8-wave").setAttribute("d", wv);

    // ---------- Anfangszustände ----------
    // Seite 2 links: schreibt sich nach dem Umblättern nur, wenn bis "läuft daneben" Zeit ist; sonst steht es schon (nur ✓ live)
    const tF = Math.max(C.stoppen - 0.15, E.mehr + 0.6);
    const p2Room = C.daneben - 0.1 - (tF + 0.42);
    const p2Words = p2Room >= 2.2 ? ["#a8-p2hw", "#a8-p2l1", "#a8-p2l2"] : p2Room >= 1.4 ? ["#a8-p2l1", "#a8-p2l2"] : [];
    p2Words.forEach((s) => $(s).classList.add("a8-wipe"));
    document.querySelectorAll("#a8-scene .a8-wipe").forEach((el) => FX.init(tl, el, { clipPath: H0 }));
    FX.init(tl, "#a8-midp", { strokeDashoffset: 0 });
    FX.init(tl, ["#a8-he1", "#a8-he2", "#a8-he3"], { opacity: 0 });
    FX.init(tl, "#a8-p1", { clipPath: `polygon(0px 0px, ${W}px 0px, ${W}px ${H}px, 0px ${H}px)`, opacity: 1 });
    FX.init(tl, "#a8-flap", { opacity: 0 });
    FX.init(tl, "#a8m-chip", { opacity: 0 });                 // Datum schreibt sich von Hand, der Chip des Bausteins bleibt aus
    FX.init(tl, "#a8m-btn", { opacity: 0 });

    // A (erstes Bild): Kopfzeilen 1,22× und tiefer, "automatisch" ebenso; Mittelstrich lang
    const SA = 1.22, CAP = "50% 38.6%";
    const rowsA = [["#a8-lh", 151], ["#a8-rh", 151], ["#a8-la", 190], ["#a8-ra", 190]];
    rowsA.forEach(([el, dy]) => FX.init(tl, el, { scale: SA, y: dy, transformOrigin: CAP }));

    // ---------- 1 · "Wenn dein ETF-Sparplan schon automatisch läuft": rechts "KI-Bot" Buchstabe für Buchstabe, Stift fährt mit ----------
    const KE = [0, 0.602, 0.911, 1.442, 2.066, 2.522, 2.973], KFS = 69;   // Kalam 700 letter edges (em)
    const kW = KE[6] * KFS;
    const kx = (i) => 810 - (kW * SA) / 2 + KE[i] * KFS * SA;
    const kClip = (i) => `inset(-25px ${(i === 6 ? -14 : kW - KE[i] * KFS).toFixed(1)}px -35px -14px)`;
    const AY = 221;
    const penY = (i) => AY + (i % 2 ? 12 : -2);
    FX.init(tl, "#a8-kb", { clipPath: kClip(2) });            // Frame 0: "KI" steht, der Stift setzt an
    FX.init(tl, "#a8-pen", { x: kx(2), y: penY(2), opacity: 1 });
    let t = 0;
    [[2, 0.16], [3, 0.24], [4, 0.2], [5, 0.2]].forEach(([i, d]) => {
      FX.tween(tl, "#a8-kb", { clipPath: kClip(i) }, { clipPath: kClip(i + 1), duration: d, ease: "none" }, t);
      FX.tween(tl, "#a8-pen", { x: kx(i), y: penY(i) }, { x: kx(i + 1), y: penY(i + 1), duration: d, ease: "none" }, t);
      t += d + 0.04;
    });
    const kEnd = t;

    // ---------- 2 · "wozu brauchst du dann noch einen KI-Trading-Bot?": großes rotes "?" (der Stift schreibt es, dann geht er) ----------
    const tQ = Math.max(C.wozu - 0.05, kEnd + 0.6);
    const qStart = [774, 488];
    FX.tween(tl, "#a8-pen", { x: kx(6), y: penY(6) }, { x: kx(6) + 18, y: AY - 40, duration: Math.max(0.2, tQ - 0.32 - kEnd), ease: "sine.inOut" }, kEnd);
    FX.tween(tl, "#a8-pen", { x: kx(6) + 18, y: AY - 40 }, { x: qStart[0], y: qStart[1], duration: 0.3, ease: "power2.inOut" }, tQ - 0.32);
    FX.init(tl, "#a8-qw", { clipPath: "inset(-12% -25% 112% -25%)" });
    FX.tween(tl, "#a8-qw", { clipPath: "inset(-12% -25% 112% -25%)" }, { clipPath: "inset(-12% -25% -12% -25%)", duration: 0.5, ease: "none" }, tQ);
    FX.tween(tl, "#a8-pen", { x: qStart[0], y: qStart[1] }, { x: 846, y: 486, duration: 0.17, ease: "sine.out" }, tQ);
    FX.tween(tl, "#a8-pen", { x: 846, y: 486 }, { x: 811, y: 566, duration: 0.19, ease: "sine.inOut" }, tQ + 0.17);
    FX.tween(tl, "#a8-pen", { x: 811, y: 566 }, { x: 811, y: 600, duration: 0.14, ease: "power1.out" }, tQ + 0.36);
    FX.tween(tl, "#a8-pen", { x: 811, y: 600, opacity: 1 }, { x: 1260, y: 780, opacity: 0, duration: 0.35, ease: "power2.in" }, tQ + 0.62);
    // Lücke bis "Frage" > 3 s: das "?" wackelt einmal (6°, 0,6 s pro Schwung)
    const qEnd = tQ + 0.5;
    if (C.frage - qEnd > 2.6) {
      const tw = qEnd + Math.max(0.9, (C.frage - qEnd - 1.2) * 0.55);
      FX.init(tl, "#a8-q", { rotation: 0, transformOrigin: "50% 77%" });
      FX.tween(tl, "#a8-q", { rotation: 0 }, { rotation: -6, duration: 0.3, ease: "sine.out" }, tw);
      FX.tween(tl, "#a8-q", { rotation: -6 }, { rotation: 6, duration: 0.6, ease: "sine.inOut" }, tw + 0.3);
      FX.tween(tl, "#a8-q", { rotation: 6 }, { rotation: 0, duration: 0.3, ease: "sine.in" }, tw + 0.9);
    }

    // ---------- 3 · "eine richtig gute Frage": das "?" wird blau eingekreist ----------
    const tFr = Math.max(C.frage, qEnd + 0.2);
    draw("#a8-qc", tFr, 0.5);

    // ---------- 4 · "automatisch läuft ja beides": rechts auf gleicher Höhe "automatisch ✓" ----------
    const tB = Math.max(C.beides - 0.05, tFr + 0.5);
    const bEnd = draw("#a8-rac", write("#a8-raw", tB) + 0.05, 0.25);

    // ---------- Magic Move zu B ("DAS problem ist"): Spalten rücken nach oben, "?" geht, Mittelstrich wird kürzer ----------
    const tM = Math.max(C.problem - 0.1, bEnd + 0.25);
    rowsA.forEach(([el, dy]) => FX.tween(tl, el, { scale: SA, y: dy }, { scale: 1, y: 0, duration: 0.5, ease: "power2.inOut" }, tM));
    FX.fadeOut(tl, "#a8-qg", tM, 0.25);
    FX.tween(tl, "#a8-midp", { strokeDashoffset: 0 }, { strokeDashoffset: 0.385, duration: 0.5, ease: "power2.inOut", autoRound: false }, tM);

    // ---------- 5–7 · links: Pfeil hoch + Haken, Pfeil runter + X, rote Wellenlinie ----------
    draw("#a8-upc", draw("#a8-up", Math.max(C.steigen - 0.15, tM + 0.6), 0.3), 0.25);
    draw("#a8-dnx", draw("#a8-dn", C.fallen - 0.15, 0.3), 0.25);
    draw("#a8-wave", C.investoren, 0.5);

    // Markierung in der langen Lücke vor "in beide Richtungen": "KI-Bot" wird gelb unterstrichen
    draw("#a8-kiu", C.einki - 0.1, 0.3);

    // ---------- 8 · "in beide Richtungen": Doppelpfeil, beide Spitzen bekommen Haken ----------
    const tR = C.richtungen - 0.1;
    draw("#a8-dbl", tR, 0.4);
    draw("#a8-dc1", tR + 0.42, 0.2);
    draw("#a8-dc2", tR + 0.62, 0.2);

    // ---------- 9 · "wie der Mitarbeiter" (Tabelle: "wie dein mitarbeiter"): Mitarbeiterausweis (Roboterkopf, "KI-Bot", "Aufgabe: Gold") ----------
    const tA = C.mitarbeiter - 0.12;
    draw("#a8-card", tA, 0.35);
    draw("#a8-slot", tA + 0.22, 0.15);
    draw("#a8-head", tA + 0.2, 0.3);
    FX.pop(tl, ["#a8-he1", "#a8-he2", "#a8-he3"], tA + 0.48);
    writeSeq(["#a8-ckw", "#a8-ca1", "#a8-ca2"], tA + 0.34, 0.03);

    // ---------- 10 · "24/7": nur ein Uhr-Doodle am Ausweis ----------
    draw("#a8-clk", C.uhr - 0.1, 0.35);

    // ---------- 10b · Backtest-Bild (Kundenwunsch, nicht in der Tabelle) ----------
    // "für dich Trades setzt und bei steigenden als auch bei fallenden Kursen": das Bild ploppt unten auf die Seite, die
    // Linie deckt sich von links auf (Wischen); "Backtest · Simulation" hängt die ganze Zeit dran. Gut 3 s; ganz weg, bevor
    // der Untertitel "dich Profite generieren" kommt (C.profite = "dich", Start dieser Untertitel-Gruppe): das Bild steht
    // nie neben dem Wort "Profite".
    const tBt = C.trades - 0.18;                                           // "für dich Trades setzt"
    const tBtOut = clamp(C.profite - 0.22, tBt + 2.8, Math.min(tBt + 3.8, C.live - 0.6));
    const BT0 = "inset(0px 836px 0px 0px)", BT1 = "inset(0px 0px 0px 0px)";   // 836 = 880 - 44 (left margin of the line)
    FX.init(tl, "#a8-bt", { opacity: 0 });
    FX.init(tl, "#a8-bti", { clipPath: BT0 });
    FX.pop(tl, "#a8-bt", tBt);
    FX.tween(tl, "#a8-bti", { clipPath: BT0 }, { clipPath: BT1, duration: 1.1, ease: "none" }, tBt + 0.05);   // gleichmäßig wie die Zeit
    FX.fadeOut(tl, "#a8-bt", tBtOut, 0.2);

    // ---------- 11 · "fallenden Kursen" (Tabelle: "fallenden ETF Kursen"): Doppelpfeil wird einmal nachgezogen ----------
    draw("#a8-dbl2", C.kursen, 0.4);

    // ---------- 12 · Mitte-CTA (Baustein): "Live · So 6.12. · 18 Uhr" schreibt sich quer und wird eingekreist ----------
    const dEnd = writeSeq(["#a8-d1", ["#a8-d2", 0.12], "#a8-d3", "#a8-d4", ["#a8-d5", 0.12], "#a8-d6", "#a8-d7"], C.live - 0.05, 0.06);
    draw("#a8-dc", Math.max(C.webinar - 0.1, dEnd + 0.05), 0.5);

    // ---------- 13 · "Klick dazu einfach" (Tabelle: "klick am besten jetzt schon"): Button "Mehr dazu" in Navy ploppt, pulsiert solange der Satz läuft, dann raus ----------
    FX.pop(tl, "#a8m-btn", C.klick);
    const pulseD = Math.max(0.8, E.mehr - C.klick - 0.2);
    FX.pulse(tl, "#a8m-btn", C.klick + 0.15, pulseD);
    FX.tween(tl, "#a8m-arrow", { y: 0 }, { y: 10, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 3 }, C.klick + 0.2);
    const tOut = Math.max(E.mehr, C.klick + 0.15 + Math.max(1, Math.floor(pulseD / 0.8)) * 0.8);
    FX.tween(tl, "#a8m-btn", { opacity: 1, y: 0 }, { opacity: 0, y: 190, duration: 0.25, ease: "power2.in" }, tOut);

    // ---------- 14 · "nicht stoppen": Umblättern in 0,4 s von rechts oben ----------
    function peel(e) {
      const Q = [W - 2 * W * e, H * 0.3 * Math.sin(Math.PI * e)];
      const M = [(W + Q[0]) / 2, Q[1] / 2];
      let n = [W - Q[0], -Q[1]];
      const L = Math.hypot(n[0], n[1]);
      n = [n[0] / L, n[1] / L];
      const side = (p) => (p[0] - M[0]) * n[0] + (p[1] - M[1]) * n[1];
      const rect = [[0, 0], [W, 0], [W, H], [0, H]];
      const cut = (keepFold) => {
        const out = [];
        for (let i = 0; i < 4; i++) {
          const a = rect[i], b = rect[(i + 1) % 4], sa = side(a), sb = side(b);
          const ia = keepFold ? sa >= 0 : sa <= 0, ib = keepFold ? sb >= 0 : sb <= 0;
          if (ia) out.push(a);
          if (ia !== ib) { const k = sa / (sa - sb); out.push([a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k]); }
        }
        return out;
      };
      const fold = cut(true).map((p) => { const s = side(p); return [p[0] - 2 * s * n[0], p[1] - 2 * s * n[1]]; });
      return { stay: cut(false), fold, M, Q };
    }
    const NF = 16;
    FX.set(tl, "#a8-flap", { opacity: 1 }, tF);
    for (let k = 1; k <= NF; k++) {
      const tk = tF + ((k - 1) / NF) * 0.4;
      const e = 0.5 - 0.5 * Math.cos(Math.PI * (k / NF));
      const g = peel(Math.max(0.02, e));
      if (g.stay.length >= 3) FX.set(tl, "#a8-p1", { clipPath: `polygon(${g.stay.map((p) => `${p[0].toFixed(1)}px ${p[1].toFixed(1)}px`).join(", ")})` }, tk);
      const pts = g.fold.map((p) => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
      const sh = g.fold.map((p) => `${(p[0] + 10).toFixed(1)},${(p[1] + 14).toFixed(1)}`).join(" ");
      FX.set(tl, "#a8-fp", { attr: { points: pts } }, tk);
      FX.set(tl, "#a8-fsh", { attr: { points: sh } }, tk);
      FX.set(tl, "#a8-fg", { attr: { x1: g.M[0], y1: g.M[1], x2: g.Q[0], y2: g.Q[1] } }, tk);
    }
    FX.set(tl, "#a8-p1", { opacity: 0 }, tF + 0.4);
    FX.set(tl, "#a8-flap", { opacity: 0 }, tF + 0.4);

    // Seite 2: links "Sparplan" und "läuft weiter ✓"
    let t2 = tF + 0.42;
    if (p2Words.length) t2 = writeSeq(p2Words, t2) + 0.04;
    t2 = draw("#a8-p2c", t2, 0.25);

    // ---------- 15 · "läuft daneben" (Tabelle: "läuft einfach daneben"): rechts "KI-Bot", dazwischen ein großes "+" ----------
    const tK = Math.max(C.daneben - 0.1, t2 - 0.15);
    const kEnd2 = write("#a8-p2kw", tK);
    draw("#a8-plus", Math.max(kEnd2 + 0.02, E.daneben - 0.3), 0.36);

    // ---------- 16 · "als Absicherung": nichts Neues, langsamer Zoom ----------
    FX.slowZoom(tl, "#a8-cam", C.absicherung, { origin: "523px 330px" });   // zoomed page stays inside the later end card (x 70–1010)

    // 17–19 · "gar nicht hinschaust", "einmal pro Woche", "20 Minuten": sagt Kilian in der Aufnahme nicht → nichts einblenden.

    // ---------- 20–23 · End-Karte (Baustein) legt sich über die Seite, ohne Platz-Chip ----------
    // "sichere dir jetzt deinen Platz": Touch-Punkt tippt auf "Mehr dazu"; "kein zweites mal" (gesprochen: "einmalig"): nichts Neues;
    // "am Sonntag, den 6. Dezember um 18 Uhr live": das Datum pulsiert bis zum Ende.
    FX.endCard(tl, "a8e", { start: C.sonntag, t18: C.t18, bot: C.bot, klick: C.platz, pulseDate: C.sonntag2 });

    window.__timelines["ad8"] = tl;
  </script>
