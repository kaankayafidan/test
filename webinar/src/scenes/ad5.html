  <script>
    const tl = gsap.timeline({ paused: true });
    // Ad 5 "Der Stuhl" — every beat from the Bildschirm-Ablauf (Briefing S. 28), times from the cues (C / E).
    const c = (n, d) => (C[n] != null ? C[n] : d);
    const OG = { smoothOrigin: false };
    const P0 = "540 640";          // Fußpunkt des echten Beins (Wackel-Achse, 1 Bein)
    const PB = "608 640";          // zwischen beiden Füßen (2 Beine)
    const tw = (el, from, to, t) => FX.tween(tl, el, from, to, t);

    const tNicht = c("nicht", 4), tAng = c("angest", 6.6), tKi = c("ki", 10.5), tGeh = c("gehalt", 13.1);
    const tAgA = c("arbeitgeber", 14.8), tAgW = c("agb", 15.4), tSaegt = c("saegt", 16.3), tGes = c("gesaegt", 20.4);
    const tInd = c("industrie", 22.5), tJobs = c("jobs", 24.7), tDesh = c("deshalb", 26.1), tZeit = c("zeit", 31.4);
    const tLern = c("lernen", 36.3), tBots = c("bots", 37.5), tKiB = c("kibots", 38.6), tBevor = c("bevor", 40);
    const tHoer = c("hoer", 43.4), tReg = c("regeln", 45.8), tArb = c("arbeite", 48.5), tSchl = c("schlafe", 49.6);
    const tStrat = c("strat", 53.3), tAktiv = c("aktiv", 54), tPass = c("passen", 55.8), tBeste = c("beste", 57);
    const tStand = c("standbein", 59.7), tKoen = c("koennen", 63.5), tKoenW = c("koennenw", 64), tWoche = c("woche", 65.8);
    const tW30 = c("woche30", 66.5), tGew = c("gewinn", 69.4), tSon = c("sonntag", 73.8);

    // ---------------------------------------------------------------- initial states
    FX.init(tl, ["#a5-p1", "#a5-p2", "#a5-p4", "#a5-p5", "#a5-dashleg", "#a5-kichip", "#a5-gehalt", "#a5-line", "#a5-bld",
      "#a5-saw", "#a5-ch1", "#a5-ch2", "#a5-ch3", "#a5-num", "#a5-src", "#a5-robo", "#a5-shadow2", "#a5-regeln", "#a5-glow",
      "#a5-clock2", "#a5-panel", "#a5-lg0", "#a5-lg2", "#a5-lg4", "#a5-lg5", "#a5-lg6", "#a5-lg7", "#a5-bookO", "#a5-bookK",
      "#a5-check", "#a5-wd0", "#a5-wd1", "#a5-wd2", "#a5-wd3", "#a5-wd4", "#a5-wd5", "#a5-wd6", "#a5-so", "#a5-min",
      "#a5-sofaScene", "#a5-book", "#a5-dim"], { opacity: 0 });
    FX.init(tl, "#a5-hh", { rotation: 225, svgOrigin: "972 104", smoothOrigin: false });
    FX.init(tl, "#a5-mh", { rotation: 180, svgOrigin: "972 104", smoothOrigin: false });

    // ---------------------------------------------------------------- derived beat times
    const tBld = Math.max(tAgW - 0.1, tAgA + 0.55);          // Gebäude ploppt bei „Arbeitgeber“
    const tLine = tBld - 0.3;                                  // Linie läuft 0,3 s davor los
    const tMove = Math.min(tAgA - 0.1, tLine - 0.45);         // Stuhl rückt nach rechts, Platz für Gebäude / Zahl
    const tSaw = tGes - 0.1, tP = tSaw + 0.3, sawEnd = tP + 1.2;
    const tFill = Math.max(tBots + 0.35, tKiB - 0.15);        // gestricheltes Bein füllt sich (Wischen von unten)
    const fillEnd = tFill + 0.5;

    // ---------------------------------------------------------------- Stuhl wackelt (0,6 s pro Schwung, ab Frame 1)
    // One continuous chain of swings; the amplitude follows the Ablauf: 6° Start, leicht bei „Solange keiner dran
    // sägt“, stark beim Sägen, nach dem KI-Bein nur noch leicht (Achse zwischen beiden Füßen), am Ende nie ganz still.
    (function () {
      const amp = (t) => (t < tKi ? 6 : t < tSaegt - 0.1 ? 5 : t < tGes - 0.7 ? 2 : t < tGes + 0.15 ? 4 : t < sawEnd ? 8 : t < tZeit ? 5 : 4);
      let t = 0, cur = -6;
      FX.init(tl, "#a5-rot", { rotation: -6, svgOrigin: P0, smoothOrigin: false });
      const sw = (to, d, o) => { tw("#a5-rot", { rotation: cur, svgOrigin: o, ...OG }, { rotation: to, svgOrigin: o, ...OG, duration: d, ease: "sine.inOut" }, t); t += d; cur = to; };
      while (t + 0.6 <= fillEnd) sw((cur < 0 ? 1 : -1) * amp(t + 0.6), 0.6, P0);
      sw(0, 0.3, P0);                                            // das KI-Bein setzt auf
      const a2 = () => (t < tStand ? 1.6 : 1.0);
      sw(-a2(), 0.3, PB);
      while (t < DUR) sw((cur < 0 ? 1 : -1) * a2(), 0.6, PB);
    })();
    // Bewegungsbögen (erstes Bild): leuchten auf der Seite, zu der der Stuhl gerade kippt.
    const nArc = Math.max(1, Math.floor((tNicht - 0.1) / 0.6));
    tw("#a5-arcL", { opacity: 1 }, { opacity: 0.15, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: nArc - 1 }, 0);
    tw("#a5-arcR", { opacity: 0.15 }, { opacity: 1, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: nArc - 1 }, 0);
    FX.fadeOut(tl, "#a5-arcs", tNicht - 0.15, 0.3);

    // ---------------------------------------------------------------- „Wahrscheinlich nicht, oder?“ / „die meisten Angestellten“
    FX.pop(tl, "#a5-p1", tNicht - 0.05, { svgOrigin: "222 420" });
    FX.fadeOut(tl, "#a5-p1", tAng - 0.1);                     // Posenwechsel: Überblenden 0,2 s
    FX.fadeIn(tl, "#a5-p2", tAng - 0.1);
    // „eine KI sein kann“: gestricheltes zweites Bein erscheint, Chip „KI“ ploppt dran
    FX.fadeIn(tl, "#a5-dashleg", tKi - 0.1, 0.25);
    FX.pop(tl, "#a5-kichip", tKi + 0.2, { svgOrigin: "754 505" });
    // „das Gehalt“: Schild am echten Bein
    FX.pop(tl, "#a5-gehalt", tGeh - 0.05, { svgOrigin: "540 514" });
    // „einem einzigen Arbeitgeber“: Stuhl rückt nach rechts, Linie läuft zum Bürogebäude
    tw("#a5-stage", { x: 0, scale: 1, svgOrigin: P0, ...OG }, { x: 260, scale: 0.92, svgOrigin: P0, ...OG, duration: 0.45, ease: "power2.inOut" }, tMove);
    FX.drawLine(tl, "#a5-line", tLine);
    FX.pop(tl, "#a5-bld", tBld, { svgOrigin: "170 520" });
    // „ordentlich gesägt“: rote Säge fliegt rein, 3× hin und her, Späne, der Stuhl wackelt stark
    FX.flyIn(tl, ["#a5-saw"], tSaw, { from: "left", dist: 760 });
    for (let i = 0; i < 3; i++) {
      tw("#a5-saw", { x: 0 }, { x: 44, duration: 0.2, ease: "sine.inOut" }, tP + i * 0.4);
      tw("#a5-saw", { x: 44 }, { x: 0, duration: 0.2, ease: "sine.inOut" }, tP + i * 0.4 + 0.2);
      FX.fadeIn(tl, "#a5-ch" + (i + 1), tP + i * 0.4 + 0.15, 0.15);
    }
    // „in der deutschen Industrie“: Fabrik-Silhouette wächst hinter dem Gebäude hoch (Wischen von unten)
    tw("#a5-facR", { attr: { y: 642, height: 0 } }, { attr: { y: 368, height: 274 }, duration: 0.45, ease: "power2.out" }, tInd - 0.05);
    // „140.000 Jobs“: Zahl ploppt groß und zählt hoch, Quelle klein darunter; Gebäude + Fabrik treten zurück
    FX.pop(tl, "#a5-num", tJobs - 0.05, { svgOrigin: "390 160" });
    tw("#a5-k", { textContent: 1 }, { textContent: 140, duration: 0.7, ease: "power2.out", snap: { textContent: 1 } }, tJobs - 0.05);
    FX.fadeIn(tl, "#a5-src", tJobs + 0.35, 0.3);
    FX.fadeOut(tl, "#a5-line", tJobs - 0.05, 0.25);
    tw(["#a5-bld", "#a5-fac"], { opacity: 1 }, { opacity: 0.25, duration: 0.3, ease: "none" }, tJobs - 0.05);
    // „Deshalb wünschen sich gerade so viele“: Säge raus, Stuhl zurück in die Mitte, das gestrichelte Bein pulsiert
    FX.flyOut(tl, "#a5-saw", tDesh - 0.05, { to: "left", dist: 900 });
    FX.fadeOut(tl, "#a5-chips", tDesh, 0.25);
    FX.fadeOut(tl, "#a5-num", tDesh - 0.05, 0.25);
    tw(["#a5-bld", "#a5-fac"], { opacity: 0.25 }, { opacity: 0, duration: 0.25, ease: "none" }, tDesh - 0.05);
    tw("#a5-stage", { x: 260, scale: 0.92, svgOrigin: P0, ...OG }, { x: 0, scale: 1, svgOrigin: P0, ...OG, duration: 0.45, ease: "power2.inOut" }, tDesh);
    FX.pulse(tl, "#a5-dash", tDesh + 0.35, Math.max(0.8, tZeit - tDesh - 0.6), { svgOrigin: "677 540" });
    FX.slowZoom(tl, "#a5-stage", tDesh + 0.5, { svgOrigin: "677 640", d: Math.min(3, Math.max(0.6, tZeit - tDesh - 0.85)) });

    // ---------------------------------------------------------------- „fehlt einfach die ZEIT“: Szenenwechsel Sofa (Pose 3), Uhr 19:30
    FX.fadeOut(tl, "#a5-chairScene", tZeit - 0.1, 0.3);
    FX.fadeIn(tl, "#a5-sofaScene", tZeit - 0.1, 0.3);
    FX.set(tl, "#a5-stage", { x: 0, scale: 1, svgOrigin: P0, smoothOrigin: false }, tZeit + 0.3);   // hidden: reset
    FX.set(tl, "#a5-gehalt", { opacity: 0 }, tZeit + 0.3);
    FX.slowZoom(tl, "#a5-sofaZoom", tZeit + 0.6, { svgOrigin: "560 640", d: Math.min(3, Math.max(0.6, tLern - tZeit - 0.9)) });
    // „trading zu lernen“: dickes Buch ploppt auf und wird zur Seite geschoben
    FX.pop(tl, "#a5-book", tLern - 0.05, { svgOrigin: "650 380" });
    tw("#a5-book", { x: 0, y: 0, rotation: 0, svgOrigin: "650 380", ...OG }, { x: 255, y: 98, rotation: -6, svgOrigin: "650 380", ...OG, duration: 0.35, ease: "power2.inOut" }, tLern + 0.55);

    // ---------------------------------------------------------------- „Und genau dafür gibt es KI-Trading-Bots“: zurück zum Stuhl
    FX.fadeOut(tl, "#a5-sofaScene", tBots - 0.1, 0.3);
    FX.fadeIn(tl, "#a5-chairScene", tBots - 0.1, 0.3);
    tw("#a5-kiclipR", { attr: { y: 644, height: 0 } }, { attr: { y: 430, height: 214 }, duration: 0.5, ease: "power1.inOut" }, tFill);
    FX.fadeIn(tl, "#a5-shadow2", tFill + 0.35, 0.3);
    FX.pop(tl, "#a5-robo", fillEnd, { svgOrigin: "677 540" });
    FX.fadeOut(tl, "#a5-kichip", fillEnd, 0.2);
    // „bevor du denkst“ … „hör mir kurz zu“: Bild dimmt auf 40 % (Kreis wächst über cues.json "kil"), keine Schrift
    tw("#a5-dim", { opacity: 0 }, { opacity: 0.6, duration: 0.3, ease: "power1.out" }, tBevor - 0.1);
    tw("#a5-dim", { opacity: 0.6 }, { opacity: 0, duration: 0.3, ease: "power1.out" }, tHoer - 0.05);
    // „nach festen Regeln“: Schild am KI-Bein
    FX.pop(tl, "#a5-regeln", tReg - 0.05, { svgOrigin: "840 550" });
    FX.fadeOut(tl, "#a5-regeln", tStrat - 0.05);
    // „während ich arbeite“: Pose 4 „mit Laptop“, das KI-Bein leuchtet sanft gelb
    FX.fadeOut(tl, "#a5-p2", tArb - 0.05);
    FX.fadeIn(tl, "#a5-p4", tArb - 0.05);
    tw("#a5-glow", { opacity: 0 }, { opacity: 0.85, duration: 0.5, ease: "power1.out" }, tArb);
    const g0 = tArb + 0.5, gReps = Math.max(1, Math.floor((DUR - g0) / 0.9));
    tw("#a5-glow", { opacity: 0.85 }, { opacity: 0.4, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: gReps - 1 }, g0);
    // „während ich schlafe“: Wanduhr ploppt klein oben rechts und dreht einmal schnell rum (kein Bett, kein Mond)
    FX.pop(tl, "#a5-clock2", tSchl - 0.05, { svgOrigin: "972 104" });
    tw("#a5-hh", { rotation: 225, svgOrigin: "972 104", ...OG }, { rotation: 585, svgOrigin: "972 104", ...OG, duration: 1.1, ease: "power2.inOut" }, tSchl + 0.2);
    tw("#a5-mh", { rotation: 180, svgOrigin: "972 104", ...OG }, { rotation: 900, svgOrigin: "972 104", ...OG, duration: 1.1, ease: "power2.inOut" }, tSchl + 0.2);
    FX.fadeOut(tl, "#a5-clock2", tBeste - 0.1);
    // „9 Trading-Strategien gerade aktiv sind“: Panel 3 × 3 erscheint, einige Lämpchen gehen grün an
    FX.fadeIn(tl, "#a5-panel", tStrat - 0.05);
    const lamp = (k) => (120 + (k % 3) * 64) + " " + (336 + Math.floor(k / 3) * 64);
    [0, 4, 2, 7, 5].forEach((k, i) => FX.pop(tl, "#a5-lg" + k, Math.max(tStrat + 0.3, tAktiv - 0.1) + i * 0.12, { svgOrigin: lamp(k) }));
    // „welche gerade nicht passen“: die anderen bleiben grau, 2 wechseln
    FX.fadeOut(tl, "#a5-lg2", tPass - 0.05);
    FX.pop(tl, "#a5-lg6", tPass + 0.15, { svgOrigin: lamp(6) });
    // „DAS beste ist also“: Pose 5 „entspannt“, schnelles Ranzoomen; „profitables Standbein“: ohne Text, zurück aufs ganze Motiv
    FX.fadeOut(tl, "#a5-p4", tBeste - 0.05);
    FX.fadeIn(tl, "#a5-p5", tBeste - 0.05);
    FX.zoomFast(tl, "#a5-cam", tBeste - 0.05, { svgOrigin: "560 300" });
    FX.zoomOut(tl, "#a5-cam", Math.max(tStand - 0.05, tBeste + 0.6), { svgOrigin: "560 300", from: 1.3 });
    // „nicht traden können“: Buch „Trading lernen“ ploppt zu, daneben ein grüner Haken
    FX.pop(tl, "#a5-bookO", tKoen - 0.05, { svgOrigin: "894 514" });
    const tShut = Math.max(tKoen + 0.45, tKoenW - 0.05);
    FX.set(tl, "#a5-bookO", { opacity: 0 }, tShut);
    FX.pop(tl, "#a5-bookK", tShut, { svgOrigin: "914 490" });
    FX.pop(tl, "#a5-check", tShut + 0.25, { svgOrigin: "748 500" });
    // „einmal pro Woche 30 Minuten“: oben die Wochenleiste, „So“ gelb mit „30 Min“
