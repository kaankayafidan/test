      <div id="a7-waitrow"><div id="a7-wait">Wartezeit übersprungen</div></div>

      <!-- G · die Aufnahme schrumpft in eine Karte; Notiz "Trading-Wissen: nicht nötig ✓"; Wochenleiste "30 Min" -->
      <div id="a7-G" class="a7-grp">
        <div id="a7-Gz" class="a7-grp">
          <div id="a7-rec-card" class="a7-rec" data-rec="card">
            <div class="a7-rec-media">
              <div class="a7-tgt" style="left:40px; top:30px; width:330px; height:64px;">Reiter</div>
              <div class="a7-tgt" style="left:30px; top:236px; width:1020px; height:104px;">dieselbe Zeile, geschlossen</div>
            </div>
            <div class="a7-pix" style="left:812px; top:256px; width:214px; height:64px;"></div>
            <div id="a7-carddim" class="a7-dim"></div>
            <div class="a7-rec-label" style="left:0; top:440px; width:1080px;">AUFNAHME FOLGT<br>Aufnahme als Karte</div>
            <div id="a7-cardrim"></div>
          </div>
          <div id="a7-note2" class="a7-note" style="left:556px; top:92px;">Trading-Wissen:<br>nicht nötig<svg class="a7-ck" viewBox="0 0 50 44"><path id="a7-ck3" pathLength="1" d="M5 25 L18 38 L46 5"/></svg></div>
          <div id="a7-week">
            <div class="a7-day" style="left:0px;">Mo</div>
            <div class="a7-day" style="left:122px;">Di</div>
            <div class="a7-day" style="left:244px;">Mi</div>
            <div class="a7-day" style="left:366px;">Do</div>
            <div class="a7-day" style="left:488px;">Fr</div>
            <div class="a7-day" style="left:610px;">Sa</div>
            <div id="a7-so" class="a7-day" style="left:732px;">So<div id="a7-ev"><div id="a7-field">30 Min</div></div></div>
          </div>
        </div>
      </div>

      <!--@include endcard p="a7e"-->
      <div id="a7-demo">DEMOKONTO</div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const $ = (s) => document.querySelector(s);
    const $$ = (s) => [...document.querySelectorAll(s)];
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    // ---------- Pixel boxes: grey mosaic, seeded, so every render is identical ----------
    function rng(seed) {
      let s = seed >>> 0;
      return () => { s = (s + 0x6d2b79f5) >>> 0; let x = s; x = Math.imul(x ^ (x >>> 15), x | 1); x ^= x + Math.imul(x ^ (x >>> 7), x | 61); return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
    }
    const PIX = ["#5B626D", "#6B7280", "#7A818C", "#8A909A", "#9AA0A9", "#ABB0B8"];
    $$("#a7-scene .a7-pix").forEach((el, k) => {
      const w = parseFloat(el.style.width), h = parseFloat(el.style.height), c = 16, r = rng(11 + 7 * k);
      let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;
      for (let y = 0; y < h; y += c) for (let x = 0; x < w; x += c) s += `<rect x="${x}" y="${y}" width="${c + 0.5}" height="${c + 0.5}" fill="${PIX[Math.floor(r() * PIX.length)]}"/>`;
      el.innerHTML = s + "</svg>";
    });

    // ---------- red circles (einkreisen, .fx-stroke 10 px): clean ellipse, ~1.06 turns from the left ----------
    function ellipse(cx, cy, rx, ry, a0 = 196, turns = 1.06, n = 96) {
      let d = "";
      for (let i = 0; i <= n; i++) {
        const a = ((a0 + (i / n) * 360 * turns) * Math.PI) / 180;
        d += `${i ? "L" : "M"}${(cx + rx * Math.cos(a)).toFixed(1)} ${(cy + ry * Math.sin(a)).toFixed(1)} `;
      }
      return d.trim();
    }
    $("#a7-c1").setAttribute("d", ellipse(540, 284, 534, 92));
    $("#a7-c2").setAttribute("d", ellipse(540, 288, 312, 124));

    // ---------- shots (harte Schnitte) ----------
    const tB = C.allein - 0.2;        // Kamerafahrt zum Algo-Trading-Button
    const tC = C.zeige;               // Reiter "Experts"
    const tD = C.vps - 0.15;          // Aufnahme dimmt, Schaubild
    const tE = C.setzt - 0.05;        // zurück auf die Aufnahme: die Zeile in halber Geschwindigkeit
    const tF = C.schliesst - 0.05;    // Wartezeit übersprungen, Reiter "Historie"
    const tG = C.heisst - 0.1;        // die Aufnahme schrumpft in eine Karte
    const GR = ["#a7-A", "#a7-B", "#a7-C", "#a7-D", "#a7-E", "#a7-F", "#a7-G"];
    GR.forEach((g, i) => FX.init(tl, g, { opacity: i === 0 ? 1 : 0 }));
    [tB, tC, tD, tE, tF, tG].forEach((t, i) => FX.cut(tl, GR[i], GR[i + 1], t));

    // ---------- 1 · "Diesen Trade hat gerade kein Mensch ausgeführt": die neue Zeile ab Frame 1, blitzt 0,3 s gelb auf,
    //               dann zieht sich der rote Kreis drum; darunter groß die Uhrzeit; Badge "Demokonto" steht von Anfang an ----------
    FX.tween(tl, "#a7-flash", { opacity: 0.92 }, { opacity: 0.2, duration: 0.3, ease: "power2.in" }, 0);
    FX.drawCircle(tl, "#a7-c1", 0.3);
    FX.slowZoom(tl, "#a7-Az", 0.85, { to: 1.05, d: Math.max(1, tB - 0.85), origin: "540px 284px" });

    // ---------- 2 · "ganz alleine eröffnet": Kamerafahrt zum grünen Algo-Trading-Button, einkreisen ----------
    FX.init(tl, "#a7-algoM", { scale: 1.3, x: 0, y: 0, transformOrigin: "0px 0px" });
    FX.tween(tl, "#a7-algoM", { scale: 1.3, x: 0, y: 0, transformOrigin: "0px 0px" }, { scale: 2.4, x: -108, y: 0, duration: 0.42, ease: "power2.inOut" }, tB + 0.02);
    FX.drawCircle(tl, "#a7-c2", tB + 0.46);

    // ---------- 3 · "ich zeige dir jetzt" (Tabelle: "ich zeig dir jetzt, wie das abläuft"): Schnitt auf den Reiter "Experts",
    //               die Zeile mit derselben Uhrzeit wird gelb markiert ----------
    FX.init(tl, ["#a7-tabE", "#a7-tabH"], { scaleX: 0, transformOrigin: "0% 50%" });
    FX.tween(tl, "#a7-tabE", { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power2.out" }, tC + 0.05);
    FX.init(tl, ["#a7-markE", "#a7-markR"], { clipPath: "inset(0% 100% 0% 0%)" });
    FX.tween(tl, "#a7-markE", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.35, ease: "power1.inOut" }, tC + 0.3);

    // ---------- 4 · "keine Ahnung von Trading hast" (Tabelle: "nichts von Trading verstehst"): Notiz "ohne Vorwissen ✓" in der Ecke ----------
    FX.init(tl, "#a7-note1", { opacity: 0 });
    FX.pop(tl, "#a7-note1", C.ahnung - 0.15, { origin: "100% 100%" });
    FX.draw(tl, "#a7-ck1", C.ahnung + 0.05, 0.25);

    // ---------- 5 · "besonders spannend für dich": Kilians Kreis 2 s auf Ø 360 (cues "kil"), die Aufnahme läuft weiter ----------
    FX.slowZoom(tl, "#a7-Cz", C.spannend, { to: 1.06, d: Math.max(1, tD - C.spannend), origin: "540px 338px" });

    // ---------- 6 · "auf einem sogenannten VPS-Server": die Aufnahme dimmt (und wird unscharf), darüber das Schaubild:
    //               links ein Laptop, rechts ein Server mit grünem Punkt, Schild "läuft" ----------
    FX.tween(tl, "#a7-bgdim", { opacity: 0 }, { opacity: 0.62, duration: 0.4, ease: "power1.out" }, tD);
    FX.tween(tl, "#a7-bgM", { filter: "blur(0px)" }, { filter: "blur(10px)", duration: 0.4, ease: "power1.out" }, tD);
    FX.init(tl, ["#a7-lap", "#a7-srv", "#a7-run", "#a7-aus"], { opacity: 0 });
    FX.pop(tl, "#a7-lap", C.vps, { svgOrigin: "238 196" });
    FX.pop(tl, "#a7-srv", C.vps + 0.12, { svgOrigin: "825 217" });
    FX.draw(tl, "#a7-linkdraw", C.vps + 0.3, 0.35);
    FX.pop(tl, "#a7-run", C.server - 0.12);
    FX.pulse(tl, "#a7-led", C.vps + 0.6, tE - C.vps - 0.6, { svgOrigin: "756 137", to: 1.7 });

    // ---------- 7 · "der Laptop aus ist" (Tabelle: "wenn mein Laptop aus ist"): der Deckel klappt zu, Schild "aus";
    //               der Server-Punkt pulsiert weiter ----------
    const tLid = C.laptop + 0.1;
    FX.tween(tl, "#a7-scrglow", { opacity: 1 }, { opacity: 0, duration: 0.15, ease: "none" }, tLid);
    FX.tween(tl, "#a7-lid", { scaleY: 1, svgOrigin: "238 276", smoothOrigin: false }, { scaleY: 0.05, svgOrigin: "238 276", smoothOrigin: false, duration: 0.35, ease: "power2.in" }, tLid);
    FX.pop(tl, "#a7-aus", C.aus - 0.05);

    // ---------- 8 · "9 Trading-Strategien": 3 × 3 Navy-Kacheln ploppen nacheinander rein ----------
    const TILES = $$("#a7-tiles .a7-tile"), LIT = TILES.map((e) => e.querySelector(".a7-lit")), FR = TILES.map((e) => e.querySelector(".a7-fr"));
    FX.init(tl, TILES, { opacity: 0 });
    FX.init(tl, FR, { opacity: 0 });
    TILES.forEach((e, i) => FX.pop(tl, e, C.neun - 0.1 + i * 0.08));

    // ---------- 9 · "abwechselnd zum Einsatz kommen": Lauflicht, die Kacheln wechseln zwischen hell und grau, 0,15 s pro Kachel ----------
    const tLL = C.abw - 0.1, SNAKE = [0, 1, 2, 5, 4, 3, 6, 7, 8];
    FX.set(tl, LIT, { opacity: 0 }, tLL);
    SNAKE.forEach((i, k) => {
      FX.set(tl, LIT[i], { opacity: 1 }, tLL + 0.15 * (k + 1));
      FX.set(tl, LIT[i], { opacity: 0 }, tLL + 0.15 * (k + 3));
    });

    // ---------- 10 · "die KI dahinter entscheidet immer wieder" (Tabelle: "eine KI entscheidet"): der Chip "KI" fährt über das
    //                Raster und rahmt 3 Kacheln gelb ein; bei "und welche nicht" wechselt die Auswahl einmal (2 andere) ----------
    const KW = 156, KH = 72, REST = [236, 561];
    const kxy = (p) => ({ x: p[0] - KW / 2, y: p[1] - KH / 2 });
    const TC = (i) => [408 + (i % 3) * 132, 475 + Math.floor(i / 3) * 86];
    FX.init(tl, "#a7-ki", { ...kxy(REST), opacity: 0 });
    const tK = C.ki - 0.15;
    FX.tween(tl, "#a7-ki", { ...kxy([-120, REST[1]]), opacity: 1 }, { ...kxy(REST), opacity: 1, duration: 0.25, ease: "power2.out" }, tK);
    let kAt = REST;
    function kMove(to, t, d) {
      FX.tween(tl, "#a7-ki", kxy(kAt), { ...kxy(to), duration: d, ease: "power2.inOut" }, t);
      kAt = to;
      return t + d;
    }
    function pick(list, t) {
      for (const i of list) {
        t = kMove(TC(i), t, 0.26);
        FX.set(tl, LIT[i], { opacity: 1 }, t - 0.04);
        FX.pop(tl, FR[i], t - 0.04);
        t += 0.06;
      }
      return kMove(REST, t, 0.32);
    }
    const SEL1 = [0, 4, 7], SEL2 = [2, 5];
    pick(SEL1, Math.max(tK + 0.3, C.ki + 0.2));
    const tSw = Math.max(C.welche - 0.1, C.ki + 1.9);
    SEL1.forEach((i) => { FX.fadeOut(tl, FR[i], tSw, 0.15); FX.set(tl, LIT[i], { opacity: 0 }, tSw + 0.15); });
    pick(SEL2, tSw + 0.05);

    // ---------- 11 · "sobald eine der aktiven Strategien läuft" (Tabelle: "alles passt"): eine eingerahmte Kachel blinkt 3× ----------
    FX.tween(tl, [LIT[5], FR[5]], { opacity: 1 }, { opacity: 0.2, duration: 0.12, ease: "none", yoyo: true, repeat: 5 }, C.laeuft - 0.15);

    // ---------- 12 · "setzt der Bot automatisch nach festen Regeln den Trade": Schnitt zurück auf die echte Aufnahme, die Zeile
    //                erscheint in halber Geschwindigkeit, gelb markiert (Pixel stehen, bevor die Zeile kommt) ----------
    const tRow = tE + 0.35;
    FX.init(tl, "#a7-pixE", { opacity: 0 });
    FX.set(tl, "#a7-pixE", { opacity: 1 }, tRow - 0.1);
    FX.tween(tl, "#a7-markR", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "power1.inOut" }, tRow);
    FX.slowZoom(tl, "#a7-Ez", tE + 0.05, { to: 1.05, d: Math.max(1, tF - tE - 0.1), origin: "540px 354px" });

    // ---------- 13 · "und schließt den Trade automatisiert wieder" (Tabelle: "wann er wieder aussteigt"): "Wartezeit übersprungen"
    //                ploppt (1,5 s), Schnitt auf den Reiter "Historie": dieselbe Zeile ist geschlossen, das Ergebnis verpixelt ----------
    FX.init(tl, "#a7-wait", { opacity: 0 });
    FX.pop(tl, "#a7-wait", tF);
    FX.fadeOut(tl, "#a7-wait", tF + 1.5);
    FX.tween(tl, "#a7-tabH", { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power2.out" }, tF + 0.1);

    // ---------- 14 · "automatisiert" (Tabelle: "100% automatisiert"): neben der geschlossenen Zeile ploppt der Chip
    //                "automatisch ✓" (nur der Haken, keine Prozentzahl) ----------
    FX.init(tl, "#a7-auto", { opacity: 0 });
    FX.pop(tl, "#a7-auto", C.auto - 0.1, { origin: "0% 50%" });
    FX.draw(tl, "#a7-ck2", C.auto + 0.1, 0.25);

    // ---------- 15 · "also nichts angefasst" (Tabelle: "absolut nichts angefasst"): ein großer gezeichneter Mauszeiger,
    //                ein rotes X knallt drauf ----------
    FX.cursor(tl, "#a7-cur", "#a7-ring", [0, 0], []);
    FX.init(tl, "#a7-curpop", { opacity: 0 });
    FX.pop(tl, "#a7-curpop", C.nichts, { origin: "50px 80px" });
    FX.init(tl, "#a7-xg", { opacity: 0 });
    FX.slam(tl, "#a7-xg", C.angefasst - 0.05, { svgOrigin: "802 478" });

    // ---------- 16 · "fasziniert mich bis heute": die Aufnahme dimmt, Kilians Kreis 2 s auf Ø 360 (cues "kil") ----------
    FX.tween(tl, "#a7-Fdim", { opacity: 0 }, { opacity: 0.6, duration: 0.4, ease: "power1.out" }, C.fasz - 0.1);

    // ---------- 17 · "was heißt das für dich?": die Aufnahme schrumpft in eine Karte (oben links) ----------
    FX.init(tl, "#a7-carddim", { opacity: 0.6 });
    FX.tween(tl, "#a7-rec-card", { scale: 1, x: 0, y: 0, borderRadius: 0, transformOrigin: "0px 0px" }, { scale: 0.44, x: 40, y: 64, borderRadius: 44, duration: 0.5, ease: "power2.inOut" }, tG + 0.04);
    FX.tween(tl, "#a7-carddim", { opacity: 0.6 }, { opacity: 0, duration: 0.5, ease: "power1.inOut" }, tG + 0.04);
    FX.fadeIn(tl, "#a7-cardrim", tG + 0.14, 0.4);

    // ---------- 18 · "nicht traden können": die Notiz "Trading-Wissen: nicht nötig ✓" ploppt ----------
    FX.init(tl, "#a7-note2", { opacity: 0 });
    FX.pop(tl, "#a7-note2", C.koennen - 0.15, { origin: "0% 0%" });
    FX.draw(tl, "#a7-ck3", C.koennen + 0.05, 0.25);
    // bis "20 bis 30 Minuten" > 4 s ohne Stichwort: langsamer Zoom
    const tZ = C.koennen + 0.9;
    FX.slowZoom(tl, "#a7-Gz", tZ, { to: 1.05, d: clamp(C.minuten - 0.3 - tZ, 1, 3), origin: "540px 330px" });

    // ---------- 19 · "20 bis 30 Minuten Zeit pro Woche" (Tabelle: "30 Minuten mit uns"): Wochenleiste mit dem Feld "30 Min" ----------
    const DAYS = $$("#a7-week .a7-day");
    FX.init(tl, DAYS, { opacity: 0 });
    DAYS.forEach((d, i) => FX.pop(tl, d, C.minuten - 0.1 + i * 0.06, { origin: "50% 100%" }));
    FX.init(tl, "#a7-ev", { opacity: 0 });
    FX.pop(tl, "#a7-ev", C.dreissig - 0.1);
    FX.pulse(tl, "#a7-ev", C.woche, clamp(C.sonntag - 0.3 - C.woche, 0.8, 1.6));

    // ---------- 20–22 · End-Karte (Baustein, ohne Platz-Chip) ab "Und am Sonntag, den 6. Dezember"; "Klick auf den Link":
    //                   der Touch-Punkt tippt auf "Mehr dazu"; das zweite "6. Dezember um 18 Uhr": das Datum pulsiert bis zum
    //                   Ende (der Ton ist nach "um 18 Uhr" hart geschnitten) ----------
    FX.fadeOut(tl, ["#a7-note2", "#a7-week"], C.sonntag - 0.1, 0.25);   // would peek out beside the card
    FX.endCard(tl, "a7e", { start: C.sonntag - 0.1, t18: C.t18, bot: C.bot, klick: C.klick, pulseDate: C.datum2 });

    window.__timelines["ad7"] = tl;
  </script>
</template>
