    // of the action-safe box (x 54–1026)
    function loop(cx, cy, a, b, n = 3, a0 = 196, turns = 1.06, N = 192) {
      let d = "";
      for (let i = 0; i <= N; i++) {
        const t = ((a0 + (i / N) * 360 * turns) * Math.PI) / 180, c = Math.cos(t), s = Math.sin(t);
        const x = cx + a * Math.sign(c) * Math.pow(Math.abs(c), 2 / n), y = cy + b * Math.sign(s) * Math.pow(Math.abs(s), 2 / n);
        d += `${i ? "L" : "M"}${x.toFixed(1)} ${y.toFixed(1)} `;

      return d.trim();

    const S1 = 0.94, S1E = 0.96;                                    // 2.553 × 0.94–0.96 = 240–245 % of the recording
    const BAND_IN = `inset(${BAND[0]}px 105px ${710 - BAND[1]}px 11px round 8px)`, OPEN = "inset(0px 0px 0px 0px round 0px)";   // = the flash band
    FX.init(tl, "#a7-pm", { clipPath: BAND_IN });
    FX.init(tl, "#a7-pz", { ...pzAt(S1), ...O, opacity: 1 });
    FX.tween(tl, "#a7-pz", { ...pzAt(S1), ...O }, { ...pzAt(S1E), ...O, duration: tZ, ease: "none" }, 0);   // langsamer Zoom ab Frame 1
    // the flash: a bright yellow outline + a yellow fill that fades to a faint tint (SELL is red: on a stronger yellow tint
    // it would lose its contrast); the yellow edge stays as the marker of the row
    FX.init(tl, "#a7-flash", { opacity: 0.24 });
    FX.tween(tl, "#a7-flash", { opacity: 0.24 }, { opacity: 0.05, duration: 0.3, ease: "power2.in" }, 0);
    FX.init(tl, "#a7-flring", { opacity: 1 });
    FX.tween(tl, "#a7-flring", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in" }, 0);
    FX.drawCircle(tl, "#a7-c1", 0.3);

    // ---------- 1b · "ganz alleine eröffnet": the circle pulses once (the bot opened it on its own; the briefing's camera move
    //                to the Algo-Trading button is replaced, that button is never shown) ----------
    FX.pulse(tl, "#a7-c1", tP, 0.8, { svgOrigin: `${ROW.cx} ${ROW.cy + 1}`, to: 1.06 });

    // ---------- 1c · "wie so etwas abläuft": zoom out - the row opens into the whole bot panel (~215 %, anchored below the
    //                motif so the Trend row stays clear of the note's corner and the badge); the circle goes (it would cross
    //                the Signal / Position rows), the row stays outlined yellow (Auswahl); then a slow push until the panel
    //                dissolves. The chart is never shown whole ----------
    const PF = at(0.84, 540, 760), PH = at(0.87, 540, 760);
    FX.tween(tl, "#a7-pz", { ...pzAt(S1E), ...O }, { ...PF, ...O, duration: dZ, ease: "power2.inOut" }, tZ);
    FX.tween(tl, "#a7-pm", { clipPath: BAND_IN }, { clipPath: OPEN, duration: dZ * 0.6, ease: "power2.inOut" }, tZ);
    FX.tween(tl, "#a7-pz", { ...PF, ...O }, { ...PH, ...O, duration: tDim + 0.45 - (tZ + dZ), ease: "none" }, tZ + dZ);
    FX.fadeOut(tl, "#a7-c1", tZ, 0.25);
    FX.tween(tl, "#a7-flring", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, tZ + 0.1);
    FX.set(tl, "#a7-mk", { opacity: 0 }, tDim + 0.5);              // gone with the panel; it does not come back in the card

    // ---------- 2 · "keine Ahnung von Trading hast": Notiz "ohne Vorwissen ✓" ploppt in der Ecke ----------
    FX.init(tl, "#a7-note1", { opacity: 0 });
    FX.pop(tl, "#a7-note1", C.ahnung - 0.15, { origin: "0% 0%" });
    FX.draw(tl, "#a7-ck1", C.ahnung + 0.05, 0.25);

    // ---------- 3 · "besonders spannend für dich": Kilians Kreis 2 s groß (cues "kil"), die Aufnahme läuft weiter ----------

    // ---------- "So ein KI-Trading-Bot läuft": the note goes, the panel keeps pushing ----------
    FX.fadeOut(tl, "#a7-note1", Math.max(C.kibot - 0.05, C.ahnung + 1.5), 0.2);

    // ---------- 4 · "sogenannten VPS-Server": the panel dissolves into the recording's chart (blurred, 180 %, right part
    //               only), dimmed; darüber das Schaubild: links ein Laptop, rechts ein Server mit grünem Punkt, Schild "läuft".
    //               The chart drifts slowly (180 → 195 %) until the card, so the backdrop never stands still ----------
    const SC = at(1.8, 1080, 355), SC2 = at(1.95, 1080, 355);   // anchored at the right edge: the panel (x <= 463) stays out
    FX.init(tl, "#a7-sz", { ...SC, ...O, opacity: 0 });
    FX.set(tl, "#a7-sz", { opacity: 1 }, tDim);                 // beneath the still opaque panel close-up
    FX.tween(tl, "#a7-sz", { ...SC, ...O }, { ...SC2, ...O, duration: tG - tDim, ease: "none" }, tDim);
    FX.tween(tl, "#a7-pz", { opacity: 1 }, { opacity: 0, duration: 0.45, ease: "power1.inOut" }, tDim);
    FX.init(tl, "#a7-dim", { opacity: 0 });
    FX.tween(tl, "#a7-dim", { opacity: 0 }, { opacity: 0.66, duration: 0.45, ease: "power1.out" }, tDim);
    FX.init(tl, ["#a7-lap", "#a7-srv", "#a7-run", "#a7-aus"], { opacity: 0 });
    FX.pop(tl, "#a7-lap", C.sog, { svgOrigin: "238 196" });
    FX.pop(tl, "#a7-srv", C.vps - 0.1, { svgOrigin: "825 217" });
    FX.init(tl, "#a7-link", { opacity: 0 });
    FX.set(tl, "#a7-link", { opacity: 1 }, C.vps + 0.1);
    FX.draw(tl, "#a7-linkdraw", C.vps + 0.1, 0.35);
    FX.pop(tl, "#a7-run", C.vps + 0.25);
    const tPulse = C.vps + 0.45;
    FX.pulse(tl, "#a7-led", tPulse, tFlow - tPulse - 0.1, { svgOrigin: "756 137", to: 1.7 });

    // ---------- 5 · "der Laptop aus ist": der Deckel klappt zu, Schild "aus"; der Server-Punkt pulsiert weiter ----------
    const tLid = C.laptop + 0.08;
    FX.tween(tl, "#a7-scrglow", { opacity: 1 }, { opacity: 0, duration: 0.15, ease: "none" }, tLid);
    FX.tween(tl, "#a7-lid", { scaleY: 1, svgOrigin: "238 276", smoothOrigin: false }, { scaleY: 0.05, svgOrigin: "238 276", smoothOrigin: false, duration: 0.35, ease: "power2.in" }, tLid);
    FX.pop(tl, "#a7-aus", C.aus - 0.05);

    // ---------- 6 · "9 Trading-Strategien": 3 × 3 Navy-Kacheln ploppen nacheinander rein ----------
    const TILES = $$("#a7-tiles .a7-tile"), LIT = TILES.map((e) => e.querySelector(".a7-lit")), FR = TILES.map((e) => e.querySelector(".a7-fr"));
    FX.init(tl, TILES, { opacity: 0 });
    FX.init(tl, LIT, { opacity: 0 });
    FX.init(tl, FR, { opacity: 0 });
    TILES.forEach((e, i) => FX.pop(tl, e, C.neun - 0.1 + i * 0.08));

    // ---------- 7 · "die abwechselnd zum Einsatz kommen": Lauflicht, immer genau eine Kachel 0,15 s hell, dann wieder Navy ----------
    const SNAKE = [0, 1, 2, 5, 4, 3, 6, 7, 8];
    SNAKE.forEach((i, k) => {
      FX.set(tl, LIT[i], { opacity: 1 }, C.abw + 0.15 * k);
      FX.set(tl, LIT[i], { opacity: 0 }, C.abw + 0.15 * (k + 1));
    });

    // ---------- 8 · "die KI dahinter entscheidet immer wieder": der Chip "KI" fährt über das Raster und rahmt 3 Kacheln gelb ein;
    //               "eingesetzt": die drei pulsieren einmal; "und welche nicht": die Auswahl wechselt einmal (2 andere) ----------
    const KW = 156, KH = 72, REST = [236, 561];
    const kxy = (p) => ({ x: p[0] - KW / 2, y: p[1] - KH / 2 });
    const TC = (i) => [408 + (i % 3) * 132, 475 + Math.floor(i / 3) * 86];
    FX.init(tl, "#a7-ki", { ...kxy(REST), opacity: 0 });
    const tK = C.ki - 0.15;
    FX.tween(tl, "#a7-ki", { ...kxy([-120, REST[1]]), opacity: 1 }, { ...kxy(REST), opacity: 1, duration: 0.25, ease: "power2.out" }, tK);
    let kAt = REST;
    function kMove(to, t, d) {
      FX.tween(tl, "#a7-ki", kxy(kAt), { ...kxy(to), duration: d, ease: "power2.inOut" }, t);
      kAt = to;
      return t + d;
    }
    function pick(list, t) {
      for (const i of list) {
        t = kMove(TC(i), t, 0.26);
        FX.set(tl, LIT[i], { opacity: 1 }, t - 0.04);
        FX.pop(tl, FR[i], t - 0.04);
        t += 0.06;
      }
      return kMove(REST, t, 0.32);
    }
    const SEL1 = [0, 4, 7], SEL2 = [2, 5], ACT = 5;
    const sel1End = pick(SEL1, Math.max(tK + 0.3, C.ki + 0.2));
    const tEin = Math.max(C.eingesetzt, sel1End + 0.1);
    SEL1.forEach((i) => FX.pulse(tl, TILES[i], tEin, 0.8));
    const tSw = Math.max(C.welche - 0.1, tEin + 0.9);
    SEL1.forEach((i) => { FX.fadeOut(tl, FR[i], tSw, 0.15); FX.set(tl, LIT[i], { opacity: 0 }, tSw + 0.15); });
    pick(SEL2, tSw + 0.05);

    // ---------- 9 · "sobald eine der aktiven Strategien läuft": eine eingerahmte Kachel blinkt 3× ----------
    FX.tween(tl, [LIT[ACT], FR[ACT]], { opacity: 1 }, { opacity: 0.15, duration: 0.2, ease: "none", yoyo: true, repeat: 5 }, C.sobald);

    // ---------- 10 · "setzt der Bot automatisch nach festen Regeln den Trade": Schaubild 2 (klar gezeichnet, auf fast
    //                Schwarz: the recording dims further, nothing real under the drawing). Laptop, Server, Chip and the 8 other
    //                tiles go; only the running tile stays (lit and framed) and moves left; from it an arrow to "Einstieg ✓" ----------
    FX.fadeOut(tl, ["#a7-lap", "#a7-srv", "#a7-link", "#a7-run", "#a7-aus", "#a7-ki"], tFlow, 0.25);
    FX.fadeOut(tl, TILES.filter((_, i) => i !== ACT), tFlow, 0.2);
    FX.tween(tl, "#a7-dim", { opacity: 0.66 }, { opacity: 0.88, duration: 0.3, ease: "power1.out" }, tFlow);
    const GO = { transformOrigin: "540px 561px" }, GS = 1.1;
    const GT = { x: 190 - 540 - (672 - 540) * GS, y: 300 - 561, scale: GS };   // running tile (centre 672, 561) → (190, 300)
    FX.tween(tl, "#a7-tiles", { x: 0, y: 0, scale: 1, ...GO }, { ...GT, ...GO, duration: 0.45, ease: "power2.inOut" }, tFlow);
    FX.init(tl, ["#a7-in", "#a7-out", "#a7-auto", "#a7-curpop", "#a7-xg"], { opacity: 0 });
    const tA1 = tFlow + 0.45;
    FX.draw(tl, "#a7-ar1", tA1, 0.3);
    FX.pop(tl, "#a7-in", tA1 + 0.25);
    FX.draw(tl, "#a7-ck-in", tA1 + 0.42, 0.25);

    // ---------- 11 · "schließt den Trade automatisiert wieder": Pfeil zur Kachel "Ausstieg ✓", dann der Chip "automatisch ✓"
    //                (nur der Haken, keine Prozentzahl). "also nichts angefasst": ein großer gezeichneter Mauszeiger, ein rotes X
    //                knallt drauf (stamp on "nichts") ----------
    const tA2 = Math.max(C.schliesst - 0.1, tA1 + 1.2);
    FX.draw(tl, "#a7-ar2", tA2, 0.25);
    FX.pop(tl, "#a7-out", tA2 + 0.2);
    FX.draw(tl, "#a7-ck-out", tA2 + 0.37, 0.25);
    const tAu = Math.max(C.autom - 0.1, tA2 + 0.6);
    FX.pop(tl, "#a7-auto", tAu);
    FX.draw(tl, "#a7-ck-auto", tAu + 0.17, 0.25);
    const tX = Math.min(Math.max(C.angefasst, tAu + 0.6), tF - 0.6);
    FX.cursor(tl, "#a7-cur", "#a7-ring", [0, 0], []);
    FX.pop(tl, "#a7-curpop", tX - 0.38, { origin: "30% 40%" });
    FX.slam(tl, "#a7-xg", tX, { svgOrigin: "177 505" });

    // ---------- 12 · "fasziniert mich bis heute": das Schaubild geht, die Aufnahme dimmt (noch dunkler; the panel does not come
    //                back right after the drawn exit), Kilians Kreis 2 s groß (cues "kil") ----------
    FX.fadeOut(tl, ["#a7-tiles", "#a7-flow"], tF, 0.3);
    FX.tween(tl, "#a7-dim", { opacity: 0.88 }, { opacity: 0.94, duration: 0.5, ease: "power1.inOut" }, tF);

    // ---------- 13 · "was heißt das für dich?": die Aufnahme schrumpft in eine Karte (links, vertikal mittig); in der Karte
    //                das Bot-Panel live (a7-panel, same real moment), no chart ----------
    const CARD = { x: 90, y: 213, scale: 0.4 };
    FX.init(tl, "#a7-cam", { x: 0, y: 0, scale: 1, borderRadius: 0, ...O });
    FX.tween(tl, "#a7-cam", { x: 0, y: 0, scale: 1, borderRadius: 0, ...O }, { ...CARD, borderRadius: 110, ...O, duration: 0.5, ease: "power2.inOut" }, tG);
    FX.init(tl, "#a7-rim", { opacity: 0, borderRadius: 0 });
    FX.tween(tl, "#a7-rim", { opacity: 0, borderRadius: 0 }, { opacity: 1, borderRadius: 110, duration: 0.5, ease: "power2.inOut" }, tG);
    FX.tween(tl, "#a7-dim", { opacity: 0.94 }, { opacity: 0, duration: 0.5, ease: "power1.inOut" }, tG);
    FX.set(tl, "#a7-pz", { ...at(0.88), ...O }, tG);           // margin: no text under the card's round corners or rim
    FX.tween(tl, "#a7-pz", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, tG);

    // ---------- 14 · "nicht traden können": Notiz "Trading-Wissen: nicht nötig ✓" ploppt ----------
    FX.init(tl, "#a7-note2", { opacity: 0 });
    FX.pop(tl, "#a7-note2", C.koennen - 0.15, { origin: "0% 0%" });
    FX.draw(tl, "#a7-ck2", C.koennen + 0.05, 0.25);
    // bis "20 bis 30 Minuten" > 4 s ohne Stichwort: langsamer Zoom 100 → 108 % über 3 s auf Karte und Notiz (one camera
    // move about the motif point between them)
    const tZc = C.koennen + 0.9, dZc = clamp(C.minuten - 0.3 - tZc, 1, 3), ZP = [540, 355], ZS = 1.08;
    const n2 = $("#a7-note2");
    FX.slowZoom(tl, "#a7-recz", tZc, { to: ZS, d: dZc, origin: `${ZP[0]}px ${ZP[1]}px` });
    FX.slowZoom(tl, "#a7-note2", tZc, { to: ZS, d: dZc, origin: `${ZP[0] - n2.offsetLeft}px ${ZP[1] - n2.offsetTop}px` });

    // ---------- 15 · "20 bis 30 Minuten Zeit pro Woche": Karte und Notiz gleiten nach oben, darunter die Wochenleiste
    //                mit dem Feld "30 Min" ----------
    const tUp = C.minuten - 0.45, UP = 126;
    FX.tween(tl, "#a7-cam", { ...CARD, ...O }, { ...CARD, y: CARD.y - UP, ...O, duration: 0.4, ease: "power2.inOut" }, tUp);
    FX.tween(tl, "#a7-note2", { y: 0 }, { y: -UP * ZS, duration: 0.4, ease: "power2.inOut" }, tUp);
    const DAYS = $$("#a7-week .a7-day");
    FX.init(tl, DAYS, { opacity: 0 });
    DAYS.forEach((d, i) => FX.pop(tl, d, C.minuten - 0.1 + i * 0.06, { origin: "50% 100%" }));
    FX.init(tl, "#a7-ev", { opacity: 0 });
    FX.pop(tl, "#a7-ev", C.dreissig - 0.1);
    FX.pulse(tl, "#a7-ev", C.woche, clamp(C.sonntag - 0.3 - C.woche, 0.8, 1.6));

    // ---------- 16 · End-Karte (Baustein, ohne Platz-Chip) ab "am Sonntag", baut sich mit dem Satz auf; "für dich nutzen":
    //                "Mehr dazu" pulsiert einmal (sonst > 4 s ohne Neues); "Deswegen klick auf den Link": der Touch-Punkt
    //                tippt auf "Mehr dazu"; das zweite "am Sonntag": das Datum pulsiert bis zum Ende (der Schluss ist in der
    //                Aufnahme vollständig, also bleibt er drin - Briefing S. 34). The card sits at y 74 (badge y 8–60 stays
    //                clear above it); card, note and Wochenleiste go once the opaque card covers them. ----------
    const tEnd = C.sonntag - 0.12;
    // the date pulse counts whole 0.8 s beats: start it so that the last beat ends 0.1 s before the end (no still card)
    const tDatePulse = DUR - 0.1 - 0.8 * Math.floor((DUR - 0.1 - C.sonntag2) / 0.8) - 0.001;
    FX.endCard(tl, "a7e", { start: tEnd, t18: C.t18, bot: C.bot, klick: C.klick, pulseDate: tDatePulse });
    FX.pulse(tl, "#a7e-btn", C.nutzen, 0.8, { origin: "0% 50%", to: 1.05 });
    FX.fadeOut(tl, ["#a7-note2", "#a7-week", "#a7-recz"], tEnd + 0.3, 0.2);

    window.__timelines["ad7"] = tl;
  </script>
</template>
