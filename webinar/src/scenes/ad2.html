  <script>
    const tl = gsap.timeline({ paused: true });
    const $ = (s) => document.querySelector(s);
    const on = (el, t) => tl.set(el, { opacity: 1 }, t);
    const off = (el, t) => tl.set(el, { opacity: 0 }, t);
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const mk = (tag, attrs, parent) => { const e = document.createElementNS("http://www.w3.org/2000/svg", tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };

    // ---- static build: counter strip 1989 ... 2024, calendar cells
    const strip = $("#a2-cnt-strip");
    for (let y = 1989; y <= 2024; y++) { const d = document.createElement("div"); d.className = "a2-yr" + (y > 1989 && y < 2024 ? " bl" : ""); d.textContent = y; strip.appendChild(d); }
    const cal = $("#a2-cal"), cells = [];
    for (let i = 0; i < 12; i++) {
      const c = document.createElement("div");
      c.className = "a2-cell";
      c.style.left = 18 + (i % 4) * 62 + "px";
      c.style.top = 66 + Math.floor(i / 4) * 58 + "px";
      const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      s.setAttribute("viewBox", "0 0 40 40");
      const p = mk("path", { d: "M7 21 L16 30 L33 10", fill: "none", stroke: "#16A34A", "stroke-width": "7", "stroke-linecap": "round", "stroke-linejoin": "round" }, s);
      p.id = "a2-chk" + i;
      c.appendChild(s);
      cal.appendChild(c);
      cells.push(p);
    }

    document.querySelectorAll(".a2-later").forEach((el) => FX.init(tl, el, { opacity: 0 }));
    cells.forEach((p) => FX.init(tl, p, { opacity: 0 }));

    // ---- 1 "Siehst du diese Rolltreppe?": Clip A, der rote Kreis zieht sich in 0,5 s (offenes Ende, sichtbar ab Frame 1)
    FX.tween(tl, "#a2-ring", { strokeDashoffset: 0.86, opacity: 1 }, { strokeDashoffset: 0, duration: 0.5, ease: "power1.inOut", autoRound: false }, 0);
    FX.fadeOut(tl, "#a2-ringsvg", C.problem);

    // ---- 2 "dein ETF" ploppt auf eine Stufe und fährt mit (rechte Rolltreppe; Perspektive: Abstand zur Fluchtlinie
    // D = y + 469 px, Breite ~ D, Stufentempo K * D^2 px/s). Anker = Fußpunkt des Schilds (x 512.9, y 480).
    const K = 2.125e-5, D0 = 949.2, AX = 512.9, AY = 480;
    const pose = (D) => ({ x: 0.122 * (D - D0), y: D - D0, scale: D / D0 });
    const segsEtf = [[C.etf, C.problem, 1], [C.problem, C.problem + 0.3, 0], [C.problem + 0.3, C.rueck, 1], [C.rueck, C.rueck + 0.5, -8], [C.rueck + 0.5, C.japan, -1]];
    const rideD = (t) => { let D = D0; for (const [a, b, v] of segsEtf) { if (t <= a) break; D = 1 / (1 / D + K * v * (Math.min(t, b) - a)); } return D; };
    FX.init(tl, "#a2-etf", { x: 0, y: 0, scale: 1, transformOrigin: "50% 100%" });
    for (const [a, b, v] of segsEtf) {
      if (!v || b <= a) continue;
      const n = Math.max(1, Math.ceil((b - a) / 0.8));
      for (let i = 0; i < n; i++) {
        const t0 = a + ((b - a) * i) / n, t1 = a + ((b - a) * (i + 1)) / n;
        FX.tween(tl, "#a2-etf", { ...pose(rideD(t0)), transformOrigin: "50% 100%" }, { ...pose(rideD(t1)), duration: t1 - t0, ease: "none", transformOrigin: "50% 100%" }, t0);
      }
    }
    on("#a2-etf", C.etf);
    FX.pop(tl, "#a2-etf-in", C.etf, { origin: "50% 100%" });
    FX.fadeIn(tl, "#a2-etf-shadow", C.etf, 0.15);

    // ---- 3 "das größte Problem": das Bild friert 0,3 s ein (Standbild), ein roter Rahmen blitzt 2x
    [[0, 1], [0.12, 0], [0.22, 1], [0.34, 0]].forEach(([d, o]) => tl.set("#a2-flash", { opacity: o }, C.problem + d));

    // ---- 4 "was deine KI damit zu tun hat": Clip C fliegt rechts mit 60 % rein, Chip "KI?" ploppt dran, nach 1,5 s weg
    FX.flyIn(tl, "#a2-ki", C.ki, { from: "right", dist: 520 });
    FX.pop(tl, "#a2-ki-chip", C.kiw);
    FX.flyOut(tl, "#a2-ki", C.kiw + 1.5, { to: "right", dist: 520 });
    off("#a2-ki", C.kiw + 1.75);

    // ---- 5 "solange die Kurse an den Börsen steigen": neben der Rolltreppe wächst ein grüner Pfeil nach oben
    const dGrow = clamp(C.steigenw - C.steigen, 0.5, 1.3);
    on("#a2-arr1", C.steigen);
    FX.tween(tl, "#a2-arr1-shaft", { scaleY: 0, svgOrigin: "70 400" }, { scaleY: 1, svgOrigin: "70 400", duration: dGrow, ease: "power2.out" }, C.steigen);
    FX.tween(tl, "#a2-arr1-head", { y: 288 }, { y: 0, duration: dGrow, ease: "power2.out" }, C.steigen);

    // ---- 6 "ganz bequem nach oben": langsamer Zoom auf das Schild (bis zum Rückspulen)
    const zD = clamp(C.rueck - C.bequem, 0.5, 3), zTo = 1 + 0.08 * (zD / 3);
    const zOrigin = `${(AX + pose(rideD(C.bequem)).x).toFixed(1)}px ${(AY + pose(rideD(C.bequem)).y - 40).toFixed(1)}px`;
    FX.slowZoom(tl, "#a2-shotA", C.bequem, { origin: zOrigin, to: zTo, d: zD });

    // ---- 7 "läuft die Rolltreppe mal rückwärts": Rückspul-Effekt 0,5 s (auch der Zoom spult zurück), dann Clip A
    // rückwärts; der Pfeil dreht auf Rot nach unten
    FX.tween(tl, "#a2-shotA", { scale: zTo, transformOrigin: zOrigin }, { scale: 1, transformOrigin: zOrigin, duration: 0.5, ease: "power2.inOut" }, C.rueck);
    FX.tween(tl, "#a2-arr1", { rotationX: 0, transformPerspective: 900, transformOrigin: "50% 50%" }, { rotationX: 180, transformPerspective: 900, transformOrigin: "50% 50%", duration: 0.4, ease: "power2.inOut" }, C.rueck);
    FX.init(tl, ".a2-af", { fill: "#16A34A" });
    tl.set(".a2-af", { fill: "#DC2626" }, C.rueck + 0.2);  // Farbwechsel in der Mitte der Drehung (kein Braun)

    // ---- 8 "eine Menge Knete": der rote Pfeil pulsiert (kein Geld im Bild)
    FX.pulse(tl, "#a2-arr1-p", C.knete, clamp(C.japan - C.knete - 0.2, 0.8, 2.4), { svgOrigin: "70 200" });

    // ---- 9 "wie lange auch ETF-Kurse fallen können": das Schild gleitet mit der Rolltreppe nach unten (segsEtf)
    // ---- 10 "zeigt Japan": harter Schnitt auf Clip B, das Schild "Japan" fliegt rein
    ["#a2-etf", "#a2-arr1", "#a2-ringsvg"].forEach((s) => off(s, C.japan));
    FX.flyIn(tl, "#a2-japan", C.japanw, { from: "left", dist: 420 });

    // ---- 11 "sage und schreibe 34 Jahre": "2024" ploppt groß und zählt hoch (alte Zahl unscharf darüber),
    // dann knallt der Stempel "34 Jahre" 8° schräg drauf; bei "Hoch von 1989" klein "Nikkei 225"
    FX.pop(tl, "#a2-cnt", C.jahre);
    const dRoll = clamp(C.stamp - C.jahre - 0.12, 0.45, 1.2);
    FX.tween(tl, "#a2-cnt-strip", { y: 0 }, { y: -35 * 210, duration: dRoll, ease: "power2.inOut" }, C.jahre + 0.05);
    FX.slam(tl, "#a2-stamp", C.stamp, { rotation: -8 });
    FX.slowZoom(tl, "#a2-shotB", C.stamp + 0.3, { origin: "560px 360px" });
    FX.pop(tl, "#a2-nikkei", C.hoch, { origin: "0% 50%" });

    // ---- 12 "Japan ist ein Extremfall": Schild "Extremfall" ploppt in die Ecke ("Japan" fliegt raus, max. 5 Elemente)
    FX.flyOut(tl, "#a2-japan", C.extrem, { to: "left", dist: 420 });
    off("#a2-japan", C.extrem + 0.25);
    FX.pop(tl, "#a2-extrem", C.extrem, { origin: "100% 0%" });

    // ---- 13 "ein Sparplan kauft immer günstiger nach": unten links 1,5 s Mini-Kalender, 12 Häkchen ploppen nacheinander
    FX.fadeOut(tl, "#a2-nikkei", C.sparplan, 0.15);
    FX.pop(tl, "#a2-cal", C.sparplan, { origin: "0% 100%" });
    cells.forEach((p, i) => FX.pop(tl, p, C.sparplan + 0.15 + i * 0.08, { svgOrigin: "20 20" }));
    FX.fadeOut(tl, "#a2-cal", C.sparplan + 1.5);

    // ---- 14 "in der einzigen Richtung": Schnitt zurück auf Clip A vorwärts, ein großer Pfeil nach oben
    ["#a2-cnt", "#a2-stamp", "#a2-extrem"].forEach((s) => off(s, C.richtung));
    on("#a2-arr2", C.richtung);
    FX.tween(tl, "#a2-arr2-shaft", { scaleY: 0, svgOrigin: "130 580" }, { scaleY: 1, svgOrigin: "130 580", duration: 0.5, ease: "power2.out" }, C.richtung);
    FX.tween(tl, "#a2-arr2-head", { y: 394 }, { y: 0, duration: 0.5, ease: "power2.out" }, C.richtung);

    // ---- 15 "nämlich nach oben": Schild "nur 1 Richtung" knallt drauf
    on("#a2-nur", C.oben);
    FX.slam(tl, "#a2-nur-in", C.oben);
    ["#a2-arr2", "#a2-nur"].forEach((s) => off(s, C.loesung));

    // ---- 16 "das ist die Lösung, nämlich der KI-Trading-Bot": harter Schnitt auf Clip C, an der Kabine das Schild
    // (es fährt mit der Kabine; Kabinen-Spur aus dem Clip, Quelle = 0,3 s + Zeit seit dem Schnitt)
    const TR = [[0, 664, 316], [1.25, 664, 314], [1.5, 664, 310], [1.75, 664, 303], [2, 663, 293], [2.25, 662, 279], [2.5, 661, 265], [2.75, 660, 249], [3, 659, 236], [3.25, 658, 221], [3.5, 657, 208], [3.75, 656, 193], [4, 655, 180], [4.25, 654, 166], [4.5, 653, 154], [4.75, 652, 140], [5, 651, 128], [5.25, 650, 115], [5.5, 649, 103], [5.75, 648, 90], [6, 647, 79], [6.25, 646, 67], [6.5, 645, 56], [6.75, 644, 44], [7, 644, 33]];
    const cab = (s) => { let i = 0; while (i < TR.length - 2 && TR[i + 1][0] < s) i++; const [a, x1, y1] = TR[i], [b, x2, y2] = TR[i + 1]; const f = clamp((s - a) / (b - a), 0, 1); return [(x1 + (x2 - x1) * f + 25 - 240) * 1.5, (y1 + (y2 - y1) * f + 32 - 60) * 1.5]; };
    const srcC1 = (t) => 0.3 + t - C.loesung;
    const [kx0, ky0] = [673.5, 432];
    const kEnd = C.profite1 - 0.05;
    FX.init(tl, "#a2-kib", { x: 0, y: 0 });
    for (let t = C.kibot; t < kEnd - 0.01; t += 0.25) {
      const t1 = Math.min(kEnd, t + 0.25), [xa, ya] = cab(srcC1(t)), [xb, yb] = cab(srcC1(t1));
      FX.tween(tl, "#a2-kib", { x: xa - kx0, y: ya - ky0 }, { x: xb - kx0, y: yb - ky0, duration: t1 - t, ease: "none" }, t);
    }
    on("#a2-kib", C.kibot);
    FX.pop(tl, "#a2-kib-in", C.kibot);

    // ---- 17 "in solchen Marktphasen": die Kabine fährt ruhig weiter, langsamer Zoom
    const [zx, zy] = cab(srcC1(C.phasen + 1.5));
    FX.slowZoom(tl, "#a2-shotC1", C.phasen, { origin: `${zx.toFixed(1)}px ${zy.toFixed(1)}px` });
    // "auch wirklich Profite generieren": keine Schrift -> das Schild ist vorher weg
    FX.fadeOut(tl, "#a2-kib", C.profite1 - 0.25);

    // ---- 18/19 BAUSTEIN Mitte-CTA: Chip bei "Live-Webinar", Button bei "Klick", fliegt nach dem Satz raus (Szene läuft ruhig)
    FX.midCta(tl, "a2m", { live: C.live, klick: C.klick, out: E.ctaend });
    // (20 "Dieser Bot Trader automatisiert" und 21 "ohne Vorwissen" sind in der geschnittenen Aufnahme nicht gesprochen.)

    // ---- 22 "besser als ein ETF-Depot?": Split-Screen, links Clip A, rechts Clip C, in der Mitte "vs."
    on("#a2-divl", C.vs);
    FX.pop(tl, "#a2-vs", C.vs);
    const szD = clamp(C.selbst - E.vs - 0.1, 0.5, 3);
    FX.slowZoom(tl, "#a2-split", E.vs, { origin: "540px 355px", to: 1 + 0.08 * (szD / 3), d: szD });
    tl.set("#a2-split", { scale: 1 }, C.selbst);

    // ---- 23 "der sich die Richtung selbst aussucht": rechts Schnitt auf Clip D, Pfeil hoch leuchtet gelb, dann runter
    on("#a2-D", C.selbst);
    on("#a2-Dup", C.selbstw);
    off("#a2-Dup", C.selbstd);
    on("#a2-Ddn", C.selbstd);
    off("#a2-Ddn", Math.min(C.selbstd + 0.8, C.gold - 0.1));

    // ---- 24 "tradet zum Beispiel mit Gold": neben der Anzeige ploppt der Chip "Gold" (kein Goldbarren)
    FX.pop(tl, "#a2-gold", C.gold, { origin: "0% 50%" });

    // ---- 25 "bei fallenden Kursen": der Pfeil nach unten leuchtet und pulsiert; vor "profitieren" keine Schrift mehr
    on("#a2-Ddn", C.fallend);
    FX.pulse(tl, "#a2-Ddn-p", C.fallend, clamp(C.jede - C.fallend - 0.1, 0.8, 2.4), { svgOrigin: "115 315" });
    FX.fadeOut(tl, "#a2-gold", C.profitieren - 0.25);
    FX.fadeOut(tl, "#a2-vs", C.profitieren - 0.25);

    // ---- 26 "Er profitiert quasi von jeder Marktphase": beide Pfeile leuchten abwechselnd, keine Schrift
    for (let t = C.jede, k = 0; t < C.verkaufen - 0.1; t += 0.4, k++) {
      tl.set("#a2-Dup", { opacity: k % 2 ? 0 : 1 }, t);
      tl.set("#a2-Ddn", { opacity: k % 2 ? 1 : 0 }, t);
    }

    // ---- 27 "jetzt nicht verkaufen": zurück im Split-Screen (Aufzug + kleine Anzeige mit "Gold"), über der Rolltreppe "bleibt ✓"
    off("#a2-D", C.verkaufen);
    ["#a2-vs", "#a2-mini", "#a2-gold2"].forEach((s) => on(s, C.verkaufen));
    on("#a2-bleibt", C.verkaufenw);
    FX.pop(tl, "#a2-bleibt-in", C.verkaufenw, { origin: "50% 50%" });

    // ---- 28 "ein anderer Ansatz": das "vs." dreht sich zu "+"
    const tA = C.ansatz - 0.2;
    FX.tween(tl, "#a2-vs", { rotation: 0, transformOrigin: "50% 50%" }, { rotation: 180, transformOrigin: "50% 50%", duration: 0.4, ease: "power2.inOut" }, tA);
    FX.fadeOut(tl, "#a2-vs-t", tA, 0.18);
    FX.fadeIn(tl, "#a2-plus", tA + 0.2, 0.18);

    // ---- 29 "Er kann nämlich profitieren": Clip C fährt im Wechsel hoch und runter, keine Schrift
    ["#a2-divl", "#a2-vs", "#a2-mini", "#a2-gold2", "#a2-bleibt"].forEach((s) => off(s, C.profite));

    // ---- 30-32 BAUSTEIN End-Karte ab "am Sonntag" ("18 Uhr", Unterzeile, Touch-Punkt bei "klick"). Den Platz-Chip gibt
    // es nur, wenn Kilian die Zahl sagt: "bis zu 15 Leute" fehlt in der geschnittenen Aufnahme -> der Chip bleibt aus.
    FX.endCard(tl, "a2e", { start: C.sonntag, t18: C.uhr18, bot: C.bot, klick: C.klick2, platz: C.platz ?? null, pulseDate: C.schnell });

    // ---- Filmkorn: Korn-Kachel springt alle 2 Frames (deterministisch)
    for (let i = 0, t = 0; t < DUR; i++, t += 2 / 30) {
      const h = Math.imul(i + 1, 2654435761) >>> 0;
      tl.set("#a2-grain", { backgroundPosition: `${h % 384}px ${(h >>> 9) % 384}px` }, t);
    }

    window.__timelines["ad2"] = tl;
  </script>
</template>
