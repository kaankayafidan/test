  <script>
    const tl = gsap.timeline({ paused: true });
    const $ = (s) => document.querySelector(s);
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    // 620-%-Satz gesprochen? (Ad 3 ja, Ad 3 B nein: dann fallen die rot markierten Zeilen weg)
    const P620 = C.halte != null && C.p620 != null;

    // ---- DOM (deterministisch): Tastatur, getippte Zeilen als einzelne Zeichen ----
    for (const row of ["QWERTZUIOPÜ", "ASDFGHJKLÖÄ", "*YXCVBNM*", "*_*"]) {
      const r = document.createElement("div");
      r.className = "a3-kr";
      for (const ch of row) {
        const k = document.createElement("div");
        k.className = "a3-k" + (ch === "*" ? " w" : ch === "_" ? " sp" : "");
        if (ch !== "*" && ch !== "_") k.textContent = ch;
        r.appendChild(k);
      }
      $("#a3-kbd").appendChild(r);
    }
    function chars(sel) {
      const el = $(sel), cur = el.querySelector(".a3-cur"), out = [];
      for (const ch of el.getAttribute("data-text")) {
        const s = document.createElement("span");
        s.textContent = ch;
        el.insertBefore(s, cur);
        out.push(s);
      }
      return out;
    }
    const B1 = chars("#a3-b1t"), B2 = chars("#a3-b2t"), C1 = chars("#a3-c1t");
    // "es tippt sich": Zeichen für Zeichen, der Cursor wandert mit
    function typeLine(list, t0, t1) {
      const dt = clamp((t1 - t0) / list.length, 0.03, 0.065);
      list.forEach((s, i) => tl.set(s, { display: "inline" }, t0 + i * dt));
      return t0 + (list.length - 1) * dt;
    }
    // Cursor: blinkt (0,8 s pro Takt) oder steht, danach weg
    function cursorTrack(el, segs, tEnd) {
      for (const [a, b, mode] of segs) {
        if (b <= a + 0.02) continue;
        if (mode === "solid") { tl.set(el, { opacity: 1 }, a); continue; }
        for (let t = a; t < b - 0.05; t += 0.8) {
          tl.set(el, { opacity: 1 }, t);
          if (t + 0.45 < b - 0.02) tl.set(el, { opacity: 0 }, t + 0.45);
        }
      }
      tl.set(el, { opacity: 0 }, tEnd);
    }

    // ---- Anfangszustände ----
    FX.init(tl, [...B1, ...B2, ...C1], { display: "none" });
    FX.init(tl, ["#a3-k1", "#a3-k2", "#a3-k3", "#a3-down", "#a3-kbd", "#a3-inv", "#a3-x1", "#a3-g2", "#a3-g3", "#a3-g4", "#a3-g5",
      "#a3-c2t", "#a3-c3t", "#a3-c4t", "#a3-c5t", "#a3-lphone", "#a3-up", "#a3-plus", "#a3-live", "#a3-inv2", "#a3-ok"], { opacity: 0 });
    FX.init(tl, "#a3-dim", { opacity: 0 });
    FX.init(tl, "#a3-notes", { x: 668 });
    // die End-Karte nutzt den durchgehenden Touch-Punkt der Szene (sonst zwei Punkte gleichzeitig)
    FX.init(tl, ["#a3e-touch", "#a3e-wave1", "#a3e-wave2"], { visibility: "hidden" });

    // ---- 1–3 Erstes Bild: Touch-Punkt fährt ab Frame 1 aufs Depot-Icon zu, zögert, zittert, zieht sich zurück ----
    const T0 = [852, 656], NEAR = [686, 568], BACK = [858, 648];
    const tSw = C.anderes - 0.1;
    const steps = [
      { t: 0, to: NEAR, d: Math.max(0.8, C.amlieb - 0.08), ease: "power2.out" },
      { t: C.amlieb, shake: true, d: 0.45 },
      { t: C.amlieb + 0.5, back: BACK, d: 0.6 },
      { t: tSw - 0.42, to: [820, 432], d: 0.36 },
      { t: tSw, to: [300, 432], d: 0.4, ease: "power2.inOut" },
      { t: tSw + 0.42, hide: true },
    ];
    const wobD = clamp(C.verstehe - C.minus - 0.3, 1.2, 3);
    const wb = FX.wobble(tl, "#a3-dep", C.minus - 0.05, wobD);
    FX.settle(tl, "#a3-dep", wb.end, wb.endRotation);
    FX.pulse(tl, "#a3-badge", C.minus - 0.05, wobD + 0.3);

    // ---- 4–5 Handy dimmt auf 60 %, dann hell + schnelles Ranzoomen aufs Icon ----
    FX.tween(tl, "#a3-dim", { opacity: 0 }, { opacity: 0.4, duration: 0.3, ease: "power1.out" }, C.verstehe - 0.1);
    FX.tween(tl, "#a3-dim", { opacity: 0.4 }, { opacity: 0, duration: 0.2, ease: "none" }, C.aber - 0.1);
    FX.zoomFast(tl, "#a3-zA", C.aber - 0.05, { origin: "540px 422px" });

    // ---- 6 Homescreen nach links weggewischt, Notiz "Mein Plan:" öffnet sich ----
    FX.tween(tl, "#a3-home", { x: 0 }, { x: -668, duration: 0.4, ease: "power2.inOut" }, tSw);
    FX.tween(tl, "#a3-notes", { x: 668 }, { x: 0, duration: 0.4, ease: "power2.inOut" }, tSw);
    FX.zoomOut(tl, "#a3-zA", tSw, { from: 1.3, origin: "540px 422px" });
    FX.tween(tl, "#a3-status", { color: "#FFFFFF" }, { color: "#0E1A2B", duration: 0.3, ease: "none" }, tSw + 0.1);

    // ---- 7 roter Pfeil nach unten neben dem Titel, wird durchgestrichen ----
    FX.pop(tl, "#a3-down", C.kurse - 0.05);
    FX.draw(tl, "#a3-dxc", C.kurse + 0.4, 0.3);
    FX.drawLine(tl, "#a3-dx", C.kurse + 0.4);

    // ---- 8 Cursor blinkt auf der leeren Seite, langsamer Zoom ----
    const z2 = C.plan - 0.1;
    FX.slowZoom(tl, "#a3-zB", z2, { origin: "420px 330px" });

    // ---- 9–12 Tastatur fährt rein, zwei Zeilen tippen sich, beide rot durchgestrichen ----
    FX.flyIn(tl, "#a3-kbd", C.folgendes - 0.05, { from: "bottom", dist: 420 });
    const tB1 = C.warten - 0.08, eB1 = typeLine(B1, tB1, C.panik - 0.3);
    const tB2 = C.panik - 0.08, eB2 = typeLine(B2, tB2, C.subopt - 0.3);
    cursorTrack("#a3-k1", [[tSw + 0.3, tB1, "blink"], [tB1, eB1 + 0.1, "solid"], [eB1 + 0.1, tB2, "blink"]], tB2);
    cursorTrack("#a3-k2", [[tB2, eB2 + 0.1, "solid"], [eB2 + 0.1, C.subopt - 0.05, "blink"]], C.subopt - 0.05);
    FX.drawLine(tl, "#a3-s1", C.subopt - 0.05);
    FX.drawLine(tl, "#a3-s2", C.subopt + 0.3);
    const tKo = Math.max(C.subopt + 0.35, Math.min(C.subopt + 0.75, C.stattdessen - 0.05));
    FX.flyOut(tl, "#a3-kbd", tKo, { to: "bottom", dist: 420 });
    FX.set(tl, "#a3-kbd", { opacity: 0 }, tKo + 0.3); // sonst taucht sie im verkleinerten Handy (geteiltes Bild) wieder auf
    FX.fadeOut(tl, "#a3-down", tKo, 0.25);            // Storyboard B: Titel ohne Pfeil, ruhiges Bild für den Mitte-CTA

    // ---- 13 Kalender-Einladung gleitet von oben rein (danach ruhig rauszoomen bis zum Chip) ----
    FX.flyIn(tl, "#a3-inv", C.stattdessen - 0.1, { from: "top", dist: 260 });
    const z3 = Math.max(z2 + 3.05, C.stattdessen + clamp((C.live - C.stattdessen - 3) / 2, 0.6, 1.5));
    FX.slowZoom(tl, "#a3-zB", z3, { from: 1.08, to: 1, d: clamp(C.live - 0.1 - z3, 0.8, 3), origin: "420px 330px" });

    // ---- 14–15 BAUSTEIN Mitte-CTA (fliegt in Ad 3 bei "halte dich fest" raus, in Ad 3 B am Satzende) ----
    const tOut = P620 ? C.halte : Math.min(E.ctaend + 0.35, C.funkt - 0.05);
    FX.midCta(tl, "a3m", { live: C.live, klick: C.klick, out: tOut });

    // ---- 16–17 (fällt in B weg) Handy dimmt auf 40 %, Kreis groß, keine Zahl, kein Chart (langsam rein- und
    //      wieder rauszoomen, damit nie > 4 s Stillstand); am Ende des Satzes wieder hell ----
    if (P620) {
      const pEnd = E.p620;
      FX.tween(tl, "#a3-dim", { opacity: 0 }, { opacity: 0.6, duration: 0.3, ease: "power1.out" }, C.halte + 0.05);
      const z4 = C.halte + 0.25;
      FX.slowZoom(tl, "#a3-zB", z4, { d: clamp(pEnd - 0.45 - z4, 0.8, 3), origin: "540px 330px" });
      const z4b = Math.max(z4 + 3.05, pEnd - 3.3);
      if (pEnd - 0.2 - z4b >= 1.5) FX.slowZoom(tl, "#a3-zB", z4b, { from: 1.08, to: 1, d: Math.min(3, pEnd - 0.2 - z4b), origin: "540px 330px" });
      else FX.zoomOut(tl, "#a3-zB", pEnd, { from: 1.08, origin: "540px 330px" });
      FX.tween(tl, "#a3-dim", { opacity: 0.6 }, { opacity: 0, duration: 0.3, ease: "power1.out" }, pEnd);
    }

    // ---- 18 Einladung fährt hoch, Notiz wieder leer, Cursor blinkt ----
    FX.flyOut(tl, "#a3-inv", C.funkt - 0.1, { to: "top", dist: 300 });
    FX.tween(tl, ["#a3-b1", "#a3-b2"], { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "none" }, C.funkt - 0.1);

    // ---- 19–20 "kaufen und hoffen" tippt sich; rotes X davor, Zeile grau + durchgestrichen ----
    const tC1 = C.kauft - 0.08, eC1 = typeLine(C1, tC1, C.nein - 0.3);
    cursorTrack("#a3-k3", [[C.funkt + 0.2, tC1, "blink"], [tC1, eC1 + 0.1, "solid"], [eC1 + 0.1, C.nein - 0.1, "blink"]], C.nein - 0.1);
    FX.pop(tl, "#a3-x1", C.nein - 0.1);
    FX.tween(tl, "#a3-c1t", { color: "#0E1A2B" }, { color: "#9CA3AF", duration: 0.2, ease: "none" }, C.nein);
    FX.drawLine(tl, "#a3-s3", C.nein + 0.05);

    // ---- 21–23 grüne Haken ploppen Zeile für Zeile ----
    for (const [n, t] of [[2, C.trades], [3, C.ein], [4, C.aus]]) {
      FX.pop(tl, `#a3-g${n}`, t - 0.08);
      FX.fadeIn(tl, `#a3-c${n}t`, t - 0.08);
    }
    // ---- 24 nichts einblenden, langsamer Zoom auf die Liste ----
    const z5 = C.passiv - 0.1;
    FX.slowZoom(tl, "#a3-zB", z5, { d: clamp(C.parallel - 0.15 - z5, 0.8, 3), origin: "541px 460px" });
    // ---- 25 "Depot: bleibt, wie es ist" (höchstens 4 Zeilen: die gestrichene Zeile geht, die Liste rückt hoch) ----
    const tSh = C.depot2 - 0.5;
    FX.fadeOut(tl, "#a3-c1", tSh, 0.25);
    FX.tween(tl, ["#a3-c2", "#a3-c3", "#a3-c4"], { y: 0 }, { y: -78, duration: 0.35, ease: "power2.inOut" }, tSh + 0.08);
    FX.pop(tl, "#a3-g5", C.depot2 - 0.05);
    FX.fadeIn(tl, "#a3-c5t", C.depot2 - 0.05);

    // ---- 26 Zoom-out, das Bild teilt sich: links klein die Depot-App, rechts der Plan ----
    const tSp = C.parallel - 0.1;
    FX.zoomOut(tl, "#a3-zB", tSp, { from: 1.08, origin: "541px 460px" });
    FX.tween(tl, "#a3-split", { scale: 1, x: 0, transformOrigin: "540px 24px" }, { scale: 0.72, x: 250, duration: 0.5, ease: "power2.inOut", transformOrigin: "540px 24px" }, tSp);
    FX.flyIn(tl, "#a3-lphone", tSp + 0.1, { from: "left", dist: 480 });
    // ---- 27 grauer Pfeil nach oben mit Fragezeichen ----
    FX.pop(tl, "#a3-up", C.davon - 0.08);
    // ---- 28 "+" zwischen beiden Hälften, keine Schrift (danach langsamer Zoom) ----
    FX.pop(tl, "#a3-plus", C.ergaenzung - 0.08);
    const s1 = C.ergaenzung + 0.6, s1d = clamp(C.kgv2 - 0.15 - s1, 0.8, 3);
    FX.slowZoom(tl, "#a3-stage", s1, { d: s1d, origin: "540px 380px" });
    // ---- 29 Handy dimmt auf 40 % (Kreis groß), leicht rauszoomen ----
    FX.tween(tl, "#a3-dim", { opacity: 0 }, { opacity: 0.6, duration: 0.3, ease: "power1.out" }, C.kgv2 - 0.1);
    const s2 = Math.max(s1 + s1d + 0.05, C.kgv2 + 0.3);
    FX.slowZoom(tl, "#a3-stage", s2, { from: 1.08, to: 1, d: clamp(C.sonntag - 0.1 - s2, 0.8, 3), origin: "540px 380px" });

    // ---- 30 BAUSTEIN End-Karte (ohne Platz-Chip) ----
    FX.tween(tl, "#a3-dim", { opacity: 0.6 }, { opacity: 0, duration: 0.3, ease: "power1.out" }, C.sonntag);
    const tk = C.klick2;
    FX.endCard(tl, "a3e", { start: C.sonntag, t18: C.uhr, bot: C.bot, klick: tk });
    // ---- 31 roter LIVE-Badge neben dem Datum, pulsiert bis zum Ende ("in meinem Live-Webinar"; die Zeile
    //      "UND DIE ERGEBNISSE SIND SO GUT" ist im Schnitt nicht gesprochen) ----
    FX.pop(tl, "#a3-live", C.livebadge - 0.08, { origin: "0% 50%" });
    FX.pulse(tl, "#a3-live", C.livebadge + 0.12, Math.max(0.8, DUR - C.livebadge - 0.4));
    // ---- 33 BAUSTEIN "klick unter dem Video": Touch-Punkt tippt auf "Mehr dazu" (Position wie FX.endCard) ----
    const card = $("#a3e-card"), btn = $("#a3e-btn");
    const bx = (card?.offsetLeft ?? 70) + (btn?.offsetLeft ?? 60) + (btn?.offsetWidth ?? 330) * 0.62;
    const by = (card?.offsetTop ?? 55) + (btn?.offsetTop ?? 438) + (btn?.offsetHeight ?? 100) * 0.55;
    steps.push({ t: tk - 0.85, show: true, at: [bx + 200, by + 120] });
    steps.push({ t: tk - 0.65, to: [bx, by], d: 0.6 });
    steps.push({ t: tk, tap: true });
    // ---- 32 "und dann sehen wir uns live am Sonntag" (statt "IN MEINEM ACCOUNT ZEIGEN", im Schnitt nicht
    //      gesprochen): Einladung kommt zurück, Touch-Punkt tippt "Annehmen", Haken erscheint ----
    FX.flyIn(tl, "#a3-inv2", C.sehen - 0.1, { from: "right", dist: 560 });
    const ANN = [584 + 20 + 190, 450 + 130 + 36];
    const tA = Math.max(C.sonntag3 - 0.1, C.sehen + 0.6);
    const tGo = Math.max(tk + 0.35, C.sehen + 0.1);
    steps.push({ t: tGo, to: ANN, d: Math.max(0.3, Math.min(0.55, tA - 0.04 - tGo)) });
    steps.push({ t: tA, tap: true });
    steps.push({ t: Math.min(tA + 0.9, DUR - 0.3), hide: true });
    FX.tween(tl, "#a3-ann", { backgroundColor: "#0E1A2B" }, { backgroundColor: "#16A34A", duration: 0.2, ease: "none" }, tA + 0.08);
    FX.pop(tl, "#a3-ok", tA + 0.1);
    FX.touch(tl, "a3", T0, steps);

    window.__timelines["ad3"] = tl;
  </script>
</template>
