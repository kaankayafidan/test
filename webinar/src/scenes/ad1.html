      <!-- Schwamm: echtes Objekt mit Schatten -->
      <div id="a1-sponge">
        <svg width="210" height="330" viewBox="0 0 210 330">
          <g transform="rotate(-5 105 165)">
            <rect x="24" y="14" width="166" height="300" rx="28" fill="url(#a1-spg)" />
            <rect x="24" y="14" width="34" height="300" rx="17" fill="#2D557E" />
            <g fill="#2F5C8A" opacity="0.55">
              <ellipse cx="92" cy="52" rx="7" ry="5" /><ellipse cx="140" cy="80" rx="5" ry="4" /><ellipse cx="112" cy="120" rx="8" ry="5" /><ellipse cx="158" cy="150" rx="6" ry="4" /><ellipse cx="88" cy="176" rx="6" ry="5" /><ellipse cx="132" cy="206" rx="8" ry="5" /><ellipse cx="96" cy="246" rx="5" ry="4" /><ellipse cx="150" cy="262" rx="7" ry="5" /><ellipse cx="116" cy="288" rx="6" ry="4" />
            </g>
            <rect x="58" y="22" width="120" height="10" rx="5" fill="#FFFFFF" opacity="0.18" />

        </svg>

      <!--@include midcta p="a1m"-->
      <!--@include endcard p="a1e"-->
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const S = (id) => "#a1-" + id;
    const r1 = (v) => Math.round(v * 10) / 10;
    const setD = (id, d) => document.querySelector(S(id)).setAttribute("d", d);

    // ---------- static hand-drawn geometry (seeded, identical every render) ----------
    function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
    function smooth(p) {
      let d = `M${r1(p[0][0])} ${r1(p[0][1])}`;
      for (let i = 1; i < p.length - 1; i++) d += ` Q${r1(p[i][0])} ${r1(p[i][1])} ${r1((p[i][0] + p[i + 1][0]) / 2)} ${r1((p[i][1] + p[i + 1][1]) / 2)}`;
      const l = p[p.length - 1];
      return d + ` L${r1(l[0])} ${r1(l[1])}`;
    }
    function handPoly(pts, seed, amp = 2.4, step = 36) {
      const r = rng(seed), out = [];
      for (let i = 0; i < pts.length - 1; i++) {
        const [x1, y1] = pts[i], [x2, y2] = pts[i + 1];
        const n = Math.max(1, Math.round(Math.hypot(x2 - x1, y2 - y1) / step));
        for (let k = i === 0 ? 0 : 1; k <= n; k++) {
          const p = k / n, j = (i === 0 && k === 0) || (i === pts.length - 2 && k === n) ? 0 : 1;
          out.push([x1 + (x2 - x1) * p + (r() - 0.5) * 2 * amp * j, y1 + (y2 - y1) * p + (r() - 0.5) * 2 * amp * j]);
        }
      }
      return smooth(out);
    }
    function handArc(cx, cy, rx, ry, a0, sweep, seed) {
      const r = rng(seed), n = 72, p = [], w1 = r() * 6.28, w2 = r() * 6.28;
      for (let i = 0; i <= n; i++) {
        const f = i / n, a = a0 + sweep * f, k = 1 + 0.022 * Math.sin(a * 2 + w1) + 0.014 * Math.sin(a * 3 + w2) - 0.035 * f;
        p.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]);
      }
      return smooth(p);
    }
    const deg = Math.PI / 180;
    // gelber Kreidekreis um den Roboter, bewusst nicht ganz geschlossen (Lücke oben rechts)
    setD("ring", handArc(575, 392, 305, 268, -48 * deg, 328 * deg, 7));
    // gelber Rahmen ums Feld (B)
    setD("frame", handPoly([[138, 114], [862, 114], [862, 552], [138, 552], [138, 124]], 21));

    // Magnete: Kader am rechten Rand (2 Reihen), Feld-Positionen, Bank
    const HOME = { 1: [915, 200], 2: [915, 295], 3: [915, 390], 4: [915, 485], 5: [915, 580], 6: [995, 247], 7: [995, 342], 8: [995, 437], 9: [995, 532] };
    const FIELD = { 1: [300, 234], 3: [600, 284], 4: [440, 429], 8: [705, 399] };
    const INF = [1, 3, 4, 8];              // in Form: gelber Haken, aufs Feld
    const OUTF = [2, 6, 7, 5, 9];          // schwächeln: grau, auf die Bank (Reihenfolge = Plätze links → rechts)
    const BENCH = { 2: 640, 6: 530, 7: 750, 5: 860, 9: 970 }, BENCH_Y = 606;
    INF.forEach((n) => {
      const [hx, hy] = HOME[n], [tx, ty] = FIELD[n];
      const L = Math.hypot(tx - hx, ty - hy), ux = (tx - hx) / L, uy = (ty - hy) / L;
      const sx = hx + ux * 54, sy = hy + uy * 54, ex = tx - ux * 58, ey = ty - uy * 58;
      setD("ar" + n, `M${r1(sx)} ${r1(sy)} Q${r1((sx + ex) / 2 - uy * 8)} ${r1((sy + ey) / 2 + ux * 8)} ${r1(ex)} ${r1(ey)}`);
      const head = (s) => { const c = Math.cos(28 * deg), si = Math.sin(28 * deg) * s; return [ex - 26 * (ux * c - uy * si), ey - 26 * (uy * c + ux * si)]; };
      const a = head(1), b = head(-1);
      setD("ah" + n, `M${r1(a[0])} ${r1(a[1])} L${r1(ex)} ${r1(ey)} L${r1(b[0])} ${r1(b[1])}`);
    });

    // Stadion-Feld in Perspektive (Trapez), Linien + zwei gestrichelte Laufwege
    const TLc = [680, 340], TRc = [1005, 340], BRc = [1050, 548], BLc = [640, 548];
    const M = (u, v) => [(1 - v) * ((1 - u) * TLc[0] + u * TRc[0]) + v * ((1 - u) * BLc[0] + u * BRc[0]), (1 - v) * ((1 - u) * TLc[1] + u * TRc[1]) + v * ((1 - u) * BLc[1] + u * BRc[1])];
    const ln = (uv) => "M" + uv.map(([u, v]) => M(u, v).map(r1).join(" ")).join(" L");
    const ell = (cu, cv, ru, rv, n = 40) => Array.from({ length: n + 1 }, (_, i) => [cu + ru * Math.cos((i / n) * 2 * Math.PI), cv + rv * Math.sin((i / n) * 2 * Math.PI)]);
    setD("cf", [ln([[0, 0], [1, 0], [1, 1], [0, 1], [0, 0]]), ln([[0.5, 0], [0.5, 1]]), ln(ell(0.5, 0.5, 0.1, 0.19)),
      ln([[0, 0.2], [0.15, 0.2], [0.15, 0.8], [0, 0.8]]), ln([[1, 0.2], [0.85, 0.2], [0.85, 0.8], [1, 0.8]]),
      ln([[0, 0.36], [0.055, 0.36], [0.055, 0.64], [0, 0.64]]), ln([[1, 0.36], [0.945, 0.36], [0.945, 0.64], [1, 0.64]])].join(" "));
    const LA = (a) => M(0.29 + 0.19 * Math.cos(a), 0.47 + 0.3 * Math.sin(a));
    const LB = (a) => M(0.72 + 0.19 * Math.cos(a), 0.52 + 0.31 * Math.sin(a));
    const loopD = (P) => "M" + Array.from({ length: 64 }, (_, i) => P((i / 64) * 2 * Math.PI).map(r1).join(" ")).join(" L") + " Z";
    setD("lpA", loopD(LA));
    setD("lpB", loopD(LB));

    // Striche / Unterstreichung / Kreis (von Hand)
    setD("x1", FX.handLine(318, 262, 764, 248, 3));
    setD("x2", FX.handLine(322, 446, 760, 434, 4));
    setD("ul", FX.handLine(72, 672, 506, 666, 5));
    setD("socirc", FX.handCircle(874, 69, 70, 48, 9));
    setD("x3", FX.handLine(204, 270, 500, 262, 6));

    // ---------- helpers ----------
    // Handschrift / Kreidezeichnung erscheint: "Wischen" von links
    function write(el, t, d = 0.4) {
      FX.init(tl, el, { clipPath: "inset(0% 100% 0% 0%)" });
      FX.tween(tl, el, { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: d, ease: "none" }, t);
    }
    function drawIn(el, t, d) { FX.init(tl, el, { opacity: 0 }); FX.draw(tl, el, t, d); }
    // Magnet läuft in Schleife auf einem Weg (kleine gerade Stücke, nahtlos)
    function loopMove(el, P, a0, dir, period, t0, t1) {
      const N = 36, seg = period / N, da = (dir * 2 * Math.PI) / N;
      let a = a0, [x, y] = P(a);
      FX.init(tl, el, { x, y });
      for (let i = 0; t0 + (i + 1) * seg <= t1; i++) {
        const [nx, ny] = P(a + da);
        FX.tween(tl, el, { x, y }, { x: nx, y: ny, duration: seg, ease: "none" }, t0 + i * seg);
        a += da; x = nx; y = ny;
      }
    }

    // ================= 1 · "Meine Trading-KI": erstes Bild, gelber Kreis zieht sich ab Frame 1 in 0,5 s =================
    FX.init(tl, S("fieldA"), { opacity: 0.45 });
    FX.draw(tl, S("ring"), 0, 0.5);

    // 2 · "wie ein Fußballtrainer": "KI = Trainer", Pfeife wackelt 2×
    write(S("kit"), C.trainer, 0.45);
    const wb = FX.wobble(tl, S("whistle"), C.trainer + 0.1, 1.2, { svgOrigin: "550 514" });
    FX.settle(tl, S("whistle"), wb.end, wb.endRotation, { svgOrigin: "550 514" });

    // Übergang A → B (Magic Move, nach dem Erstbild): Roboter + Notiz in die Ecke, Spielfeld wird kräftiger
    const tM = Math.max(C.trainer + 0.7, Math.min(C.spieler + 0.75, C.sorge - 0.6));
    FX.tween(tl, S("bigbot"), { x: 0, y: 0, scale: 1, transformOrigin: "50% 50%" }, { x: -457, y: -297, scale: 0.32, duration: 0.5, ease: "power2.inOut", transformOrigin: "50% 50%" }, tM);
    FX.fadeOut(tl, S("bigbot"), tM + 0.32, 0.18);
    FX.init(tl, S("smallbot"), { opacity: 0 });
    FX.fadeIn(tl, S("smallbot"), tM + 0.32, 0.18);
    FX.fadeOut(tl, S("ring"), Math.min(tM, C.spieler - 0.05), 0.25);
    FX.tween(tl, S("fieldA"), { scale: 1, opacity: 0.45, transformOrigin: "356.3px 228.1px" }, { scale: 0.72917, opacity: 0.8, duration: 0.5, ease: "power2.inOut", transformOrigin: "356.3px 228.1px" }, tM);
    FX.tween(tl, S("kit"), { x: 0, y: 0, scale: 1, transformOrigin: "0% 0%" }, { x: -536, y: -20, scale: 0.85, duration: 0.5, ease: "power2.inOut", transformOrigin: "0% 0%" }, tM);

    // 3 · "welche Spieler …": 9 Magnete fliegen an den rechten Rand, je 0,08 s versetzt
    const MAGS = [1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => S("m" + n));
    MAGS.forEach((m) => FX.init(tl, m, { opacity: 0 }));
    FX.flyIn(tl, MAGS, C.spieler, { from: "right", dist: 520 });

    // 4 · "keine Sorge": oben rechts "ohne Vorwissen ✓"
    write(S("ohne"), C.sorge, 0.55);

    // 5 · "null Ahnung": langsamer Zoom
    FX.slowZoom(tl, S("cam"), C.ahnung, { origin: "540px 450px" });

    // 6 · "Jeder Spieler ist eine Trading-Strategie": Magnet 1 wächst auf 200 %, "= 1 Strategie", schrumpft zurück
    FX.tween(tl, S("m1"), { scale: 1 }, { scale: 2, duration: 0.3, ease: "power2.out" }, C.strategie);
    write(S("strat"), C.strategie + 0.2, 0.5);
    FX.tween(tl, S("m1"), { scale: 2 }, { scale: 1, duration: 0.3, ease: "power2.inOut" }, Math.max(C.strategie + 0.9, Math.min(C.kader - 0.35, C.strategie + 1.8)));
    FX.fadeOut(tl, S("strat"), Math.max(C.strategie + 1.2, C.kader - 0.05), 0.25);

    // 7 · "habe ich im Kader": alle 9 blinken einmal, darunter "Kader"
    MAGS.forEach((m, i) => FX.blink(tl, m, C.kader + i * 0.03, 0.8));
    write(S("kader"), C.kader + 0.1, 0.4);
    FX.fadeOut(tl, S("kader"), C.ein, 0.3);

    // 8 · "die KI (also der Trainer) schaut immer wieder": gelbe Scan-Linie in 1 s über die Magnete
    FX.init(tl, S("scan"), { opacity: 0 });
    FX.fadeIn(tl, S("scan"), C.scan, 0.12);
    FX.tween(tl, S("scan"), { y: 135 }, { y: 640, duration: 1, ease: "sine.inOut" }, C.scan);
    FX.fadeOut(tl, S("scan"), C.scan + 0.88, 0.12);

    // 9 · "wer gerade in Form ist": gelbe Haken / graue Striche (die schwachen werden grau)
    INF.forEach((n, i) => write(S("m" + n + "k"), C.form + i * 0.1, 0.25));
    OUTF.forEach((n, i) => {
      FX.init(tl, S("m" + n + "g"), { opacity: 0 });
      FX.fadeIn(tl, S("m" + n + "g"), C.form + 0.3 + i * 0.06, 0.3);
      write(S("m" + n + "k"), C.form + 0.3 + i * 0.06, 0.2);
    });

    // 10 · "wird eingewechselt": Magnete mit Haken gleiten auf Kreidepfeilen aufs Feld
    INF.forEach((n, i) => {
      const t = C.ein + i * 0.15, [hx, hy] = HOME[n], [tx, ty] = FIELD[n];
      drawIn(S("ar" + n), t, 0.3);
      FX.init(tl, S("ah" + n), { opacity: 0 });
      FX.fadeIn(tl, S("ah" + n), t + 0.27, 0.1);
      FX.tween(tl, S("m" + n), { x: 0, y: 0 }, { x: tx - hx, y: ty - hy, duration: 0.6, ease: "power2.inOut" }, t + 0.1);
    });

    // 11 · "sitzt erst mal auf der Bank": Bank mit "Bank", die grauen Magnete rutschen drauf
    write(S("bench"), C.bank, 0.45);
    write(S("bankw"), C.bank + 0.05, 0.4);
    OUTF.forEach((n, i) => {
      const [hx, hy] = HOME[n];
      FX.tween(tl, S("m" + n), { x: 0, y: 0 }, { x: BENCH[n] - hx, y: BENCH_Y - hy, duration: 0.5, ease: "power2.inOut" }, C.bank + 0.3 + i * 0.08);
    });

    // 12 · "Wie meine Mannschaft …": Aufstellung friert ein, gelber Rahmen zieht sich ums Feld (danach ruhiger Zoom zurück)
    drawIn(S("frame"), C.aufst, 0.6);
    const tZO = Math.max(C.aufst + 0.7, C.ahnung + 3.05);
    FX.slowZoom(tl, S("cam"), tZO, { origin: "540px 450px", from: 1.08, to: 1, d: Math.max(1, Math.min(3, C.beste - tZO - 0.1)) });

    // 13 + 14 · BAUSTEIN Mitte-CTA
    FX.midCta(tl, "a1m", { live: C.live, klick: C.klick, out: E.klickout });

    // 15 · "jetzt kommt das Beste": der Schwamm wischt die Tafel in 0,5 s leer
    const SPV = 2860; // px/s, Schwamm-Mitte von -170 bis 1260 in 0,5 s
    FX.init(tl, S("sponge"), { opacity: 0, x: -170 });
    FX.set(tl, S("sponge"), { opacity: 1 }, C.beste);
    FX.tween(tl, S("sponge"), { x: -170 }, { x: 1260, duration: 0.5, ease: "none" }, C.beste);
    FX.set(tl, S("sponge"), { opacity: 0 }, C.beste + 0.5);
    FX.init(tl, S("AB"), { clipPath: "inset(0px 0px 0px 0px)" });
    FX.tween(tl, S("AB"), { clipPath: "inset(0px 0px 0px 0px)" }, { clipPath: "inset(0px 0px 0px 1080px)", duration: 1080 / SPV, ease: "none" }, C.beste + 170 / SPV);

    // 16 · "nicht mal Trainer oder Spieler sein": untereinander, bei "sein" beide durchgestrichen
    write(S("wtr"), C.tr2, 0.45);
    write(S("wsp"), C.sp2, 0.45);
    drawIn(S("x1"), C.sein, 0.3);
    drawIn(S("x2"), C.sein + 0.12, 0.3);
    FX.fadeOut(tl, S("S2"), C.verein, 0.25);

    // 17 · "Vereinsbesitzer": Stadion erscheint in 0,6 s, Glaskasten "VIP" mit Besitzer (aufrecht), schnelles Ranzoomen
    FX.init(tl, S("C"), { opacity: 0 });
    FX.tween(tl, S("C"), { opacity: 0, scale: 0.97, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.6, ease: "power2.out", transformOrigin: "50% 50%" }, C.verein);
    FX.zoomFast(tl, S("cam"), C.verein + 0.6, { origin: "180px 205px" });

    // 18 · "tradet für mich": Magnete laufen auf gestrichelten Wegen, in Schleife (19 · "komplett passiv": nichts Neues)
    FX.init(tl, S("loops"), { opacity: 0 });
    FX.fadeIn(tl, S("loops"), C.tradet, 0.3);
    const tLoopEnd = C.mehr + 0.3;
    loopMove(S("c1"), LA, 0, 1, 3.8, C.tradet, tLoopEnd);
    loopMove(S("c3"), LA, Math.PI, 1, 3.8, C.tradet, tLoopEnd);
    loopMove(S("c4"), LB, Math.PI / 2, -1, 4.4, C.tradet, tLoopEnd);
    loopMove(S("c8"), LB, Math.PI * 1.5, -1, 4.4, C.tradet, tLoopEnd);

    // 20 · "auf dem Platz alles gibt": Zoom-out aufs ganze Stadion
    FX.tween(tl, S("cam"), { scale: 1.3, transformOrigin: "180px 205px" }, { scale: 1, duration: 0.5, ease: "power2.inOut", transformOrigin: "180px 205px" }, Math.max(C.gibt, C.verein + 1.05));

    // 21 · "sitze ich entspannt in der VIP-Lounge": Posenwechsel in 0,2 s (zurückgelehnt, Füße hoch, Kaffee)
    FX.init(tl, S("p2"), { opacity: 0 });
    FX.fadeOut(tl, S("p1"), C.entspannt, 0.2);
    FX.fadeIn(tl, S("p2"), C.entspannt, 0.2);

    // 22 · "automatisierten KI-Trading-Bot": unter dem Stadion, gelb unterstrichen
    write(S("kitb"), C.bot, 0.6);
    drawIn(S("ul"), C.bot + 0.6, 0.3);

    // 23 · "neben deinem Job": halbe Schwammwischung, neue Szene: "Du" am Schreibtisch, Magnete auf dem Bildschirm
    FX.set(tl, S("sponge"), { opacity: 1, scale: 1 }, C.job);
    FX.tween(tl, S("sponge"), { x: -170 }, { x: 520, duration: 690 / SPV, ease: "none" }, C.job);
    const tLift = C.job + 690 / SPV;
    FX.tween(tl, S("sponge"), { opacity: 1, scale: 1 }, { opacity: 0, scale: 1.08, duration: 0.2, ease: "power1.in" }, tLift);
    FX.init(tl, S("Cl"), { clipPath: "inset(0px 0px 0px 0px)" });
    FX.tween(tl, S("Cl"), { clipPath: "inset(0px 0px 0px 0px)" }, { clipPath: "inset(0px 0px 0px 632px)", duration: tLift - C.job - 170 / SPV, ease: "none" }, C.job + 170 / SPV);
    write(S("desk"), C.job + 0.3, 0.5);
    write(S("du"), C.job + 0.55, 0.35);

    FX.init(tl, S("mast"), { clipPath: "inset(100% 0% 0% 0%)" });
    FX.tween(tl, S("mast"), { clipPath: "inset(100% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.45, ease: "power1.out" }, C.server);
    FX.init(tl, S("srv"), { opacity: 0 });
    FX.pop(tl, S("srv"), C.server + 0.3);
    FX.init(tl, S("beams"), { opacity: 0 });
    FX.fadeIn(tl, S("beams"), C.server + 0.45, 0.4);
    FX.blink(tl, S("led"), C.server + 0.5, Math.max(0.8, C.mehr - C.server - 0.5));

    // 25 · "einmal pro Woche 30 Minuten": Wochenleiste Mo–So, "So" gelb eingekreist: "30 Min"
    write(S("week"), C.woche, 0.5);
    drawIn(S("socirc"), Math.max(C.woche + 0.55, C.woche2), 0.5);
    write(S("min"), Math.max(C.woche + 0.95, C.min30), 0.45);

    // 26 · "nicht selbst traden": neben "Du" "selbst traden", durchgestrichen
    write(S("selbst"), C.selbst, 0.5);
    drawIn(S("x3"), Math.max(C.selbst + 0.55, E.selbst - 0.15), 0.3);

    // 27 · "interessieren sich immer mehr": 4 Strichmännchen mit Krawatte ploppen nacheinander auf
    FX.fadeOut(tl, S("D"), C.mehr - 0.05, 0.3);
    FX.fadeOut(tl, S("Cr"), C.mehr - 0.05, 0.3);
    [0, 1, 2, 3].forEach((k) => { FX.init(tl, S("f" + k), { opacity: 0 }); FX.pop(tl, S("f" + k), C.mehr + 0.2 + k * 0.28, { origin: "50% 100%" }); });

    // 28 · "für sich arbeiten zu lassen": kleiner Kreide-Roboter daneben
    FX.init(tl, S("bot3"), { opacity: 0 });
    FX.pop(tl, S("bot3"), C.lassen);

    // 29 · "für seinen chef zu arbeiten": links "Du → Chef" (weiß), rechts "Bot → Du" (gelb)
    write(S("l1"), C.chef, 0.5);
    write(S("l2"), C.chef + 0.7, 0.5);

    // 30 · "zweites Standbein aufzubauen": kein Text, langsamer Zoom-out auf die ganze Tafel
    const zin = C.standbein - C.chef > 4.3 ? C.chef + 1.3 : C.mehr + 0.4;
    FX.slowZoom(tl, S("cam"), zin, { origin: "540px 355px", d: Math.max(1, Math.min(3, C.standbein - zin - 0.05)) });
    FX.slowZoom(tl, S("cam"), C.standbein, { origin: "540px 355px", from: 1.08, to: 1, d: 3 });

    // 31 + 32 · BAUSTEIN End-Karte (ohne Platz-Chip), Touch-Punkt tippt bei "klick unter dem Video"
    FX.endCard(tl, "a1e", { start: C.sonntag, t18: C.t18, bot: C.bot2, klick: C.klick2, pulseDate: C.einfach });

    window.__timelines["ad1"] = tl;
