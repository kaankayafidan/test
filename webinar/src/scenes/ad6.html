      ec: { x: 922, y: 388, r: 2, w: 300, h: 350 },
    };
    const PIN_Y = 15; // pin sits 15 px below the top edge of every pinned item
    for (const [k, o] of Object.entries(L)) {
      const it = $("#a6-" + k), tilt = it.querySelector(".a6-tilt");
      it.style.left = o.x + "px"; it.style.top = o.y + "px";
      Object.assign(tilt.style, { left: -o.w / 2 + "px", top: -o.h / 2 + "px", width: o.w + "px", height: o.h + "px", transform: `rotate(${o.r}deg)` });
    }
    // world position of an item's pin (top centre, rotated with the item's tilt)
    const pinW = (o) => { const a = (o.r * Math.PI) / 180, dy = -(o.h / 2 - PIN_Y); return [o.x - dy * Math.sin(a), o.y + dy * Math.cos(a)]; };
    const swingOrigin = (o) => `${o.w / 2}px ${PIN_Y}px`;

    // 3 x 3 Punkte auf Karte 3: Kreise + Haken (grün) / Striche (grau)
    const dotsSvg = $("#a6-dots");
    let dots = "";
    for (let i = 0; i < 9; i++) {
      const cx = 90 + (i % 3) * 70, cy = 58 + Math.floor(i / 3) * 60;
      dots += `<circle cx="${cx}" cy="${cy}" r="22" class="a6-ink" style="fill:#F1F4FA"/>`;
      dots += `<path id="a6-mc${i}" d="M${cx - 11} ${cy + 1} L${cx - 3} ${cy + 9} L${cx + 12} ${cy - 9}" fill="none" stroke="#16A34A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>`;
      dots += `<path id="a6-md${i}" d="M${cx - 11} ${cy} L${cx + 11} ${cy}" fill="none" stroke="#9CA3AF" stroke-width="7" stroke-linecap="round"/>`;
    }
    dotsSvg.innerHTML = dots;

    // ---------------------------------------------------------------- helpers
    // Pin knallt (Ad 6): item flies in (0.25 s), the pin bangs in 0.12 s, the item wobbles once around its pin.
    function pinIn(k, t, o = {}) {
      const it = "#a6-" + k, sw = "#a6-" + k + "s", pin = o.pin ?? "#a6-" + k + "pin", org = { origin: swingOrigin(L[k]) };
      FX.flyIn(tl, it, t, { from: o.from ?? "left", dist: o.dist ?? 1400 });
      FX.slam(tl, pin, t + 0.25);
      FX.wobble(tl, sw, t + 0.25, 0.6, org);
      FX.settle(tl, sw, t + 0.85, 6, org);
    }
    function preIn(k, pin) {
      FX.init(tl, "#a6-" + k, { opacity: 0 });
      FX.init(tl, "#a6-" + k + "s", { rotation: -6, transformOrigin: swingOrigin(L[k]), smoothOrigin: false });
      FX.init(tl, pin ?? "#a6-" + k + "pin", { opacity: 0 });
    }
    // Karte dreht sich: front 0 -> 90°, back -90 -> 0° (0.36 s)
    function flip(n, t) {
      const f = `#a6-c${n}f`, b = `#a6-c${n}b`, P = { transformPerspective: 1100 };
      FX.tween(tl, f, { rotationY: 0, ...P }, { rotationY: 90, ...P, duration: 0.18, ease: "power2.in" }, t);
      FX.set(tl, f, { opacity: 0 }, t + 0.18);
      FX.set(tl, b, { opacity: 1 }, t + 0.18);
      FX.tween(tl, b, { rotationY: -90, ...P }, { rotationY: 0, ...P, duration: 0.2, ease: "power2.out" }, t + 0.18);
    }
    // "wackelt kurz" from rest: 0 -> +6 -> -6 -> 0 (6°, 0.6 s per swing), pivot = pin
    function wiggle(sw, t, origin) {
      const o = { transformOrigin: origin, smoothOrigin: false };
      FX.tween(tl, sw, { rotation: 0, ...o }, { rotation: 6, ...o, duration: 0.3, ease: "sine.out" }, t);
      FX.tween(tl, sw, { rotation: 6, ...o }, { rotation: -6, ...o, duration: 0.6, ease: "sine.inOut" }, t + 0.3);
      FX.tween(tl, sw, { rotation: -6, ...o }, { rotation: 0, ...o, duration: 0.3, ease: "sine.in" }, t + 0.9);
    }
    // Handschrift-Wischen von links (0.45 s)
    const wipe = (el, t) => FX.tween(tl, el, { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.45, ease: "none" }, t);

    // ---------------------------------------------------------------- camera (one continuous script, moves never overlap)
    const CAM = "#a6-cam";
    const view = (fx, fy, s, sx = 540, sy = 355) => ({ x: sx - s * fx, y: sy - s * fy, scale: s });
    const moves = [];
    const go = (t, d, to, ease = "power2.inOut") => moves.push({ t, d, to, ease });
    const slow = (t, f = 1.08) => moves.push({ t, d: 3, f, ease: "none" }); // langsamer Zoom 100 -> 108 % über 3 s
    function runCamera(start) {
      moves.sort((a, b) => a.t - b.t);
      let cur = start;
      const O = { transformOrigin: "0 0", smoothOrigin: false };
      FX.init(tl, CAM, { ...cur, ...O });
      moves.forEach((m, i) => {
        const next = moves[i + 1];
        const d = next ? Math.min(m.d, next.t - m.t - 0.02) : m.d;
        let to = m.to;
        if (m.f) { // slow zoom about the motif centre; shortened (gap < 3 s) = proportionally less zoom
          if (d < 0.6) return;
          const f = 1 + (m.f - 1) * (d / m.d);
          to = { x: 540 - f * (540 - cur.x), y: 355 - f * (355 - cur.y), scale: cur.scale * f };
        }
        if (d < 0.05) { FX.set(tl, CAM, { ...to, ...O }, m.t); cur = to; return; }
        FX.tween(tl, CAM, { ...cur, ...O }, { ...to, ...O, duration: d, ease: m.ease }, m.t);
        cur = to;
      });
    }
    const camA = view(L.pj.x, L.pj.y, 1.36, 430, 362);  // first image: "damals" big, right side open for "heute"
    const camP = view(540, -292, 1.3);                   // first image: damals | heute (later the "?" between them)
    const camO = view(540, 350, 0.96);                   // whole wall: 2017 | 2022 + 3 cards (the top row is out of view)
    const camCard1 = view(188, 512, 1.5);                // Karte 1, oben links noch der Rand des Fotos 2017 (Zeile 7)
    const camCard = (n) => view(L["c" + n].x, L["c" + n].y, 1.8);
    const camRow = view(540, 728, 1.0);                  // 3 cards + space below
    const camPhoto = view(212, 190, 1.5);                // fast zoom on 2017
    const camC = { x: -30, y: 25, scale: 1 };            // payoff: 2017 | notebook | end card (storyboard C)
    const camEnd = view(L.ec.x + 6, L.ec.y + 14, 1.66);  // end card hero

    // ---------------------------------------------------------------- 1 "Ich trade jetzt seit 9 Jahren": Polaroid "damals" (Kilian ganz jung) fliegt rein, Pin knallt
    // First frame = first image: the polaroid is already mid-flight (speed lines), the pin bangs at 0.25 s.
    FX.init(tl, "#a6-pjs", { rotation: -6, transformOrigin: swingOrigin(L.pj), smoothOrigin: false });
    FX.init(tl, "#a6-pjpin", { opacity: 0 });
    FX.flyIn(tl, "#a6-pj", 0, { from: "left", dist: 130 });
    FX.tween(tl, "#a6-speed", { opacity: 1 }, { opacity: 0, duration: 0.24, ease: "none" }, 0.06);
    FX.slam(tl, "#a6-pjpin", 0.25);
    FX.wobble(tl, "#a6-pjs", 0.25, 0.6, { origin: swingOrigin(L.pj) });
    FX.settle(tl, "#a6-pjs", 0.85, 6, { origin: swingOrigin(L.pj) });

    // 2 "trotzdem lass ich heute eine KI für mich traden": Polaroid "heute" (wie Kilian heute tradet) rechts daneben, kleiner Roboter
    go(C.trotzdem, 0.6, camP);
    preIn("ph");
    pinIn("ph", Math.max(C.trotzdem + 0.15, C.heute - 0.2), { from: "right" });
    FX.init(tl, "#a6-robot", { opacity: 0 });
    FX.pop(tl, "#a6-robot", Math.max(C.ki, C.heute + 0.5));
    slow(C.trotzdem + 0.62, 1.04);

    // 3 "Klingt erst mal verrückt": roter Zettel "?" knallt zwischen damals und heute und wackelt
    FX.init(tl, "#a6-q", { opacity: 0 });
    FX.init(tl, "#a6-qs", { rotation: -6, transformOrigin: "50% 100%", smoothOrigin: false }); // lands tilted, flows into the wobble
    FX.slam(tl, "#a6-q", C.verrueckt);
    const qw = FX.wobble(tl, "#a6-qs", C.verrueckt + 0.12, clamp(C.gruende - C.verrueckt - 0.5, 0.6, 2.4));
    FX.settle(tl, "#a6-qs", qw.end, qw.endRotation);

    // 4 "3 richtig gute Gründe": Zoom-out nach unten auf die Wand (2017 | 2022 hängen dort schon), 3 Karteikarten 1-2-3
    // werden unten angepinnt. damals | ? | heute gehen oben aus dem Bild (max. 5 Elemente).
    go(C.gruende, 0.6, camO);
    FX.fadeOut(tl, "#a6-q", C.gruende + 0.2);
    [1, 2, 3].forEach((n) => {
      preIn("c" + n);
      FX.init(tl, `#a6-c${n}b`, { opacity: 0, rotationY: -90, transformPerspective: 1100 });
      pinIn("c" + n, C.gruende + 0.25 + (n - 1) * 0.08, { from: "bottom", dist: 900 });
    });

    // 5 "Erstens": schnelles Ranzoomen auf Karte 1, sie dreht sich: keine Angst · keine Gier
    go(C.erstens, 0.4, camCard1, "power3.out");
    flip(1, C.erstens + 0.3);
    // 6 "diese 2 Gefühle": die zwei Gesichter werden rot durchgestrichen
    FX.drawLine(tl, "#a6-x1", C.gefuehle);
    FX.drawLine(tl, "#a6-x2", C.gefuehle + 0.25);

    // 7 "ich weiß, wovon ich rede": Kreis 2 s groß (cues.json kil), das Foto von 2017 wackelt kurz
    wiggle("#a6-p17s", C.rede + 0.15, swingOrigin(L.p17));

    // 8 "Zweitens": Zoom auf Karte 2, sie dreht sich: arbeitet, auch wenn ich keine Zeit habe (+ Uhr)
    go(C.zweitens, 0.5, camCard(2));
    flip(2, C.zweitens + 0.3);
    const sweep = clamp(C.schlafe - C.zweitens - 0.9, 0, 1.6);
    if (sweep > 0.4) FX.tween(tl, "#a6-minh", { rotation: 0, svgOrigin: "40 42", smoothOrigin: false }, { rotation: 360, svgOrigin: "40 42", smoothOrigin: false, duration: sweep, ease: "power1.inOut" }, C.zweitens + 0.7);
    // 9 "oder schlafe": nichts Neues (kein Mond, kein Bett), nur langsamer Zoom
    slow(C.schlafe);
    // 10 "funktioniert ohne mich": kleines Post-it "ohne mich ✓" auf Karte 2
    FX.init(tl, "#a6-pi2i", { opacity: 0 });
    FX.pop(tl, "#a6-pi2i", C.ohne);
    FX.draw(tl, "#a6-ck2", C.ohne + 0.2, 0.3);

    // 11 "Und drittens": Zoom auf Karte 3, sie dreht sich: 3 x 3 Punkte
    go(C.drittens, 0.5, camCard(3));
    flip(3, C.drittens + 0.3);
    slow(C.drittens + 0.6);
    // 12 "testet immer wieder": Haken / Striche nacheinander, 2 wechseln
    const first = ["c", "d", "c", "d", "c", "d", "c", "d", "d"];
    for (let i = 0; i < 9; i++) { FX.init(tl, `#a6-mc${i}`, { opacity: 0 }); FX.init(tl, `#a6-md${i}`, { opacity: 0 }); }
    first.forEach((m, i) => FX.pop(tl, `#a6-m${m}${i}`, C.testet + i * 0.13));
    const tSw = Math.max(C.darf, C.testet + 9 * 0.13 + 0.2);
    FX.fadeOut(tl, "#a6-mc2", tSw); FX.pop(tl, "#a6-md2", tSw + 0.1);
    FX.fadeOut(tl, "#a6-md5", tSw + 0.3); FX.pop(tl, "#a6-mc5", tSw + 0.4);

    // 13 "Das schafft kaum ein Mensch": Zoom-out auf alle 3 Karten
    go(C.mensch, 0.5, camRow);
    // 14 "neben einem Job schon gar nicht": gelbes Post-it darunter, rotes X knallt drauf
    FX.init(tl, "#a6-jobs", { opacity: 0 });
    FX.init(tl, "#a6-jobx", { opacity: 0 });
    FX.pop(tl, "#a6-jobs", C.job);
    FX.slam(tl, "#a6-jobx", Math.max(C.garnicht, C.job + 0.35));

    // 15 "Und jetzt kommt das Beste": schnelles Ranzoomen auf das Foto von 2017 (Karten 1, 2 + Post-its gehen außerhalb des Bildes).
    //    Cue "beste" = "kommt" (cues.json word 2): bei Tempo 1.1 folgt "Und" nur 0.36 s auf "gar nicht", so bleibt das rote X ~0.8 s stehen.
    go(C.beste, 0.4, camPhoto, "power3.out");
    FX.set(tl, ["#a6-c1", "#a6-c2", "#a6-job"], { opacity: 0 }, C.beste + 0.42);
    // 16 "keine 9 Jahre Erfahrung": gelbes Post-it "brauchst du nicht" auf das Foto
    FX.init(tl, "#a6-pi17i", { opacity: 0 });
    FX.pop(tl, "#a6-pi17i", C.erfahrung);
    slow(C.erfahrung + 0.35, 1.06);

    // 17 "setzt der Bot ganz allein": Karte 3 rutscht neben das Foto rechts oben (Briefing: 2026, jetzt 2022)
    go(C.bot, 0.5, camC);
    const c3to = { x: 578, y: 238 };
    FX.tween(tl, "#a6-c3", { x: 0, y: 0 }, { x: c3to.x - L.c3.x, y: c3to.y - L.c3.y, duration: 0.6, ease: "power2.inOut" }, C.bot + 0.15);
    FX.tween(tl, "#a6-c3s", { rotation: 0, transformOrigin: swingOrigin(L.c3), smoothOrigin: false }, { rotation: -3, transformOrigin: swingOrigin(L.c3), smoothOrigin: false, duration: 0.6, ease: "power2.inOut" }, C.bot + 0.15);

    // 18 "Was du brauchst": Notizbuchseite mit 3 leeren Kästchen wird angepinnt (deckt Karte 3 zu, 2022 geht: Storyboard C)
    FX.tween(tl, "#a6-p22", { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "none" }, C.brauchst);
    FX.tween(tl, "#a6-c3", { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "none" }, C.brauchst + 0.2); // liegt jetzt unter der Seite
    preIn("nb");
    pinIn("nb", C.brauchst + 0.05, { from: "top", dist: 900 });
    // 19-21 Kästchen werden abgehakt (Wort wird geschrieben, dann Haken), ohne Summe
    [["kapital", 0, 0], ["geduld", 1, 1], ["minuten", 2, 3]].forEach(([c, n, k]) => {
      FX.init(tl, `#a6-lb${n}`, { clipPath: "inset(0% 100% 0% 0%)" });
      wipe(`#a6-lb${n}`, C[c] - 0.1);
      FX.draw(tl, `#a6-ck${k}`, C[c] + 0.35, 0.3);
    });
    slow(C.minuten + 0.75, 1.05);

    // 22 "kein Gewinnversprechen": die Wand dimmt, Kilians Kreis auf Ø 360 px (cues.json kil), Wand zoomt langsam zurück
    FX.init(tl, "#a6-dim", { opacity: 0 });
    FX.tween(tl, "#a6-dim", { opacity: 0 }, { opacity: 0.5, duration: 0.3, ease: "power1.out" }, C.versprechen);
    go(C.aber, 3, camC, "none");

    // 23 "Am Sonntag, den 6.12." BAUSTEIN: End-Karte wird als Karte angepinnt, roter Faden 2017 -> Notizbuch -> End-Karte
    const T0 = C.sonntag;
    FX.init(tl, "#a6-ec", { opacity: 0 });
    FX.init(tl, "#a6-ecs", { rotation: -6, transformOrigin: swingOrigin(L.ec), smoothOrigin: false });
    FX.flyIn(tl, "#a6-ec", T0, { from: "right", dist: 900 });
    FX.wobble(tl, "#a6-ecs", T0 + 0.25, 0.6, { origin: swingOrigin(L.ec) });
    FX.settle(tl, "#a6-ecs", T0 + 0.85, 6, { origin: swingOrigin(L.ec) });
    const [x1, y1] = pinW(L.p17), [x2, y2] = pinW(L.nb), [x3, y3] = pinW(L.ec);
    $("#a6-thr").setAttribute("d", `M${x1} ${y1} Q${(x1 + x2) / 2} ${Math.max(y1, y2) + 26} ${x2} ${y2} Q${(x2 + x3) / 2} ${(y2 + y3) / 2 + 14} ${x3} ${y3}`);
    [[1, x1, y1], [2, x2, y2], [3, x3, y3]].forEach(([n, x, y]) => { const p = $(`#a6-tp${n}`); p.style.left = x + "px"; p.style.top = y + "px"; FX.init(tl, p, { opacity: 0 }); });
    FX.fadeIn(tl, "#a6-tp1", T0, 0.15);
    FX.fadeIn(tl, "#a6-tp2", T0 + 0.25, 0.15);
    FX.slam(tl, "#a6-tp3", T0 + 0.25);
    FX.draw(tl, "#a6-thr", T0 + 0.05, 0.75);
    const tZoom = clamp(C.uhr + 0.35, T0 + 0.9, Math.max(T0 + 0.9, C.bots - 0.65));
    go(tZoom, 0.6, camEnd);
    FX.tween(tl, "#a6-dim", { opacity: 0.5 }, { opacity: 0.7, duration: 0.6, ease: "power1.inOut" }, tZoom);
    FX.tween(tl, "#a6-nb", { opacity: 1 }, { opacity: 0, duration: 0.5, ease: "none" }, tZoom); // keine Textreste neben der Karte
    slow(Math.max(C.bots + 0.6, tZoom + 0.7), 1.035);
    slow(C.klick + 2.2, 0.97);
    // 24 "nur 10 Personen" BAUSTEIN: rotes Post-it "10 Plätze"   25 "Klick unter dem Video" BAUSTEIN: Touch tippt auf "Mehr dazu"
    FX.endCard(tl, "a6e", { start: T0, t18: C.uhr, bot: C.bots, klick: C.klick, platz: C.personen, pulseDate: C.letzte, dim: 0 });

    runCamera(camA);
    window.__timelines["ad6"] = tl;
  </script>
</template>
